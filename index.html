<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amara — The Yardstick | Recalibrate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --vio:#a78bfa;
  --vio-bright:#d8ccff;
  --vio-mid:#c4b5fd;
  --vio-deep:#4c1d95;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#05030d;font-family:'Outfit',sans-serif}
.scene{position:absolute;inset:0;transform-origin:50% 55%;animation:sceneDrift 16s ease-in-out infinite}
@keyframes sceneDrift{0%,100%{transform:scale(1)}50%{transform:scale(1.014)}}

/* ============ ROOM ============ */
.wall{position:absolute;top:0;left:0;right:0;height:62%;z-index:0;
  background-color:#1a0f38;
  background-image:
    radial-gradient(ellipse 70% 60% at 50% 30%, rgba(139,92,246,.16), transparent 75%),
    linear-gradient(rgba(196,181,253,.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(196,181,253,.09) 1px, transparent 1px);
  background-size:100% 100%,9vmin 9vmin,9vmin 9vmin;
  box-shadow:inset 0 -6vmin 10vmin rgba(0,0,0,.4)}
.floor{position:absolute;left:0;right:0;bottom:0;height:38%;z-index:0;
  background:
    radial-gradient(ellipse 65% 95% at 50% 18%, rgba(139,92,246,.26), transparent 72%),
    repeating-linear-gradient(to bottom, rgba(196,181,253,.07) 0 1px, transparent 1px 3.4vmin),
    linear-gradient(#241545,#0f0926)}
.beam{position:absolute;left:2%;top:2%;width:20vmin;height:92vmin;z-index:1;
  transform-origin:10% 6%;pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(216,204,255,.18) 45%, rgba(216,204,255,.1) 60%, transparent);
  filter:blur(.6vmin)}
.beam.b1{animation:beamSway 26s ease-in-out infinite}
.beam.b2{width:11vmin;opacity:.6;
  background:linear-gradient(90deg, transparent, rgba(216,204,255,.16) 50%, transparent);
  animation:beamSway 26s ease-in-out infinite reverse}
@keyframes beamSway{0%,100%{transform:rotate(36deg)}50%{transform:rotate(40deg)}}
.glow{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 58% 48% at 50% 60%, rgba(139,92,246,.22), transparent 72%);
  animation:roomGlow 9s ease-in-out infinite}
@keyframes roomGlow{0%,100%{opacity:.75}50%{opacity:1}}

/* ============ NAME ============ */
.name{position:absolute;top:5%;left:50%;transform:translateX(-50%);z-index:2;
  font-weight:900;font-size:clamp(3rem,15vmin,10.5rem);letter-spacing:.08em;white-space:nowrap;
  color:var(--vio-mid);
  animation:namePulse 6s ease-in-out infinite}
@keyframes namePulse{
  0%,100%{text-shadow:0 0 18px rgba(167,139,250,.95),0 0 60px rgba(139,92,246,.65),0 0 130px rgba(124,58,237,.4)}
  50%{text-shadow:0 0 28px rgba(196,181,253,1),0 0 90px rgba(139,92,246,.9),0 0 160px rgba(124,58,237,.55)}}

/* ============ WINDOW + skyline of other people's towers ============ */
.window{position:absolute;left:4%;top:10%;width:15vmin;height:18vmin;z-index:2;
  border:1vmin solid #3a256e;border-radius:.8vmin;
  background:linear-gradient(#7c58ee,#a78bfa 55%,#d8ccff);
  overflow:hidden;
  box-shadow:0 0 26px rgba(167,139,250,.55), inset 0 0 10px rgba(0,0,0,.35)}
.sun{position:absolute;left:3vmin;top:3.4vmin;width:3.6vmin;height:3.6vmin;border-radius:50%;
  background:radial-gradient(circle at 38% 32%, #ffffff, #f2ecff 45%, #c4b5fd);
  box-shadow:0 0 16px rgba(255,255,255,.9),0 0 34px rgba(216,204,255,.7);
  animation:sunDrift 30s ease-in-out infinite}
@keyframes sunDrift{0%,100%{transform:translateX(0)}50%{transform:translateX(1.8vmin)}}
.skyline{position:absolute;left:0;right:0;bottom:0;height:7.5vmin}
.bld{position:absolute;bottom:0;background:#241640;border-radius:.2vmin .2vmin 0 0}
.bld.a{left:2%;width:24%;height:100%}
.bld.b{left:30%;width:17%;height:70%;background:#2a1b55}
.bld.c{left:52%;width:26%;height:100%}
.bld.d{left:84%;width:14%;height:58%;background:#2a1b55}
.lw{position:absolute;width:.7vmin;height:.7vmin;background:#f2ecff;border-radius:.1vmin;
  box-shadow:0 0 4px rgba(255,255,255,.8);
  animation:twinkle 4s ease-in-out infinite}
.lw.w1{left:20%;top:25%}
.lw.w2{left:55%;top:55%;animation-delay:-2s}
.lw.w3{left:12%;top:60%;animation-delay:-1s}
.bld.c .lw{left:30%;top:30%;animation-delay:-3s}
.bld.c .lw2{left:60%;top:55%;animation-delay:-1.5s}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.wglow{position:absolute;inset:0;
  background:radial-gradient(circle at 50% 26%, rgba(255,255,255,.32), transparent 72%);
  animation:breath 8s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.6}50%{opacity:1}}
.wbarV{position:absolute;left:calc(50% - .4vmin);top:0;bottom:0;width:.8vmin;background:#3a256e}
.wbarH{position:absolute;top:calc(50% - .4vmin);left:0;right:0;height:.8vmin;background:#3a256e}
.floorlight{position:absolute;left:16%;bottom:20%;width:30vmin;height:10vmin;z-index:1;
  border-radius:50%;filter:blur(2.4vmin);
  background:radial-gradient(ellipse, rgba(216,204,255,.3), transparent 70%);
  animation:poolDrift 18s ease-in-out infinite}
@keyframes poolDrift{0%,100%{transform:translateX(-3vmin);opacity:.75}50%{transform:translateX(4vmin);opacity:1}}

/* ============ RACING CLOCK ============ */
.clock{position:absolute;left:38%;top:15%;width:7vmin;height:7vmin;z-index:2;border-radius:50%;
  background:radial-gradient(circle at 38% 32%, #2c1c58, #150e34 65%);
  border:2px solid rgba(196,181,253,.6);
  box-shadow:0 0 14px rgba(139,92,246,.5)}
.cticks{position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(rgba(196,181,253,.65) 0 1.2deg, transparent 1.2deg 30deg);
  -webkit-mask:radial-gradient(circle, transparent 0 78%, #000 80% 96%, transparent 98%);
  mask:radial-gradient(circle, transparent 0 78%, #000 80% 96%, transparent 98%)}
.mh{position:absolute;left:calc(50% - .15vmin);bottom:50%;width:.3vmin;height:2.7vmin;border-radius:.15vmin;
  background:#f2ecff;box-shadow:0 0 6px rgba(216,204,255,.9);
  transform-origin:center bottom;animation:handSpin 8s linear infinite}
.hh{position:absolute;left:calc(50% - .19vmin);bottom:50%;width:.38vmin;height:1.8vmin;border-radius:.19vmin;
  background:var(--vio-mid);box-shadow:0 0 6px rgba(167,139,250,.9);
  transform-origin:center bottom;animation:handSpin 56s linear infinite}
.cdot{position:absolute;left:50%;top:50%;width:1vmin;height:1vmin;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 35%, #f2ecff, #6d3ee0);box-shadow:0 0 6px rgba(216,204,255,.9)}
@keyframes handSpin{to{transform:rotate(360deg)}}

/* ============ MIRROR + SINK ============ */
.mirror{position:absolute;left:5%;top:30%;width:14vmin;height:10vmin;z-index:2;
  border-radius:1vmin;
  background:linear-gradient(135deg,#2c1c58,#151038 55%,#332160);
  border:2px solid rgba(196,181,253,.55);
  box-shadow:0 0 18px rgba(139,92,246,.4), inset 0 0 10px rgba(0,0,0,.5)}
.mirror::after{content:"";position:absolute;inset:.7vmin;border-radius:.7vmin;
  background:linear-gradient(120deg, rgba(255,255,255,.28), transparent 40%, rgba(216,204,255,.18));
  animation:shimmer 9s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:.4}50%{opacity:.8}}
.sink{position:absolute;left:4%;top:41%;width:16vmin;height:8vmin;z-index:2}
.faucet{position:absolute;left:6.5vmin;top:-2.6vmin;width:1vmin;height:3.4vmin;border-radius:.4vmin;
  background:linear-gradient(#8a76c8,#3a2864)}
.faucet::after{content:"";position:absolute;right:-1.4vmin;top:-.2vmin;width:2vmin;height:.9vmin;
  border-radius:.4vmin;background:#8a76c8}
.stream{position:absolute;left:7.3vmin;top:.7vmin;width:.55vmin;height:3.6vmin;border-radius:.3vmin;
  background:repeating-linear-gradient(180deg, rgba(255,255,255,.8) 0 .7vmin, rgba(216,204,255,.15) .7vmin 1.4vmin);
  animation:flow .6s linear infinite}
@keyframes flow{to{background-position:0 1.4vmin}}
.basin{position:absolute;left:0;right:0;bottom:0;height:4.6vmin;border-radius:1vmin 1vmin 1.6vmin 1.6vmin;
  background:linear-gradient(#3a2868,#1a1038);
  border:2px solid rgba(196,181,253,.5);
  box-shadow:inset 0 1vmin 2vmin rgba(0,0,0,.5), 0 4px 10px rgba(0,0,0,.5)}
.ripple{position:absolute;left:4.5vmin;top:2.5vmin;width:4.6vmin;height:1.5vmin;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.65);
  animation:ripplePulse 2.6s ease-out infinite}
.ripple.r2{animation-delay:-1.3s}
@keyframes ripplePulse{
  0%{transform:scale(.45);opacity:.65}
  100%{transform:scale(1.05);opacity:.05}}

/* ============ TOWEL ============ */
.towelzone{position:absolute;left:22.5%;top:13.5%;width:15vmin;z-index:2}
.rail{position:relative;height:1.1vmin;border-radius:.55vmin;
  background:linear-gradient(#8a76c8,#3a2864);
  box-shadow:0 2px 5px rgba(0,0,0,.6)}
.rail::before,.rail::after{content:"";position:absolute;top:-.6vmin;width:1.1vmin;height:2vmin;
  background:#5a4394;border-radius:.3vmin}
.rail::before{left:1.5vmin}
.rail::after{right:1.5vmin}
.towel{margin:0 2.2vmin;height:12.5vmin;border-radius:0 0 1vmin 1vmin;
  background:repeating-linear-gradient(90deg,#4d3884 0 3.2vmin,#2b1b52 3.2vmin 6.4vmin);
  box-shadow:inset 0 -1vmin 2vmin rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.5);
  transform-origin:top center;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}

/* ============ GOALS RISING FOREVER (ladder) ============ */
.ladder{position:absolute;right:4%;top:0;width:13vmin;height:70vmin;z-index:2;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 14%, #000 100%);
  mask-image:linear-gradient(to bottom, transparent 0, #000 14%, #000 100%)}
.laddercol{position:absolute;inset:0;animation:ladderRise 9s linear infinite}
@keyframes ladderRise{to{transform:translateY(-10.5vmin)}}
.lg{position:absolute;left:0;width:13vmin;height:9.5vmin;border-radius:.7vmin;
  border:2.5px dashed rgba(196,181,253,.65);
  box-shadow:0 0 10px rgba(139,92,246,.2), inset 0 0 8px rgba(139,92,246,.12)}
.lg .bar{position:absolute;left:16%;height:.6vmin;border-radius:.3vmin;background:rgba(196,181,253,.25)}
.lg .bar.b1{top:24%;right:16%}
.lg .bar.b2{top:40%;right:34%}
.lg .bar.b3{top:56%;right:48%}
.lg .ring{position:absolute;right:13%;top:20%;width:3vmin;height:3vmin;border-radius:50%;
  border:2px dashed rgba(196,181,253,.55)}

/* ============ ACHIEVED FRAMES (fixed, below the rising goals) ============ */
.frames{position:absolute;right:4%;top:60.5vmin;width:13vmin;height:31vmin;z-index:2}
.f{position:absolute;left:0;width:13vmin;height:9.5vmin;border-radius:.7vmin;
  background:linear-gradient(150deg,#241746,#140d2c);
  border:.9vmin solid #453070;
  box-shadow:0 6px 12px rgba(0,0,0,.5), inset 0 0 10px rgba(0,0,0,.45)}
.f .bar{position:absolute;left:16%;height:.6vmin;border-radius:.3vmin;background:rgba(196,181,253,.3)}
.f .bar.b1{top:24%;right:16%}
.f .bar.b2{top:40%;right:34%}
.f .bar.b3{top:56%;right:48%}
.f .medal{position:absolute;right:13%;top:20%;width:3vmin;height:3vmin;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #c4b5fd, #6d3ee0);
  box-shadow:0 0 14px rgba(167,139,250,.75)}
.f.d1{top:0}
.f.d2{top:10.5vmin}
.f.d3{top:21vmin}

/* ============ HER — pacing behind the scale ============ */
.pacer{position:absolute;left:50%;bottom:7%;width:40vmin;height:68vmin;margin-left:-20vmin;z-index:3;
  animation:pace 16s ease-in-out infinite}
@keyframes pace{
  0%{transform:translateX(-16vmin)}
  50%{transform:translateX(16vmin)}
  100%{transform:translateX(-16vmin)}}
.lean{position:absolute;inset:0;animation:lean 16s ease-in-out infinite}
@keyframes lean{
  0%{transform:rotate(0deg)}
  25%{transform:rotate(2deg)}
  50%{transform:rotate(0deg)}
  75%{transform:rotate(-2deg)}
  100%{transform:rotate(0deg)}}
.flip{position:absolute;inset:0;animation:flip 16s linear infinite}
@keyframes flip{
  0%,49.6%{transform:scaleX(1)}
  50.4%,100%{transform:scaleX(-1)}}
.bob{position:absolute;inset:0;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.45vmin)}}
.herglow{position:absolute;left:62.5%;top:75%;width:28vmin;height:28vmin;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;opacity:.7;
  background:radial-gradient(circle, rgba(216,204,255,.22), transparent 70%);
  animation:phonePulse 5s ease-in-out infinite}
@keyframes phonePulse{0%,100%{opacity:.45}50%{opacity:.95}}
.figshadow{position:absolute;left:50%;bottom:-1vmin;width:24vmin;height:2.6vmin;
  transform:translateX(-50%);border-radius:50%;filter:blur(.3vmin);
  background:radial-gradient(ellipse, rgba(0,0,0,.65), transparent 70%);
  animation:shadowBreath 3.8s ease-in-out infinite}
@keyframes shadowBreath{0%,100%{transform:translateX(-50%) scaleX(1);opacity:.75}50%{transform:translateX(-50%) scaleX(1.05);opacity:.9}}
.fig{position:absolute;inset:0;width:100%;height:100%;
  filter:drop-shadow(0 0 9px rgba(167,139,250,.5))}
.fig .body{fill:#08041a;stroke:rgba(216,204,255,.38);stroke-width:1.3}
.fig .limb{fill:none;stroke:#08041a;stroke-width:10.5;stroke-linecap:round}
.fig .pony{transform-box:fill-box;transform-origin:15% 10%;
  animation:tailSway 3.4s ease-in-out infinite}
@keyframes tailSway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.fig .legL{transform-box:fill-box;transform-origin:50% 4%;
  animation:stride 1.3s ease-in-out infinite}
.fig .legR{transform-box:fill-box;transform-origin:50% 4%;
  animation:stride 1.3s ease-in-out infinite;animation-delay:-.65s}
@keyframes stride{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.fig .torso{transform-box:fill-box;transform-origin:50% 100%;
  animation:breatheT 3.8s ease-in-out infinite}
@keyframes breatheT{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.016)}}
.fig .armL{transform-box:fill-box;transform-origin:50% 8%;
  animation:armLsway 5s ease-in-out infinite}
@keyframes armLsway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.fig .armR{transform-box:fill-box;transform-origin:31% 42%;
  animation:armRsway 6s ease-in-out infinite}
@keyframes armRsway{0%,100%{transform:rotate(1.5deg)}50%{transform:rotate(-1.5deg)}}
.fig .head{transform-box:fill-box;transform-origin:50% 88%;
  animation:headLook 11s ease-in-out infinite}
@keyframes headLook{
  0%,28%{transform:rotate(8deg)}
  40%,56%{transform:rotate(-3deg)}
  68%,100%{transform:rotate(8deg)}}
.fig .phoneGlow{opacity:.8;animation:phonePulse 5s ease-in-out infinite}
.fig .bars{animation:barsScroll 3.5s linear infinite}
@keyframes barsScroll{to{transform:translateY(-9.2px)}}

/* ============ THE SCALE (in front of her, facing us) ============ */
.mat{position:absolute;left:50%;bottom:3.2%;width:54vmin;height:8vmin;
  transform:translateX(-50%);border-radius:50%;filter:blur(.25vmin);
  background:repeating-linear-gradient(90deg, rgba(124,58,237,.35) 0 3.5vmin, rgba(76,29,149,.2) 3.5vmin 7vmin)}
.scalezone{position:absolute;left:50%;bottom:5%;width:30vmin;height:20vmin;
  margin-left:-15vmin;z-index:4}
.plate{position:absolute;left:0;right:0;bottom:0;height:11vmin;border-radius:2vmin;
  background:
    repeating-linear-gradient(90deg, rgba(196,181,253,.14) 0 1.4vmin, transparent 1.4vmin 2.8vmin),
    linear-gradient(#54368f,#2a1a56 70%,#1c1240);
  border:2px solid rgba(196,181,253,.6);
  box-shadow:0 14px 26px rgba(0,0,0,.6), 0 0 34px rgba(139,92,246,.5), inset 0 .8vmin 1.6vmin rgba(255,255,255,.3)}
.sweep{position:absolute;left:50%;bottom:9.4vmin;width:10vmin;height:1.8vmin;border-radius:1vmin;
  filter:blur(.4vmin);
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  animation:plateSweep 9s ease-in-out infinite}
@keyframes plateSweep{0%,100%{transform:translateX(-8vmin)}50%{transform:translateX(8vmin)}}
.console{position:absolute;left:50%;bottom:7.5vmin;transform:translateX(-50%);
  width:17vmin;height:6.8vmin;border-radius:1.2vmin;
  background:linear-gradient(#3a2a68,#1a1140);
  border:2px solid rgba(196,181,253,.65);
  box-shadow:0 0 20px rgba(139,92,246,.6), inset 0 0 8px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center}
.readwin{display:flex;gap:.35vmin;padding:.3vmin;border-radius:.7vmin;
  background:#0d0820;border:1.5px solid rgba(196,181,253,.6);
  box-shadow:0 0 14px rgba(139,92,246,.6), inset 0 0 6px rgba(0,0,0,.7)}
.odocol{width:3.4vmin;height:4.8vmin;overflow:hidden;border-radius:.35vmin;
  background:rgba(8,5,20,.95);box-shadow:inset 0 0 6px rgba(0,0,0,.8)}
.strip{position:relative}
.strip span{display:block;height:4.8vmin;line-height:4.8vmin;
  font-size:3vmin;font-weight:800;text-align:center;
  color:#f2ecff;text-shadow:0 0 8px rgba(216,204,255,.85),0 0 18px rgba(167,139,250,.6)}
.s1{animation:roll 10s linear infinite}
.s10{animation:roll 100s linear infinite;animation-delay:-25s;transform:translateY(-24vmin)}
.s100{animation:roll 1000s linear infinite;animation-delay:-50s;transform:translateY(-4.8vmin)}
@keyframes roll{to{transform:translateY(-50%)}}
.wheel{position:absolute;right:1.2vmin;bottom:.8vmin;width:5vmin;height:5vmin;border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #4d3a86, #221246 70%);
  border:2px solid rgba(196,181,253,.65);
  box-shadow:0 0 16px rgba(139,92,246,.6);
  animation:wheelSpin 18s linear infinite}
.wheel::before{content:"";position:absolute;left:12%;right:12%;top:calc(50% - .25vmin);
  height:.5vmin;border-radius:.25vmin;
  background:#f2ecff;box-shadow:0 0 8px rgba(216,204,255,.9)}
@keyframes wheelSpin{to{transform:rotate(360deg)}}

/* ============ AMBIENT ============ */
.steam{position:absolute;z-index:2;pointer-events:none;filter:blur(1.4vmin);
  border-radius:50%;opacity:0;animation:steamUp linear infinite}
.st1{left:7%;bottom:34%;width:6vmin;height:9vmin;
  background:radial-gradient(ellipse, rgba(216,204,255,.13), transparent 70%);
  animation-duration:22s}
.st2{left:11%;bottom:36%;width:5vmin;height:8vmin;
  background:radial-gradient(ellipse, rgba(216,204,255,.11), transparent 70%);
  animation-duration:28s;animation-delay:-12s}
.st3{left:9%;bottom:33%;width:4vmin;height:7vmin;
  background:radial-gradient(ellipse, rgba(216,204,255,.1), transparent 70%);
  animation-duration:25s;animation-delay:-19s}
@keyframes steamUp{0%{transform:translateY(0);opacity:0}25%{opacity:.8}100%{transform:translateY(-20vmin);opacity:0}}
.dust{position:absolute;inset:0;z-index:5;pointer-events:none}
.p{position:absolute;border-radius:50%;background:var(--vio-mid);
  box-shadow:0 0 9px rgba(196,181,253,1);opacity:.55;
  animation:floatUp linear infinite}
.p1{left:9%;bottom:14%;width:4px;height:4px;animation-duration:19s;animation-delay:-3s}
.p2{left:22%;bottom:6%;width:6px;height:6px;animation-duration:23s;animation-delay:-11s}
.p3{left:35%;bottom:20%;width:4px;height:4px;animation-duration:16s;animation-delay:-7s}
.p4{left:47%;bottom:8%;width:5px;height:5px;animation-duration:21s;animation-delay:-15s}
.p5{left:58%;bottom:26%;width:4px;height:4px;animation-duration:18s;animation-delay:-2s}
.p6{left:66%;bottom:12%;width:6px;height:6px;animation-duration:24s;animation-delay:-9s}
.p7{left:78%;bottom:18%;width:4px;height:4px;animation-duration:17s;animation-delay:-13s}
.p8{left:88%;bottom:8%;width:5px;height:5px;animation-duration:22s;animation-delay:-5s}
.p9{left:15%;bottom:32%;width:4px;height:4px;animation-duration:20s;animation-delay:-17s}
.p10{left:28%;bottom:40%;width:5px;height:5px;animation-duration:21s;animation-delay:-8s}
.p11{left:60%;bottom:44%;width:4px;height:4px;animation-duration:18s;animation-delay:-14s}
.p12{left:80%;bottom:36%;width:5px;height:5px;animation-duration:23s;animation-delay:-6s}
@keyframes floatUp{
  0%{transform:translateY(0);opacity:0}
  12%{opacity:.6}
  85%{opacity:.5}
  100%{transform:translateY(-88vh);opacity:0}}
.vignette{position:absolute;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 62%, rgba(0,0,0,.38))}

/* ============ SEAL ============ */
.seal{position:absolute;right:2.6vmin;bottom:2.6vmin;z-index:10;
  width:15vmin;height:15vmin;opacity:.95;
  animation:sealPulse 4s ease-in-out infinite}
.seal .ringA{fill:none;stroke:var(--vio-mid);stroke-width:2.5}
.seal .ringB{fill:none;stroke:rgba(196,181,253,.8);stroke-width:1.5}
.seal .txt{fill:#f2ecff;font-family:'Outfit',sans-serif;font-weight:800;
  font-size:10.5px;letter-spacing:2px}
.seal .dot{fill:var(--vio-mid)}
.seal .core{fill:#f2ecff}
@keyframes sealPulse{
  0%,100%{filter:drop-shadow(0 0 6px rgba(196,181,253,.7))}
  50%{filter:drop-shadow(0 0 16px rgba(196,181,253,1))}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important}
  .pacer{transform:translateX(-22vmin)}
  .steam{display:none}
  .ripple{opacity:.45;transform:scale(.8)}
  .ripple.r2{display:none}
  .herglow{opacity:.7}
  .fig .phoneGlow{opacity:.8}
  .p{opacity:.5}
}
</style>
</head>
<body>

<div class="scene">
<div class="wall"></div>
<div class="floor"></div>
<div class="beam b1"></div>
<div class="beam b2"></div>
<div class="glow"></div>

<div class="name">AMARA</div>

<div class="window">
  <div class="sun"></div>
  <div class="skyline">
    <div class="bld a"><div class="lw w1"></div><div class="lw w3"></div></div>
    <div class="bld b"><div class="lw w2"></div></div>

  </div>
  <div class="wglow"></div>
  <div class="wbarV"></div>
  <div class="wbarH"></div>
</div>
<div class="floorlight"></div>

<div class="clock">
  <div class="cticks"></div>
  <div class="mh"></div>
  <div class="hh"></div>
  <div class="cdot"></div>
</div>

<div class="mirror"></div>

<div class="sink">
  <div class="faucet"></div>
  <div class="stream"></div>
  <div class="basin"></div>
  <div class="ripple"></div>

</div>

<div class="towelzone">
  <div class="rail"></div>
  <div class="towel"></div>
</div>

<!-- goals rising forever, out from behind her achieved frames -->
<div class="ladder">
  <div class="laddercol">
    <div class="lg" style="bottom:-10.5vmin"><div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="ring"></div></div>
    <div class="lg" style="bottom:0"><div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="ring"></div></div>
    <div class="lg" style="bottom:10.5vmin"><div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="ring"></div></div>
    <div class="lg" style="bottom:21vmin"><div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="ring"></div></div>
    <div class="lg" style="bottom:31.5vmin"><div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="ring"></div></div>
    <div class="lg" style="bottom:42vmin"><div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="ring"></div></div>
    <div class="lg" style="bottom:52.5vmin"><div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="ring"></div></div>
    <div class="lg" style="bottom:63vmin"><div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="ring"></div></div>
    <div class="lg" style="bottom:73.5vmin"><div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="ring"></div></div>
  </div>
</div>

<div class="frames">
  <div class="f d1"><div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="medal"></div></div>
  <div class="f d2"><div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="medal"></div></div>
  <div class="f d3"><div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="medal"></div></div>
</div>

<!-- HER — pacing behind the scale, phone in hand -->
<div class="pacer">
  <div class="herglow"></div>
  <div class="figshadow"></div>
  <div class="lean">
    <div class="flip">
      <div class="bob">
        <svg class="fig" viewBox="0 0 100 170">
          <defs>
            <linearGradient id="coneGrad" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0" stop-color="rgba(216,204,255,.4)"/>
              <stop offset="1" stop-color="rgba(216,204,255,0)"/>
            </linearGradient>
            <radialGradient id="phoneGlowG">
              <stop offset="0" stop-color="rgba(216,204,255,.55)"/>
              <stop offset="1" stop-color="rgba(216,204,255,0)"/>
            </radialGradient>
            <clipPath id="scr"><rect x="56.8" y="30.5" width="11.4" height="18" rx="1.2"/></clipPath>
          </defs>

          <!-- ponytail -->
          <path class="pony body" d="M54 8 Q68 5 67 22 Q66 33 58 37 Z"/>

          <!-- legs, sidestepping -->
          <path class="limb legL" d="M44 88 Q42 120 41 166"/>
          <path class="limb legR" d="M56 88 Q58 120 58 166"/>

          <g class="torso">
            <path class="body" d="M36 30 Q50 23 62 31 L68 86 Q50 94 32 86 Z"/>
            <path class="limb armL" d="M38 36 Q30 50 33 62"/>
            <g class="head">
              <circle class="body" cx="49" cy="16" r="11"/>
            </g>
            <g class="armR">
              <path class="limb" d="M58 32 Q70 35 73 42 Q71 50 65.5 52"/>
              <circle class="phoneGlow" cx="62.5" cy="41" r="20" fill="url(#phoneGlowG)"/>
              <polygon class="phoneGlow" points="56,29 69,29 73,16 51,16" fill="url(#coneGrad)"/>
              <rect x="55" y="28" width="15" height="26" rx="1.6" fill="#0d0820" stroke="rgba(196,181,253,.9)" stroke-width=".9"/>
              <rect x="56.8" y="30.5" width="11.4" height="18" rx="1.2" fill="#0b0718"/>
              <g clip-path="url(#scr)">
                <g class="bars">
                  <rect x="58" y="32"   width="8.6" height="3.4" rx=".6" fill="#f2ecff" opacity=".95"/>
                  <rect x="58" y="36.6" width="8.6" height="2"   rx=".6" fill="#a78bfa" opacity=".9"/>
                  <rect x="58" y="41.2" width="8.6" height="3.4" rx=".6" fill="#f2ecff" opacity=".95"/>
                  <rect x="58" y="45.8" width="8.6" height="2"   rx=".6" fill="#a78bfa" opacity=".9"/>
                  <rect x="58" y="50.4" width="8.6" height="3.4" rx=".6" fill="#f2ecff" opacity=".95"/>
                  <rect x="58" y="55"   width="8.6" height="2"   rx=".6" fill="#a78bfa" opacity=".9"/>
                  <rect x="58" y="59.6" width="8.6" height="3.4" rx=".6" fill="#f2ecff" opacity=".95"/>
                  <rect x="58" y="64.2" width="8.6" height="2"   rx=".6" fill="#a78bfa" opacity=".9"/>
                  <rect x="58" y="68.8" width="8.6" height="3.4" rx=".6" fill="#f2ecff" opacity=".95"/>
                  <rect x="58" y="73.2" width="8.6" height="2"   rx=".6" fill="#a78bfa" opacity=".9"/>
                </g>
              </g>
              <rect x="59.8" y="50.4" width="5.4" height=".9" rx=".45" fill="rgba(196,181,253,.7)"/>
            </g>
          </g>
        </svg>
      </div>
    </div>
  </div>
</div>

<!-- the scale, in front of her, display facing us -->
<div class="mat"></div>
<div class="scalezone">
  <div class="plate"></div>
  <div class="console">
    <div class="readwin">
      <div class="odocol"><div class="strip s100">
        <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span>
        <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span>
      </div></div>
      <div class="odocol"><div class="strip s10">
        <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span>
        <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span>
      </div></div>

      </div></div>
    </div>
  </div>
  <div class="sweep"></div>
  <div class="wheel"></div>
</div>

<div class="steam st1"></div>
<div class="steam st2"></div>
<div class="steam st3"></div>
<div class="dust">
  <span class="p p1"></span><span class="p p2"></span><span class="p p3"></span>
  <span class="p p4"></span><span class="p p5"></span><span class="p p6"></span>
  <span class="p p7"></span><span class="p p8"></span><span class="p p9"></span>
  <span class="p p10"></span><span class="p p11"></span><span class="p p12"></span>
</div>
<div class="vignette"></div>
</div>

  <defs><path id="sealArc" d="M 16 60 A 44 44 0 0 1 104 60"/></defs>
  <circle class="ringA" cx="60" cy="60" r="54"/>
  <circle class="ringB" cx="60" cy="60" r="43"/>

</svg>

</body>
