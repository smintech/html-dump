<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEREK — The Anchor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; }
  body { font-family:'Outfit', system-ui, sans-serif; }

  .stage { position:fixed; inset:0; }

  /* ---- faint water light from above ---- */
  .ambient {
    position:absolute; top:-25%; left:50%; transform:translateX(-50%);
    width:130vmin; height:70vmin; z-index:0;
    background: radial-gradient(closest-side, rgba(70,110,150,.14), transparent 70%);
  }

  /* ---- stage glow: rust ---- */
  .glow {
    position:absolute; left:50%; top:56%;
    width:120vmin; height:120vmin;
    transform:translate(-50%,-50%);
    background: radial-gradient(closest-side, currentColor, transparent 72%);
    color:#e0813a;
    z-index:0;
    animation: glowPulse 5s ease-in-out infinite;
  }
  @keyframes glowPulse { 0%,100% { opacity:.10 } 50% { opacity:.17 } }

  /* ---- title watermark ---- */
  .title-block { position:absolute; top:9%; left:0; right:0; text-align:center; z-index:5; }
  .name {
    font-size: clamp(64px, 23vmin, 340px);
    font-weight:800; line-height:.95; letter-spacing:.03em;
    color:#e0813a;
    text-shadow: 0 0 18px rgba(224,129,58,.55), 0 0 60px rgba(224,129,58,.28);
    white-space:nowrap;
  }
  .theme-label {
    display:inline-block; margin-top:1.6vmin;
    font-size: clamp(10px, 2.4vmin, 26px); font-weight:600;
    letter-spacing:.6em; padding-left:.6em;
    color:#ffe9d6;
    text-shadow: 0 0 14px rgba(224,129,58,.5);
  }

  /* ---- current streaks: the water moving while he doesn't ---- */
  .current {
    position:absolute; left:0; height:2px; border-radius:2px; z-index:1;
    width:26vmin;
    background: linear-gradient(90deg, transparent, rgba(150,180,205,.25), transparent);
    animation: flow linear infinite;
  }
  .c1 { top:30%; animation-duration:9s; }
  .c2 { top:44%; animation-duration:12s; animation-delay:3s; }
  .c3 { top:58%; animation-duration:8s;  animation-delay:5s; }
  .c4 { top:70%; animation-duration:11s; animation-delay:7s; }
  @keyframes flow { from { transform:translateX(-30vw) } to { transform:translateX(120vw) } }

  /* ---- seabed ---- */
  .seabed {
    position:absolute; bottom:-4vmin; left:-10vw; width:120vw; height:16vmin;
    background: linear-gradient(#2a2018, #0d0906 70%);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    border-top: 2px solid rgba(200,160,110,.18);
    box-shadow: 0 -1vmin 3vmin rgba(0,0,0,.8);
    z-index:2;
  }

  /* ---- starfish: settled on the seabed, slowly breathing ---- */
  .starfish { position:absolute; left:calc(50% - 36vmin); bottom:5.5vmin; width:9vmin; z-index:2.6; }
  .starfish svg { display:block; width:100%; animation: breathe 6s ease-in-out infinite alternate; }
  @keyframes breathe { from { transform: scale(1) } to { transform: scale(1.04) } }

  /* ---- seaweed: rooted, but bends with every current ---- */
  .seaweed { position:absolute; z-index:2.5; transform-origin:50% 100%; }
  .seaweed svg { display:block; width:100%; }
  .sw-back  { left: calc(50% - 32vmin); width:12vmin; bottom:12vmin; animation: sway 5.5s ease-in-out infinite alternate; }
  .sw-back2 { left: calc(50% - 44vmin); width:9vmin;  bottom:12vmin; animation: sway 6.5s ease-in-out infinite alternate-reverse; }
  .sw-front { left: calc(50% + 24vmin); width:10vmin; bottom:11vmin; z-index:4.5; animation: sway 4.2s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-4deg) } to { transform: rotate(4deg) } }

  /* ---- drifting objects: the same fish, the same bottle, every cycle ---- */
  .drift { position:absolute; left:0; z-index:3; will-change:transform; }
  .drift svg { display:block; width:14vmin; min-width:50px; }
  .fishA-track  { top:42%; animation: crossA 24s linear infinite; }
  .bottle-track { top:52%; animation: crossB 24s linear infinite; }
  .fishB-track  { top:60%; animation: crossC 24s linear infinite; }
  .fishC-track  { top:33%; animation: crossD 24s linear infinite; }
  .jelly-track  { top:26%; animation: crossRev 30s linear infinite; }
  .jelly-track svg { width:12vmin; min-width:44px; }
  .crab-track   { bottom:4.5vmin; z-index:4.6; animation: crossCrab 26s linear infinite; }
  .crab-track svg { width:16vmin; min-width:58px; animation: crabBob .45s ease-in-out infinite alternate; }
  @keyframes crabBob { from { transform: translateY(0) } to { transform: translateY(-1.5px) } }

  .bob { animation: bob 2.2s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(-1vmin) } to { transform: translateY(1vmin) } }
  .jelly-bob { animation: bobSlow 3.5s ease-in-out infinite alternate; }
  @keyframes bobSlow { from { transform: translateY(-1.5vmin) } to { transform: translateY(1.5vmin) } }
  .tumble { animation: tumble 9s linear infinite; }
  @keyframes tumble { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
  .tail { transform-box:view-box; transform-origin:18px 30px; animation: tailWag .45s ease-in-out infinite alternate; }
  @keyframes tailWag { from { transform: rotate(9deg) } to { transform: rotate(-9deg) } }

  .bell { transform-box:fill-box; transform-origin:50% 20%; animation: bellPulse 2.6s ease-in-out infinite alternate; }
  @keyframes bellPulse { from { transform: scaleY(.92) } to { transform: scaleY(1.05) } }
  .tent { transform-box:fill-box; transform-origin:50% 0; animation: tentSway 3s ease-in-out infinite alternate; }
  @keyframes tentSway { from { transform: rotate(-2.5deg) } to { transform: rotate(2.5deg) } }

  .leg { transform-box:fill-box; transform-origin:50% 0; animation: legScuttle .32s ease-in-out infinite alternate; }
  .l2 { animation-delay:.08s } .l3 { animation-delay:.16s } .l4 { animation-delay:.24s }
  .l5 { animation-delay:.12s } .l6 { animation-delay:.2s }
  @keyframes legScuttle { from { transform: rotate(6deg) } to { transform: rotate(-6deg) } }
  .claw-l { transform-box:fill-box; transform-origin:90% 100%; animation: clawL 1.3s ease-in-out infinite alternate; }
  .claw-r { transform-box:fill-box; transform-origin:10% 100%; animation: clawR 1.3s ease-in-out infinite alternate; }
  @keyframes clawL { from { transform: rotate(0deg) } to { transform: rotate(-9deg) } }
  @keyframes clawR { from { transform: rotate(0deg) } to { transform: rotate(9deg) } }

  @keyframes crossA { 0% { transform:translateX(-30vw) } 40% { transform:translateX(120vw) } 100% { transform:translateX(120vw) } }
  @keyframes crossB { 0%, 22% { transform:translateX(-30vw) } 70% { transform:translateX(120vw) } 100% { transform:translateX(120vw) } }
  @keyframes crossC { 0%, 52% { transform:translateX(-30vw) } 94% { transform:translateX(120vw) } 100% { transform:translateX(120vw) } }
  @keyframes crossD { 0%, 6% { transform:translateX(-30vw) } 48% { transform:translateX(120vw) } 100% { transform:translateX(120vw) } }
  @keyframes crossRev { 0% { transform:translateX(115vw) } 78% { transform:translateX(-35vw) } 100% { transform:translateX(-35vw) } }
  @keyframes crossCrab { 0% { transform:translateX(-25vw) } 88% { transform:translateX(115vw) } 100% { transform:translateX(115vw) } }

  /* ---- the chain: rusty, rises from the anchor, snapped at the top ---- */
  .chain-wrap {
    position:absolute; left:50%; bottom:48vmin; margin-left:-3vmin;
    width:6vmin; height:40vmin; z-index:3;
    transform-origin:50% 100%;
    animation: chainSway 7s ease-in-out infinite alternate;
  }
  .chain-wrap svg { display:block; width:100%; height:100%; }
  @keyframes chainSway { from { transform: rotate(-1.6deg) } to { transform: rotate(1.6deg) } }
  .chain-top { transform-box:view-box; transform-origin:40px 92px; animation: dangle 4s ease-in-out infinite alternate; }
  @keyframes dangle { from { transform: rotate(-6deg) } to { transform: rotate(6deg) } }

  /* ---- the anchor: zero animation. that is the point. ---- */
  .anchor-wrap {
    position:absolute; left:50%; bottom:8vmin;
    transform:translateX(-50%);
    width: min(40vmin, 64vw);
    z-index:4;
  }
  .anchor-wrap svg { display:block; width:100%; }

  /* ---- rust flakes falling off ---- */
  .flake {
    position:absolute; width:7px; height:7px; z-index:4.5;
    background:#8a4a26;
    clip-path: polygon(50% 0, 100% 40%, 75% 100%, 20% 85%);
    opacity:0;
    animation: fall 6s linear infinite;
  }
  .f1 { left:calc(50% - 10vmin); top:48%; animation-delay:0s; }
  .f2 { left:calc(50% - 4vmin);  top:56%; animation-delay:2.2s; }
  .f3 { left:calc(50% + 2vmin);  top:50%; animation-delay:4s; }
  .f4 { left:calc(50% + 8vmin);  top:58%; animation-delay:1.1s; }
  .f5 { left:calc(50% + 12vmin); top:46%; animation-delay:3.3s; }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); opacity:0 }
    10%  { opacity:.9 }
    100% { transform: translateY(15vmin) rotate(55deg); opacity:0 }
  }

  /* ---- bubbles rising past him ---- */
  .bubble {
    position:absolute; border-radius:50%; z-index:4.5;
    border:1.5px solid rgba(170,205,230,.4);
    background: rgba(170,205,230,.08);
    opacity:0;
    animation: rise 8s linear infinite;
  }
  .b1 { width:8px;  height:8px;  left:calc(50% - 14vmin); top:52%; animation-delay:0s; }
  .b2 { width:12px; height:12px; left:calc(50% + 15vmin); top:56%; animation-delay:2.5s; }
  .b3 { width:6px;  height:6px;  left:calc(50% - 6vmin);  top:48%; animation-delay:4.5s; }
  .b4 { width:10px; height:10px; left:calc(50% + 7vmin);  top:60%; animation-delay:6s; }
  .b5 { width:7px;  height:7px;  left:calc(50% + 20vmin); top:50%; animation-delay:1.2s; }
  .b6 { width:9px;  height:9px;  left:calc(50% - 20vmin); top:58%; animation-delay:3.6s; }
  .b7 { width:6px;  height:6px;  left:calc(50% + 12vmin); top:46%; animation-delay:5.4s; }
  @keyframes rise {
    0%   { transform: translateY(0); opacity:0 }
    15%  { opacity:.7 }
    100% { transform: translateY(-30vmin); opacity:0 }
  }

  /* ---- corner stamp: glowing circular seal ---- */
  .stamp {
    position:absolute; right:2.4vmin; bottom:2vmin;
    width: clamp(72px, 15vmin, 150px);
    z-index:6; opacity:.95;
  }
  .stamp svg {
    display:block; width:100%; height:auto;
    filter: drop-shadow(0 0 8px rgba(224,129,58,.6));
    animation: stampPulse 3s ease-in-out infinite;
  }
  .seal-ring { stroke:#e0813a; }
  .seal-text {
    font-family:'Outfit', system-ui, sans-serif;
    font-weight:800; font-size:13px; letter-spacing:2px;
    fill:#ffd9ae;
  }
  .seal-dot { fill:#e0813a; }
  @keyframes stampPulse {
    0%,100% { filter: drop-shadow(0 0 6px rgba(224,129,58,.5)); }
    50%     { filter: drop-shadow(0 0 15px rgba(224,129,58,.95)); }
  }

  /* ---- reduced motion: one still frame ---- */
  .fish-static { display:none; position:absolute; top:50%; left:calc(50% + 26vmin); z-index:3; }
  .fish-static svg { display:block; width:14vmin; min-width:50px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .drift { display:none; }
    .fish-static { display:block; }
    .flake { opacity:.7; }
    .bubble { opacity:.5; }
  }
</style>
</head>
<body>
<div class="stage">

  <div class="ambient"></div>
  <div class="glow"></div>

  <div class="title-block">
    <div class="name">DEREK</div>
    <div class="theme-label">THE ANCHOR</div>
  </div>

  <div class="current c1"></div>
  <div class="current c2"></div>
  <div class="current c3"></div>
  <div class="current c4"></div>

  <div class="seabed"></div>

  <!-- starfish settled beside him -->
  <div class="starfish">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,8 60,37 91,37 66,56 75,87 50,69 25,87 34,56 9,37 40,37" fill="#a85a3c"/>
      <polygon points="50,22 57,42 78,42 61,55 67,76 50,64 33,76 39,55 22,42 43,42" fill="#c06a45" opacity=".7"/>
      <circle cx="50" cy="30" r="1.8" fill="#7c4227"/>
      <circle cx="42" cy="48" r="1.8" fill="#7c4227"/>
      <circle cx="58" cy="48" r="1.8" fill="#7c4227"/>
      <circle cx="46" cy="62" r="1.8" fill="#7c4227"/>
      <circle cx="54" cy="62" r="1.8" fill="#7c4227"/>
    </svg>
  </div>

  <!-- seaweed: rooted beside him, bending with every current he refuses -->
  <div class="seaweed sw-back">
    <svg viewBox="0 0 60 200" aria-hidden="true">
      <path d="M26 200 C 16 162 36 140 26 102 C 18 68 40 46 30 6 L 40 8 C 48 50 28 72 36 104 C 44 142 26 162 38 200 Z" fill="#2f5d45"/>
      <path d="M14 200 C 8 170 22 150 14 118 C 8 92 24 74 16 40 L 22 42 C 28 76 12 96 20 122 C 28 152 12 172 22 200 Z" fill="#27503c" opacity=".9"/>
    </svg>
  </div>
  <div class="seaweed sw-back2">
    <svg viewBox="0 0 60 200" aria-hidden="true">
      <path d="M26 200 C 16 162 36 140 26 102 C 18 68 40 46 30 6 L 40 8 C 48 50 28 72 36 104 C 44 142 26 162 38 200 Z" fill="#27503c"/>
    </svg>
  </div>
  <div class="seaweed sw-front">
    <svg viewBox="0 0 60 200" aria-hidden="true">
      <path d="M28 200 C 18 160 38 138 28 100 C 20 66 42 44 32 4 L 42 6 C 50 48 28 70 36 102 C 44 140 26 160 38 200 Z" fill="#35684e"/>
    </svg>
  </div>

  <!-- the same school of fish, every cycle -->
  <div class="drift fishA-track">
    <div class="bob">
      <svg viewBox="0 0 120 60" aria-hidden="true">
        <g>
          <polygon class="tail" points="18,30 0,10 6,30 0,50" fill="#6a7d93"/>
          <path d="M16 30 Q 44 6 84 22 Q 98 30 84 38 Q 44 54 16 30 Z" fill="#7e93ab"/>
          <polygon points="40,14 52,4 58,16" fill="#6a7d93"/>
          <circle cx="78" cy="26" r="3" fill="#0b0e12"/>
          <circle cx="79" cy="25" r="1" fill="#fff" opacity=".7"/>
        </g>
        <g transform="translate(38,20) scale(.7)" opacity=".8">
          <polygon class="tail" points="18,30 0,10 6,30 0,50" fill="#6a7d93"/>
          <path d="M16 30 Q 44 6 84 22 Q 98 30 84 38 Q 44 54 16 30 Z" fill="#7e93ab"/>
          <circle cx="78" cy="26" r="3" fill="#0b0e12"/>
        </g>
        <g transform="translate(66,26) scale(.6)" opacity=".65">
          <polygon class="tail" points="18,30 0,10 6,30 0,50" fill="#6a7d93"/>
          <path d="M16 30 Q 44 6 84 22 Q 98 30 84 38 Q 44 54 16 30 Z" fill="#7e93ab"/>
        </g>
        <g transform="translate(54,2) scale(.5)" opacity=".55">
          <polygon class="tail" points="18,30 0,10 6,30 0,50" fill="#6a7d93"/>
          <path d="M16 30 Q 44 6 84 22 Q 98 30 84 38 Q 44 54 16 30 Z" fill="#7e93ab"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- a second, smaller school, higher up -->
  <div class="drift fishC-track">
    <div class="bob">
      <svg viewBox="0 0 120 60" aria-hidden="true">
        <g transform="translate(0,8) scale(.85)">
          <polygon class="tail" points="18,30 0,10 6,30 0,50" fill="#76899c"/>
          <path d="M16 30 Q 44 6 84 22 Q 98 30 84 38 Q 44 54 16 30 Z" fill="#8fa6bb"/>
          <polygon points="40,14 52,4 58,16" fill="#76899c"/>
          <circle cx="78" cy="26" r="3" fill="#0b0e12"/>
        </g>
        <g transform="translate(52,22) scale(.6)" opacity=".75">
          <polygon class="tail" points="18,30 0,10 6,30 0,50" fill="#76899c"/>
          <path d="M16 30 Q 44 6 84 22 Q 98 30 84 38 Q 44 54 16 30 Z" fill="#8fa6bb"/>
          <circle cx="78" cy="26" r="3" fill="#0b0e12"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- a jellyfish drifting back the other way -->
  <div class="drift jelly-track">
    <div class="jelly-bob">
      <svg viewBox="0 0 90 120" aria-hidden="true">
        <g class="bell">
          <path d="M12 48 Q 45 6 78 48 Q 45 62 12 48 Z" fill="rgba(175,205,238,.16)" stroke="rgba(195,220,245,.55)" stroke-width="2.5"/>
          <path d="M24 48 Q 45 40 66 48" fill="none" stroke="rgba(195,220,245,.35)" stroke-width="2"/>
        </g>
        <g class="tent">
          <path d="M26 56 C 22 70 30 78 24 96" fill="none" stroke="rgba(195,220,245,.4)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M38 58 C 34 74 42 82 36 104" fill="none" stroke="rgba(195,220,245,.35)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M50 58 C 46 74 54 82 48 102" fill="none" stroke="rgba(195,220,245,.4)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M62 56 C 58 70 66 78 60 94" fill="none" stroke="rgba(195,220,245,.35)" stroke-width="2.5" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- the same bottle, every cycle -->
  <div class="drift bottle-track">
    <div class="tumble">
      <svg viewBox="0 0 60 120" aria-hidden="true">
        <rect x="23" y="2" width="14" height="9" rx="2" fill="#6a7d93"/>
        <path d="M24 34 C 12 48 10 60 10 80 L 10 104 Q 10 112 18 112 L 42 112 Q 50 112 50 104 L 50 80 C 50 60 48 48 36 34 Z"
              fill="rgba(150,185,210,.16)" stroke="rgba(170,200,225,.5)" stroke-width="2.5"/>
        <rect x="16" y="62" width="28" height="20" rx="3" fill="rgba(220,235,245,.22)"/>
      </svg>
    </div>
  </div>

  <!-- the same lone fish, every cycle -->
  <div class="drift fishB-track">
    <div class="bob">
      <svg viewBox="0 0 120 60" aria-hidden="true">
        <polygon class="tail" points="18,30 0,10 6,30 0,50" fill="#6a7d93"/>
        <path d="M16 30 Q 44 6 84 22 Q 98 30 84 38 Q 44 54 16 30 Z" fill="#7e93ab"/>
        <polygon points="40,14 52,4 58,16" fill="#6a7d93"/>
        <circle cx="78" cy="26" r="3" fill="#0b0e12"/>
        <circle cx="79" cy="25" r="1" fill="#fff" opacity=".7"/>
      </svg>
    </div>
  </div>

  <!-- a crab working its way across the seabed, right past him -->
  <div class="drift crab-track">
    <svg viewBox="0 0 120 70" aria-hidden="true">
      <g stroke="#8f3c22" stroke-width="4" stroke-linecap="round" fill="none">
        <path class="leg l1" d="M34 44 L 20 60"/>
        <path class="leg l2" d="M42 48 L 32 64"/>
        <path class="leg l3" d="M52 50 L 50 66"/>
        <path class="leg l4" d="M62 50 L 66 66"/>
        <path class="leg l5" d="M72 48 L 84 64"/>
        <path class="leg l6" d="M80 44 L 96 60"/>
      </g>
      <g class="claw-l">
        <path d="M22 34 L 8 24" stroke="#8f3c22" stroke-width="5" stroke-linecap="round"/>
        <circle cx="8" cy="22" r="7" fill="#b5502f"/>
        <path d="M2 16 L 12 18 L 4 24 Z" fill="#b5502f"/>
      </g>
      <g class="claw-r">
        <path d="M92 34 L 106 24" stroke="#8f3c22" stroke-width="5" stroke-linecap="round"/>
        <circle cx="106" cy="22" r="7" fill="#b5502f"/>
        <path d="M112 16 L 102 18 L 110 24 Z" fill="#b5502f"/>
      </g>
      <g>
        <ellipse cx="58" cy="38" rx="26" ry="16" fill="#b5502f"/>
        <ellipse cx="58" cy="44" rx="22" ry="10" fill="#8f3c22"/>
        <path d="M36 30 Q 58 18 80 30" fill="none" stroke="#d97a50" stroke-width="3" opacity=".6"/>
        <path d="M50 24 L 47 14" stroke="#8f3c22" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M66 24 L 69 14" stroke="#8f3c22" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="47" cy="12" r="3.5" fill="#1a0d08"/>
        <circle cx="69" cy="12" r="3.5" fill="#1a0d08"/>
        <circle cx="48" cy="11" r="1.2" fill="#fff" opacity=".8"/>
        <circle cx="70" cy="11" r="1.2" fill="#fff" opacity=".8"/>
      </g>
    </svg>
  </div>

  <!-- still-frame fish for reduced motion -->
  <div class="fish-static">
    <svg viewBox="0 0 120 60" aria-hidden="true">
      <polygon points="18,30 0,10 6,30 0,50" fill="#6a7d93"/>
      <path d="M16 30 Q 44 6 84 22 Q 98 30 84 38 Q 44 54 16 30 Z" fill="#7e93ab"/>
      <polygon points="40,14 52,4 58,16" fill="#6a7d93"/>
      <circle cx="78" cy="26" r="3" fill="#0b0e12"/>
    </svg>
  </div>

  <!-- the chain: rusty, taut below, snapped and dangling up top -->
  <div class="chain-wrap">
    <svg viewBox="0 0 80 480" aria-hidden="true">
      <ellipse cx="40" cy="462" rx="12" ry="18" fill="none" stroke="#5f3b24" stroke-width="8"/>
      <ellipse cx="41" cy="426" rx="12" ry="18" fill="none" stroke="#5f3b24" stroke-width="8"/>
      <ellipse cx="39" cy="390" rx="12" ry="18" fill="none" stroke="#5f3b24" stroke-width="8"/>
      <ellipse cx="41" cy="354" rx="12" ry="18" fill="none" stroke="#5f3b24" stroke-width="8"/>
      <ellipse cx="39" cy="318" rx="12" ry="18" fill="none" stroke="#5f3b24" stroke-width="8"/>
      <ellipse cx="40" cy="282" rx="12" ry="18" fill="none" stroke="#5f3b24" stroke-width="8"/>
      <ellipse cx="41" cy="246" rx="12" ry="18" fill="none" stroke="#5f3b24" stroke-width="8"/>
      <ellipse cx="39" cy="210" rx="12" ry="18" fill="none" stroke="#5f3b24" stroke-width="8"/>
      <ellipse cx="40" cy="174" rx="12" ry="18" fill="none" stroke="#5f3b24" stroke-width="8"/>
      <ellipse cx="41" cy="138" rx="12" ry="18" fill="none" stroke="#5f3b24" stroke-width="8"/>
      <g class="chain-top">
        <ellipse cx="40" cy="102" rx="12" ry="18" fill="none" stroke="#5f3b24" stroke-width="8"/>

        <path d="M 28 30 A 12 18 0 0 1 52 30" fill="none" stroke="#5f3b24" stroke-width="8" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <!-- the anchor: set, rusted through, never moving -->
  <div class="anchor-wrap">
    <svg viewBox="0 0 400 500" aria-hidden="true">
      <defs>
        <linearGradient id="rust" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#a35a2a"/>
          <stop offset="1" stop-color="#6b3414"/>
        </linearGradient>
      </defs>

      <!-- ring -->
      <circle cx="200" cy="56" r="26" fill="none" stroke="url(#rust)" stroke-width="15"/>
      <!-- shank -->
      <path d="M 200 84 L 200 370" stroke="url(#rust)" stroke-width="30" stroke-linecap="round" fill="none"/>
      <!-- stock -->
      <path d="M 126 128 L 274 128" stroke="url(#rust)" stroke-width="22" stroke-linecap="round" fill="none"/>
      <circle cx="126" cy="128" r="15" fill="url(#rust)"/>
      <circle cx="274" cy="128" r="15" fill="url(#rust)"/>
      <!-- arms -->
      <path d="M 200 366 C 152 370 116 396 106 446" stroke="url(#rust)" stroke-width="26" stroke-linecap="round" fill="none"/>
      <path d="M 200 366 C 248 370 284 396 294 446" stroke="url(#rust)" stroke-width="26" stroke-linecap="round" fill="none"/>
      <!-- flukes -->
      <polygon points="78,388 104,440 138,452" fill="#7d4220"/>
      <polygon points="322,388 296,440 262,452" fill="#7d4220"/>
      <!-- crown -->
      <circle cx="200" cy="372" r="16" fill="url(#rust)"/>

      <!-- rust eating deeper -->
      <ellipse cx="200" cy="80" rx="16" ry="8" fill="#4a220d" opacity=".9"/>
      <ellipse cx="200" cy="180" rx="13" ry="24" fill="#4a220d" opacity=".9"/>
      <ellipse cx="198" cy="290" rx="11" ry="18" fill="#4a220d" opacity=".85"/>
      <ellipse cx="205" cy="345" rx="9" ry="12" fill="#4a220d" opacity=".85"/>
      <ellipse cx="150" cy="128" rx="14" ry="8" fill="#4a220d" opacity=".9"/>
      <ellipse cx="245" cy="128" rx="10" ry="7" fill="#4a220d" opacity=".85"/>
      <ellipse cx="146" cy="392" rx="11" ry="9" fill="#4a220d" opacity=".9" transform="rotate(-30 146 392)"/>
      <ellipse cx="256" cy="394" rx="10" ry="8" fill="#4a220d" opacity=".85" transform="rotate(30 256 394)"/>
      <ellipse cx="200" cy="360" rx="14" ry="8" fill="#4a220d" opacity=".8"/>
      <!-- lighter rust crust catching the light -->
      <circle cx="188" cy="230" r="3" fill="#c9824a" opacity=".6"/>
      <circle cx="212" cy="255" r="2.5" fill="#c9824a" opacity=".6"/>
      <circle cx="195" cy="320" r="2" fill="#c9824a" opacity=".6"/>
      <circle cx="240" cy="130" r="2.5" fill="#c9824a" opacity=".6"/>
      <circle cx="130" cy="410" r="2" fill="#c9824a" opacity=".6"/>
      <path d="M 193 100 L 193 350" stroke="#c9824a" stroke-width="4" opacity=".3" stroke-linecap="round"/>

      <!-- rust debris already fallen at the base -->
      <polygon points="150,452 168,446 176,458 156,462" fill="#6e3a1f"/>
      <polygon points="228,454 246,448 252,460 234,463" fill="#8a4a26"/>
      <polygon points="196,462 208,456 214,466 200,468" fill="#6e3a1f"/>
    </svg>
  </div>

  <div class="flake f1"></div>
  <div class="flake f2"></div>
  <div class="flake f3"></div>
  <div class="flake f4"></div>
  <div class="flake f5"></div>

  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="bubble b4"></div>
  <div class="bubble b5"></div>
  <div class="bubble b6"></div>
  <div class="bubble b7"></div>

  <!-- corner stamp: glowing seal -->
  <div class="stamp">
    <svg viewBox="0 0 150 150" aria-label="You Do This Too">
      <defs>
        <path id="sealArc" d="M 15,75 a 60,60 0 1,1 120,0 a 60,60 0 1,1 -120,0"/>
      </defs>
      <circle class="seal-ring" cx="75" cy="75" r="72" fill="none" stroke-width="2.5"/>
      <circle class="seal-ring" cx="75" cy="75" r="58" fill="none" stroke-width="1.2" opacity=".55"/>
      <circle class="seal-dot" cx="9" cy="75" r="2"/>
      <circle class="seal-dot" cx="141" cy="75" r="2"/>
      <text class="seal-text">
        <textPath href="#sealArc" startOffset="25%" text-anchor="middle">YOU DO THIS TOO</textPath>
      </text>
    </svg>
  </div>

</div>
</body>
