<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dial — Truth</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;width:100vw;height:100vh;font-family:'Outfit',sans-serif}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
.stamp{
  position:fixed;bottom:18px;right:18px;
  font-family:'Outfit',sans-serif;font-size:11px;font-weight:600;
  color:rgba(255,255,255,.8);
  background:rgba(74,107,141,.35);
  padding:5px 12px;
  border-radius:20px;
  box-shadow:0 0 12px rgba(107,161,181,.7), 0 0 25px rgba(107,161,181,.3);
  user-select:none;pointer-events:none;z-index:10;letter-spacing:.1em;
}
@media(prefers-reduced-motion:reduce){canvas{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="stamp">YOU DO THIS TOO</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,dpr,t=0;

let baseline=0.85, needlePos=0.85, needleV=0;
let faces=[], pts=[], dustPts=[];
let hitTimer=0, hitIndex=0;
let shakeX=0,shakeY=0;

const startA=Math.PI*0.8;
const endA=Math.PI*2.2;
const sweep=endA-startA;
const springK=0.06;
const dampD=0.82;

function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  c.width=W*dpr;c.height=H*dpr;
  c.style.width=W+'px';c.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  
  dustPts=[];
  for(let i=0;i<40;i++) dustPts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.08,vy:-.04-Math.random()*.08,r:Math.random()*1.2+.3,alpha:Math.random()*.06+.01});
}

function valToAngle(v){return startA+Math.max(0,Math.min(1,v))*sweep;}

function addFaces(x,y,n){
  // Type: 0=Happy, 1=Neutral, 2=Sad
  // Ratio shifts based on baseline
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,spd=3+Math.random()*6;
    let type=0;
    if(baseline<0.4) type=Math.random()<0.8?2:1;
    else if(baseline<0.7) type=Math.random()<0.5?1:0;
    
    faces.push({
      x:x,y:y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-2,
      life:1,decay:.01+Math.random()*.01,
      r:8+Math.random()*6,type:type,rot:(Math.random()-.5)*0.2
    });
  }
}

function burst(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,spd=2+Math.random()*5;
    const isSpark=Math.random()>.4;
    pts.push({
      x:x,y:y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      life:1,decay:isSpark?.02+Math.random()*.02:.01+Math.random()*.01,
      r:isSpark?Math.random()*2.5+1:Math.random()*3+1,
      bright:Math.random()>.2,spark:isSpark
    });
  }
}

function drawFace(x,y,r,type,alpha,rot){
  ctx.save();
  ctx.globalAlpha=Math.max(0,alpha);
  ctx.translate(x,y);
  ctx.rotate(rot);
  
  // Head
  const headCol=type===0?'#FFD700':type===1?'#9A9A9A':'#4A4A5A';
  ctx.fillStyle=headCol;
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  
  // Eyes
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.arc(-r*0.3,-r*0.2,r*0.12,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.3,-r*0.2,r*0.12,0,Math.PI*2);ctx.fill();
  
  // Mouth
  ctx.strokeStyle='#111';ctx.lineWidth=r*0.15;ctx.lineCap='round';
  ctx.beginPath();
  if(type===0){ctx.arc(0,r*0.15,r*0.35,0.2,Math.PI-0.2);}
  else if(type===1){ctx.moveTo(-r*0.3,r*0.3);ctx.lineTo(r*0.3,r*0.3);}
  else{ctx.arc(0,r*0.55,r*0.35,Math.PI+0.2,-0.2);}
  ctx.stroke();
  ctx.restore();
}

function update(){
  t++;
  shakeX*=0.8;shakeY*=0.8;
  
  // Slowly lower the baseline
  if(baseline>0.08) baseline-=0.0003;
  
  // Spring physics for needle
  needleV+=((baseline-needlePos)*springK);
  needleV*=dampD;
  needlePos+=needleV;
  
  // Hit timer
  hitTimer++;
  if(hitTimer>85){
    hitTimer=0;
    hitIndex++;
    
    // Violent upward impulse
    needleV=-0.2;
    
    const cx=W/2,cy=H/2;
    const gR=Math.min(W,H)*0.28;
    const nA=valToAngle(needlePos);
    const tx=cx+Math.cos(nA)*(gR-10);
    const ty=cy+Math.sin(nA)*(gR-10);
    
    // Spawn faces and particles
    addFaces(tx,ty,35);
    burst(tx,ty,30);
    
    shakeX=(Math.random()-.5)*12;shakeY=(Math.random()-.5)*12;
  }
  
  // Update faces
  for(let i=faces.length-1;i>=0;i--){
    const f=faces[i];f.x+=f.vx;f.y+=f.vy;f.vy+=0.08;f.vx*=0.99;f.life-=f.decay;f.rot+=0.02;
    if(f.life<=0)faces.splice(i,1);
  }
  
  // Update particles
  for(let i=pts.length-1;i>=0;i--){
    const p=pts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.life-=p.decay;
    if(p.life<=0)pts.splice(i,1);
  }
  if(pts.length>400)pts.splice(0,pts.length-400);
  
  // Update dust
  for(const d of dustPts){
    d.x+=d.vx;d.y+=d.vy;
    if(d.y<-10){d.y=H+10;d.x=Math.random()*W;}
    if(d.x<-10)d.x=W+10;if(d.x>W+10)d.x=-10;
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(shakeX,shakeY);
  
  const cx=W/2,cy=H/2;
  const gR=Math.min(W,H)*0.28;
  
  // Calculate dim factor - aggressive power loss at the end
  const progress=(0.85-baseline)/0.75; // 0 to 1
  let dimFactor=Math.pow(Math.max(0,progress),1.2);
  if(baseline<0.3) dimFactor=1.0-(baseline/0.3)*0.2; // Almost completely dark at the end
  
  // Background
  const bgBase=.07*(1-dimFactor*.9);
  const bgG=ctx.createRadialGradient(cx,cy,0,cx,cy,W*.6);
  bgG.addColorStop(0,`rgba(40,60,70,${bgBase})`);bgG.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);
  
  // Grid (fades out as power dies)
  const gridA=0.025*(1-dimFactor*.9);
  if(gridA>0.005){
    ctx.strokeStyle=`rgba(107,161,181,${gridA})`;ctx.lineWidth=1;
    const gs=70;
    for(let gx=(cx%gs);gx<W;gx+=gs){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
    for(let gy=(cy%gs);gy<H;gy+=gs){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}
  }
  
  // Dust (slows and fades)
  for(const d of dustPts){
    ctx.fillStyle=`rgba(107,161,181,${d.alpha*(1-dimFactor*.8)})`;
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();
  }
  
  // --- THE GAUGE ---
  
  const bezelW=gR*0.12;
  const tickR=gR-bezelW;
  
  // Outer Bezel
  ctx.lineWidth=bezelW;ctx.lineCap='butt';
  ctx.strokeStyle=`rgba(0,0,0,${0.8-dimFactor*0.3})`;
  ctx.beginPath();ctx.arc(cx,cy,gR+bezelW/2+2,startA-0.02,endA+0.02);ctx.stroke();
  const bG=ctx.createRadialGradient(cx,cy,gR-bezelW,cx,cy,gR+bezelW);
  bG.addColorStop(0,'#1a2a35');bG.addColorStop(0.5,'#2a3a45');bG.addColorStop(1,'#101a22');
  ctx.strokeStyle=bG;
  ctx.beginPath();ctx.arc(cx,cy,gR,startA,endA);ctx.stroke();
  
  // Face
  ctx.fillStyle='#0d151a';
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,tickR,startA,endA);ctx.closePath();ctx.fill();
  
  // Ticks (fade out)
  const tickA=1-dimFactor*0.8;
  if(tickA>0.1){
    for(let i=0;i<=20;i++){
      const v=i/20;const a=valToAngle(v);const isMajor=i%5===0;const len=isMajor?15:8;
      const x1=cx+Math.cos(a)*(tickR-5);const y1=cy+Math.sin(a)*(tickR-5);
      const x2=cx+Math.cos(a)*(tickR-5-len);const y2=cy+Math.sin(a)*(tickR-5-len);
      ctx.strokeStyle=isMajor?`rgba(160,180,190,${0.5*tickA})`:`rgba(100,120,130,${0.2*tickA})`;
      ctx.lineWidth=isMajor?2.5:1;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    }
  }
  
  // Joy Zone Arc (Fades and shrinks)
  const joyAlpha=Math.max(0, 0.35 - dimFactor*0.35);
  if(joyAlpha>0.01){
    const joyStartA=valToAngle(Math.max(baseline, 0.1));
    const joyEndA=valToAngle(1.0);
    ctx.save();
    ctx.strokeStyle=`rgba(212,160,48,${joyAlpha})`;ctx.lineWidth=8;ctx.lineCap='round';
    ctx.shadowColor=`rgba(212,160,48,${joyAlpha})`;ctx.shadowBlur=15;
    ctx.beginPath();ctx.arc(cx,cy,tickR-25,joyStartA,joyEndA);ctx.stroke();
    ctx.restore();
  }
  
  // Baseline marker
  const blA=valToAngle(baseline);
  const blX1=cx+Math.cos(blA)*(tickR);const blY1=cy+Math.sin(blA)*(tickR);
  const blX2=cx+Math.cos(blA)*(tickR-20);const blY2=cy+Math.sin(blA)*(tickR-20);
  ctx.save();
  ctx.strokeStyle=`rgba(255,255,255,${0.8-dimFactor*0.6})`;ctx.lineWidth=3;ctx.lineCap='round';
  ctx.shadowColor='rgba(255,255,255,0.4)';ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(blX1,blY1);ctx.lineTo(blX2,blY2);ctx.stroke();
  ctx.restore();
  
  // Needle
  const nA=valToAngle(needlePos);
  const nLen=tickR-10;const nTail=15;const nW=4;
  
  ctx.save();ctx.translate(cx,cy);ctx.rotate(nA);
  ctx.beginPath();ctx.moveTo(nLen,0);ctx.lineTo(8,nW);ctx.lineTo(-nTail,nW+2);ctx.lineTo(-nTail,-nW-2);ctx.lineTo(8,-nW);ctx.closePath();
  const nCol=needlePos>0.65?'#E0C060':'#8899AA';
  ctx.fillStyle=nCol;ctx.shadowColor=nCol;ctx.shadowBlur=12;ctx.fill();
  ctx.restore();
  
  // Center Hub
  const hubG=ctx.createRadialGradient(cx-2,cy-2,0,cx,cy,10);
  hubG.addColorStop(0,'#4a5a6a');hubG.addColorStop(1,'#1a2a35');
  ctx.fillStyle=hubG;ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fill();
  
  // Particles
  for(const p of pts){
    let a, colStr;
    if(p.spark){a=p.life*1.1;colStr=`rgba(255,255,220,${Math.min(a,1)})`;}
    else if(p.bright){a=p.life*0.9;colStr=`rgba(200,220,240,${Math.min(a,1)})`;}
    else{a=p.life*0.5;colStr=`rgba(107,161,181,${a})`;}
    
    if(p.spark||p.bright){
      ctx.save();ctx.shadowColor=p.spark?'#FFFACD':'rgba(107,161,181,.8)';ctx.shadowBlur=p.spark?18:8;
      ctx.fillStyle=colStr;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();
    } else {ctx.fillStyle=colStr;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  }
  
  // Emoji Faces
  for(const f of faces){
    drawFace(f.x, f.y, f.r, f.type, f.life*0.9, f.rot);
  }
  
  // Dim overlay (Crushing power loss at the end)
  if(dimFactor>0.05){
    ctx.fillStyle=`rgba(0,0,0,${dimFactor*0.6})`;ctx.fillRect(0,0,W,H);
  }
  
  ctx.restore();
}

function loop(){update();draw();requestAnimationFrame(loop);}
window.addEventListener('resize',resize);resize();loop();
</script>
</body>
</html>
