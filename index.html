<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Normalizer — James</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;width:100vw;height:100vh;font-family:'Outfit',sans-serif}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
.watermark-wrap{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;
  user-select:none;pointer-events:none;z-index:0;
}
.watermark-sub{
  font-family:'Outfit',sans-serif;font-size:clamp(18px,4.5vmin,50px);font-weight:600;
  color:#5a8a5a;letter-spacing:.2em;line-height:1;margin-bottom:-1vmin;
  text-shadow:0 0 40px rgba(107,142,107,.5),0 0 80px rgba(107,142,107,.2);
}
.watermark-name{
  font-family:'Outfit',sans-serif;font-size:clamp(80px,26vmin,400px);font-weight:800;
  color:#4a7a4a;letter-spacing:.04em;line-height:1;
  text-shadow:0 0 80px rgba(107,142,107,.6),0 0 160px rgba(107,142,107,.3);
}
.stamp{
  position:fixed;bottom:18px;right:18px;
  font-family:'Outfit',sans-serif;font-size:11px;font-weight:600;
  color:rgba(255,255,255,.8);
  background:rgba(74,107,74,.35);
  padding:5px 12px;
  border-radius:20px;
  box-shadow:0 0 12px rgba(107,142,107,.7), 0 0 25px rgba(107,142,107,.3);
  user-select:none;pointer-events:none;z-index:10;letter-spacing:.1em;
}
@media(prefers-reduced-motion:reduce){canvas{display:none}}
</style>
</head>
<body>
<div class="watermark-wrap">
  <div class="watermark-sub">ADDICTION</div>
  <div class="watermark-name">JAMES</div>
</div>
<canvas id="c"></canvas>
<div class="stamp">YOU DO THIS TOO</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,dpr;

const NC=10;
let nodes=[],pulsePos=0,pulseSpeed=.019;
let pts=[],ripples=[],trail=[];
let t=0,prevNode=-1,flash=0;

function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  c.width=W*dpr;c.height=H*dpr;
  c.style.width=W+'px';c.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  calcNodes();
}

function calcNodes(){
  nodes=[];
  // Lock center strictly to viewport center
  const cx=W/2;
  const cy=H/2;
  // Scale radius to fit comfortably within the smallest dimension
  const r=Math.min(W,H)*.35;
  for(let i=0;i<NC;i++){
    const a=(i/NC)*Math.PI*2-Math.PI/2;
    nodes.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r});
  }
}

function pulseXY(){
  const i=Math.floor(pulsePos),f=pulsePos-i;
  const n1=nodes[i],n2=nodes[(i+1)%NC];
  return{x:n1.x+(n2.x-n1.x)*f,y:n1.y+(n2.y-n1.y)*f};
}

function emit(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,spd=2.5+Math.random()*5;
    const isBig=Math.random()>.85;
    const isSpark=Math.random()>.5;
    pts.push({
      x:x,y:y,
      vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      life:1,decay:isSpark?.02+Math.random()*.02:.005+Math.random()*.01,
      r:isBig?Math.random()*5+3:isSpark?Math.random()*2+1:Math.random()*3+1,
      bright:Math.random()>.3,spark:isSpark
    });
  }
}

function addRipple(x,y){
  ripples.push({x:x,y:y,r:5,spd:4+Math.random()*3,life:1,decay:.012});
  ripples.push({x:x,y:y,r:5,spd:2.5+Math.random()*2,life:1,decay:.018});
}

function update(){
  t++;
  pulsePos=(pulsePos+pulseSpeed)%NC;

  const curNode=Math.floor(pulsePos);
  const p=pulseXY();
  trail.push({x:p.x,y:p.y,life:1});
  if(trail.length>40)trail.shift();
  for(const tr of trail)tr.life-=.025;

  if(curNode!==prevNode){
    emit(nodes[curNode].x,nodes[curNode].y,70);
    addRipple(nodes[curNode].x,nodes[curNode].y);
    flash=1;
    prevNode=curNode;
  }

  flash*=.9;

  if(Math.random()<.5)emit(p.x,p.y,1);

  for(let i=pts.length-1;i>=0;i--){
    const p=pts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.life-=p.decay;
    if(p.life<=0)pts.splice(i,1);
  }
  if(pts.length>500)pts.splice(0,pts.length-500);

  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i];r.r+=r.spd;r.life-=r.decay;
    if(r.life<=0)ripples.splice(i,1);
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // background glow
  const bgA=.07+Math.sin(t*.02)*.025;
  const bgG=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.6);
  bgG.addColorStop(0,`rgba(74,107,74,${bgA})`);bgG.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);

  // grid
  const gs=Math.max(30,Math.min(W,H)*.035);
  for(let gx=gs/2;gx<W;gx+=gs){
    for(let gy=gs/2;gy<H;gy+=gs){
      const dist=Math.hypot(gx-W/2,gy-H/2);
      const fade=Math.max(0,1-dist/(Math.min(W,H)*.55));
      const a=fade*.08;
      ctx.fillStyle=`rgba(107,142,107,${a})`;
      ctx.beginPath();ctx.arc(gx,gy,1.2,0,Math.PI*2);ctx.fill();
    }
  }

  // ripples
  for(const r of ripples){
    ctx.save();
    ctx.strokeStyle=`rgba(160,208,160,${r.life*.45})`;ctx.lineWidth=2.5;
    ctx.shadowColor='#A0D0A0';ctx.shadowBlur=15;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }

  // lines between nodes
  for(let i=0;i<NC;i++){
    const n1=nodes[i],n2=nodes[(i+1)%NC];
    const d=Math.min(Math.abs(pulsePos-i),Math.abs(pulsePos-(i+1)),NC-Math.abs(pulsePos-i),NC-Math.abs(pulsePos-(i+1)));
    const b=Math.max(.1,.4-d*.12);
    ctx.strokeStyle=`rgba(107,142,107,${b})`;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(n1.x,n1.y);ctx.lineTo(n2.x,n2.y);ctx.stroke();
  }

  // trail
  for(let i=0;i<trail.length;i++){
    const tr=trail[i];
    if(tr.life<=0)continue;
    const a=tr.life*.4;
    ctx.fillStyle=`rgba(160,208,160,${a})`;
    ctx.beginPath();ctx.arc(tr.x,tr.y,3*tr.life,0,Math.PI*2);ctx.fill();
  }

  // nodes
  const curNode=Math.floor(pulsePos);
  for(let i=0;i<NC;i++){
    const n=nodes[i];
    const isActive=i===curNode;
    const isNext=i===(curNode+1)%NC;
    const base=isActive?1:isNext?.35:.15;

    if(isActive){
      ctx.save();
      ctx.shadowColor='#A0D0A0';ctx.shadowBlur=35;
      ctx.fillStyle=`rgba(160,208,160,${base*.7})`;
      ctx.beginPath();ctx.arc(n.x,n.y,12,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }

    ctx.fillStyle=`rgba(107,142,107,${base})`;
    ctx.beginPath();ctx.arc(n.x,n.y,isActive?8:5,0,Math.PI*2);ctx.fill();

    // ring
    ctx.strokeStyle=`rgba(107,142,107,${base*.4})`;ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(n.x,n.y,isActive?16:9,0,Math.PI*2);ctx.stroke();
  }

  // pulse
  const pp=pulseXY();
  ctx.save();
  ctx.shadowColor='#A0D0A0';ctx.shadowBlur=45;
  ctx.fillStyle='rgba(180,230,180,.95)';
  ctx.beginPath();ctx.arc(pp.x,pp.y,8,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // pulse outer ring
  ctx.save();
  ctx.strokeStyle='rgba(160,208,160,.5)';ctx.lineWidth=1.5;
  ctx.shadowColor='#A0D0A0';ctx.shadowBlur=15;
  ctx.beginPath();ctx.arc(pp.x,pp.y,14,0,Math.PI*2);ctx.stroke();
  ctx.restore();

  // particles
  for(const p of pts){
    let a,col;
    if(p.spark){a=p.life*.95;col=`rgba(200,240,200,${a})`;}
    else if(p.bright){a=p.life*.85;col=`rgba(160,208,160,${a})`;}
    else{a=p.life*.5;col=`rgba(107,142,107,${a})`;}
    
    if(p.spark||p.bright){
      ctx.save();
      ctx.shadowColor='#A0D0A0';ctx.shadowBlur=p.spark?15:8;
      ctx.fillStyle=col;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle=col;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
  }

  // flash
  if(flash>.01){
    ctx.fillStyle=`rgba(107,142,107,${flash*.2})`;
    ctx.fillRect(0,0,W,H);
  }
}

function loop(){update();draw();requestAnimationFrame(loop);}
window.addEventListener('resize',resize);
resize();loop();
</script>
</body>
</html>
