<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recalibrate — The Truth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --day:#f5ead0;
  --day-bright:#fffaf0;
  --day-dim:#b8ab8f;
  --vio:#a78bfa;
  --red:#f87171;
  --ice:#cfe4f7;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#040301;font-family:'Outfit',sans-serif}
.scene{position:absolute;inset:0;transform-origin:50% 55%;animation:sceneDrift 16s ease-in-out infinite}
@keyframes sceneDrift{0%,100%{transform:scale(1)}50%{transform:scale(1.013)}}

/* ============ ROOM ============ */
.wall{position:absolute;top:0;left:0;right:0;height:72%;z-index:0;
  background-color:#1a120a;
  background-image:
    radial-gradient(ellipse 70% 60% at 50% 30%, rgba(245,234,208,.06), transparent 75%),
    linear-gradient(rgba(245,234,208,.04) 1px, transparent 1px);
  background-size:100% 100%,7vmin 7vmin;
  box-shadow:inset 0 -6vmin 10vmin rgba(0,0,0,.5)}
.floor{position:absolute;left:0;right:0;bottom:0;height:28%;z-index:0;
  background:
    radial-gradient(ellipse 60% 90% at 40% 14%, rgba(245,234,208,.07), transparent 70%),
    repeating-linear-gradient(to bottom, rgba(245,234,208,.05) 0 1px, transparent 1px 4.4vmin),
    linear-gradient(#1c130a,#0a0603)}
.baseboard{position:absolute;left:0;right:0;top:calc(72% - 2vmin);height:2vmin;z-index:1;
  background:linear-gradient(#332413,#0d0805);box-shadow:0 1vmin 2vmin rgba(0,0,0,.6)}
.glow{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 60% 45% at 50% 40%, rgba(255,240,200,.09), transparent 72%);
  animation:roomGlow 9s ease-in-out infinite}
@keyframes roomGlow{0%,100%{opacity:.75}50%{opacity:1}}

.kglow{position:absolute;left:14%;top:26%;width:36vmin;height:34vmin;z-index:1;pointer-events:none;
  border-radius:50%;filter:blur(3vmin);
  background:radial-gradient(ellipse, rgba(248,113,113,.16), transparent 70%);
  animation:kglowB 7s ease-in-out infinite}
@keyframes kglowB{0%,100%{opacity:.7}50%{opacity:1}}
.ladglow{position:absolute;left:38%;top:5%;width:32vmin;height:28vmin;z-index:1;pointer-events:none;
  border-radius:50%;filter:blur(3vmin);
  background:radial-gradient(ellipse, rgba(167,139,250,.15), transparent 70%);
  animation:ladglowB 9s ease-in-out infinite}
@keyframes ladglowB{0%,100%{opacity:.7}50%{opacity:1}}
.sglow{position:absolute;left:64%;top:8%;width:34vmin;height:32vmin;z-index:1;pointer-events:none;
  border-radius:50%;filter:blur(3vmin);
  background:radial-gradient(ellipse, rgba(207,228,247,.14), transparent 70%);
  animation:sglowB 8s ease-in-out infinite}
@keyframes sglowB{0%,100%{opacity:.7}50%{opacity:1}}

/* ============ NAME ============ */
.name{position:absolute;top:4.5%;left:50%;transform:translateX(-50%);z-index:2;
  font-weight:900;font-size:clamp(2rem,9.5vmin,7rem);letter-spacing:.05em;white-space:nowrap;
  color:var(--day);
  animation:namePulse 6s ease-in-out infinite}
@keyframes namePulse{
  0%,100%{text-shadow:0 0 16px rgba(245,234,208,.8),0 0 50px rgba(200,170,110,.4)}
  50%{text-shadow:0 0 26px rgba(255,250,240,1),0 0 80px rgba(220,190,130,.6)}}

/* ============ FRONT DOOR + GUEST (the fresh nose, reacting) ============ */
.dz{position:absolute;left:1.5%;top:20%;width:15vmin;height:92.5vmin;z-index:4}
.lintelD{position:absolute;left:-1vmin;right:-1vmin;top:0;height:3vmin;border-radius:.5vmin;
  background:linear-gradient(#6b4726,#3a2411);
  border:2px solid rgba(245,234,208,.3);
  box-shadow:0 5px 12px rgba(0,0,0,.6)}
.jambD{position:absolute;top:2.5vmin;bottom:0;width:2.6vmin;
  background:linear-gradient(90deg,#5c3d1e,#38220e);
  border:2px solid rgba(245,234,208,.25)}
.jambD.l{left:0;border-radius:0 0 .4vmin .4vmin}
.jambD.r{right:0;background:linear-gradient(270deg,#5c3d1e,#38220e)}
.dopen{position:absolute;left:2.6vmin;right:2.6vmin;top:2.5vmin;bottom:0;overflow:hidden;
  background:linear-gradient(#ffefc2,#f0c586 60%,#c99b52);
  box-shadow:0 0 34px rgba(255,220,150,.4)}
.dsun{position:absolute;left:calc(50% - 2vmin);top:20%;width:4vmin;height:4vmin;border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #fffdf5, #ffe9b0 60%, rgba(255,220,150,0));
  box-shadow:0 0 20px rgba(255,248,220,.9),0 0 48px rgba(255,220,150,.5)}
.dhor{position:absolute;left:0;right:0;bottom:0;height:6vmin;
  background:linear-gradient(transparent, rgba(90,60,20,.5))}
.doorpD{position:absolute;left:7.5vmin;top:-1.5vmin;width:9.5vmin;height:95vmin;
  transform-origin:right center;transform:rotate(9deg);
  background:linear-gradient(90deg,#5c3d1e 0 8%,#4a2f14 8% 45%,#5c3d1e 45% 55%,#4a2f14 55% 92%,#5c3d1e 92%);
  border:2px solid rgba(245,234,208,.3);border-radius:.6vmin;
  box-shadow:8px 10px 26px rgba(0,0,0,.65), inset 0 0 10px rgba(0,0,0,.4);
  animation:doorSway 9s ease-in-out infinite}
@keyframes doorSway{0%,100%{transform:rotate(8.2deg)}50%{transform:rotate(10deg)}}
.doorpD::before{content:"";position:absolute;left:1.2vmin;right:1.2vmin;top:3vmin;height:26vmin;
  border-radius:.5vmin;border:2px solid rgba(0,0,0,.3);
  box-shadow:inset 0 0 8px rgba(0,0,0,.35)}
.doorpD::after{content:"";position:absolute;left:1.2vmin;right:1.2vmin;bottom:5vmin;height:28vmin;
  border-radius:.5vmin;border:2px solid rgba(0,0,0,.3);
  box-shadow:inset 0 0 8px rgba(0,0,0,.35)}
.knobD{position:absolute;left:.5vmin;top:43vmin;width:1.4vmin;height:1.4vmin;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #f5ead0, #8a6a30);
  box-shadow:0 0 8px rgba(245,234,208,.5)}
/* the guest: recoiling, hand over nose, fanning the air */
.gz{position:absolute;left:1.6vmin;bottom:.3vmin;width:11.5vmin;height:29.9vmin;z-index:3}
.gfig{position:absolute;inset:0;width:100%;height:100%;
  filter:drop-shadow(0 0 9px rgba(255,235,190,.4))}
.gfig .body{fill:#0b0603;stroke:rgba(255,242,214,.45);stroke-width:1.2}
.gfig .limb{fill:none;stroke:#0b0603;stroke-width:9;stroke-linecap:round}
.gbreathe{transform-box:fill-box;transform-origin:50% 100%;
  animation:gbreatheT 4.8s ease-in-out infinite}
@keyframes gbreatheT{0%,100%{transform:translateY(0)}50%{transform:translateY(1.1)}}
.grecoil{transform-box:fill-box;transform-origin:50% 100%;
  animation:grecoilS 2.8s ease-in-out infinite alternate}
@keyframes grecoilS{from{transform:rotate(-2.5deg)}to{transform:rotate(.5deg)}}
.fanarm{transform-box:fill-box;transform-origin:12% 18%;
  animation:fanWave 1.2s ease-in-out infinite alternate}
@keyframes fanWave{from{transform:rotate(-6deg)}to{transform:rotate(13deg)}}
.duffle{position:absolute;left:-1.2vmin;bottom:0;width:6vmin;height:3.6vmin;border-radius:.9vmin;
  background:linear-gradient(160deg,#4a3318,#241606);
  border:2px solid rgba(245,234,208,.35);
  box-shadow:0 4px 10px rgba(0,0,0,.6), inset 0 0 6px rgba(0,0,0,.4)}
.duffle::before{content:"";position:absolute;left:1.2vmin;top:-1.3vmin;width:3.2vmin;height:1.5vmin;
  border:.5vmin solid rgba(245,234,208,.5);border-bottom:none;border-radius:1vmin 1vmin 0 0}

/* light into the room */
.shaft{position:absolute;left:1%;bottom:5%;width:50vmin;height:15vmin;z-index:1;pointer-events:none;
  clip-path:polygon(0 100%, 20% 0, 100% 28%, 84% 100%);
  background:linear-gradient(115deg, rgba(255,246,220,.26), rgba(255,225,160,.11) 60%, transparent);
  filter:blur(1.2vmin);
  animation:shaftBreathe 8s ease-in-out infinite}
@keyframes shaftBreathe{0%,100%{opacity:.6}50%{opacity:1}}
.poolD{position:absolute;left:4%;bottom:9%;width:24vmin;height:8vmin;z-index:1;
  border-radius:50%;filter:blur(2.4vmin);
  background:radial-gradient(ellipse, rgba(255,240,200,.22), transparent 70%);
  animation:poolDrift 18s ease-in-out infinite}
@keyframes poolDrift{0%,100%{transform:translateX(-2vmin);opacity:.75}50%{transform:translateX(2vmin);opacity:1}}
.motes{position:absolute;left:3%;top:56%;width:32vmin;height:22vmin;z-index:5;pointer-events:none}
.mo{position:absolute;border-radius:50%;background:var(--day-bright);
  box-shadow:0 0 8px rgba(255,248,220,.95);opacity:.7;
  animation:moteFloat linear infinite}
.mo.m1{left:8%;top:20%;width:4px;height:4px;animation-duration:17s;animation-delay:-3s}
.mo.m2{left:22%;top:40%;width:5px;height:5px;animation-duration:21s;animation-delay:-11s}
.mo.m3{left:36%;top:12%;width:3px;height:3px;animation-duration:15s;animation-delay:-7s}
.mo.m4{left:52%;top:55%;width:4px;height:4px;animation-duration:19s;animation-delay:-14s}
.mo.m5{left:64%;top:30%;width:5px;height:5px;animation-duration:23s;animation-delay:-5s}
.mo.m6{left:44%;top:70%;width:3px;height:3px;animation-duration:16s;animation-delay:-9s}
@keyframes moteFloat{
  0%{transform:translateY(0) translateX(0);opacity:0}
  15%{opacity:.7}
  85%{opacity:.5}
  100%{transform:translateY(-24vmin) translateX(-3vmin);opacity:0}}

/* ============ KITCHEN — Toby's room (untouched) ============ */
.backsplash{position:absolute;left:20%;top:34%;width:25vmin;height:28vmin;z-index:1;
  background-color:#1c0a10;
  background-image:
    linear-gradient(rgba(252,165,165,.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(252,165,165,.08) 1px, transparent 1px);
  background-size:2.6vmin 2.6vmin}
.counter{position:absolute;left:19%;top:49.4%;width:27vmin;height:4.5vmin;z-index:1;border-radius:.6vmin;
  background:linear-gradient(#4a232f,#2a121c 70%,#1e0c14);
  border:2px solid rgba(252,165,165,.5);
  box-shadow:0 8px 16px rgba(0,0,0,.55), 0 0 20px rgba(239,68,68,.22), inset 0 .5vmin 1vmin rgba(254,202,202,.28)}
.cabinet{position:absolute;left:19%;top:54%;width:27vmin;height:32vmin;z-index:1;
  background:linear-gradient(#2e141d,#1a090f);
  border:2px solid rgba(252,165,165,.28);
  box-shadow:inset 0 0 12vmin rgba(0,0,0,.4)}
.knobs{position:absolute;left:0;top:1.2vmin;width:100%;height:4vmin}
.knob{position:absolute;top:.4vmin;width:3vmin;height:3vmin;border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #4a2330, #22090f 70%);
  border:2px solid rgba(252,165,165,.6);
  box-shadow:0 0 10px rgba(248,113,113,.4)}
.knob::before{content:"";position:absolute;left:calc(50% - .85vmin);top:calc(50% - .85vmin);
  width:1.7vmin;height:1.7vmin;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #fecaca, #b4434f)}
.knob::after{content:"";position:absolute;left:calc(50% - .14vmin);top:.14vmin;
  width:.28vmin;height:1vmin;border-radius:.14vmin;
  background:#fecaca;box-shadow:0 0 5px rgba(254,202,202,.9)}
.kn1{left:2.5vmin;transform:rotate(40deg)}
.kn2{left:8.5vmin;transform:rotate(-15deg)}
.kn3{left:14.5vmin;transform:rotate(70deg)}
.kn4{left:20.5vmin;animation:turn 40s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}

.potz{position:absolute;left:23%;top:41%;width:14vmin;height:15vmin;z-index:2}
.burnglow{position:absolute;left:2%;right:2%;bottom:-3.2vmin;height:2.4vmin;border-radius:50%;
  background:radial-gradient(ellipse, rgba(255,120,80,.55), transparent 70%);
  filter:blur(.6vmin);
  animation:burnPulse 2s ease-in-out infinite}
@keyframes burnPulse{0%,100%{opacity:.6}50%{opacity:1}}
.flame{position:absolute;left:12%;right:12%;bottom:-2.6vmin;height:3vmin;
  border-radius:50% 50% 0 0 / 70% 70% 0 0;
  background:linear-gradient(to top, rgba(255,110,70,.95), rgba(255,170,140,.3));
  filter:blur(.35vmin);
  transform-origin:bottom center;
  animation:flameFlick .28s ease-in-out infinite alternate}
.flame.f2{left:30%;right:34%;height:3.8vmin;bottom:-3vmin;
  animation-duration:.22s}
@keyframes flameFlick{
  from{transform:scaleY(.82) scaleX(1.08);opacity:.8}
  to{transform:scaleY(1.18) scaleX(.92);opacity:1}}
.potbody{position:absolute;bottom:0;left:0;right:0;height:10vmin;
  border-radius:1vmin 1vmin 1.6vmin 1.6vmin;
  background:linear-gradient(150deg,#4a222c,#210a10 70%);
  border:2px solid rgba(252,165,165,.55);
  box-shadow:inset 0 1vmin 2vmin rgba(0,0,0,.5), 0 0 22px rgba(239,68,68,.4)}
.phandle{position:absolute;bottom:6.5vmin;width:2.6vmin;height:1.1vmin;border-radius:.55vmin;
  background:#3a1a22;border:1.5px solid rgba(252,165,165,.45)}
.phandle.l{left:-2.1vmin}
.phandle.r{right:-2.1vmin}
.rimglow{position:absolute;bottom:9.4vmin;left:3%;right:3%;height:.6vmin;border-radius:.3vmin;
  background:linear-gradient(90deg, transparent, #fecaca 30%, #fff 50%, #fecaca 70%, transparent);
  box-shadow:0 0 10px rgba(254,202,202,.85);
  animation:rimGlow 1.2s ease-in-out infinite}
@keyframes rimGlow{0%,100%{opacity:.55}50%{opacity:1}}
.lid{position:absolute;top:.3vmin;left:4%;right:4%;height:3.2vmin;
  border-radius:1.6vmin 1.6vmin .7vmin .7vmin;
  background:linear-gradient(#552835,#26090f);
  border:2px solid rgba(252,165,165,.6);
  box-shadow:0 0 14px rgba(248,113,113,.4);
  animation:lidRattle .14s linear infinite alternate}
@keyframes lidRattle{
  from{transform:translateY(-.45vmin) rotate(.9deg)}
  to{transform:translateY(.12vmin) rotate(-.9deg)}}
.lidknob{position:absolute;left:calc(50% - .9vmin);top:-1.3vmin;width:1.8vmin;height:1.5vmin;border-radius:.7vmin .7vmin .2vmin .2vmin;
  background:linear-gradient(#5c2c3a,#2a0c14);border:1.5px solid rgba(252,165,165,.55)}
.steamK{position:absolute;z-index:2;pointer-events:none;filter:blur(1.3vmin);
  border-radius:50%;opacity:0;
  animation:steamUp linear infinite}
.steamK.s1{left:24%;bottom:58%;width:5vmin;height:8vmin;
  background:radial-gradient(ellipse, rgba(254,202,202,.14), transparent 70%);
  animation-duration:19s}
.steamK.s2{left:29%;bottom:59%;width:4.5vmin;height:7vmin;
  background:radial-gradient(ellipse, rgba(254,202,202,.12), transparent 70%);
  animation-duration:24s;animation-delay:-11s}
@keyframes steamUp{
  0%{transform:translateY(0) translateX(0)}
  25%{opacity:.8}
  100%{transform:translateY(-24vmin) translateX(5vmin);opacity:0}}
.pzs{position:absolute;left:37.5%;top:44.5%;width:8vmin;z-index:2}
.pz{position:relative;width:8vmin;height:2.2vmin;border-radius:.5vmin;margin-bottom:.15vmin;
  background:linear-gradient(#3a222c,#241218);
  border:1.5px solid rgba(252,165,165,.35);
  box-shadow:0 3px 7px rgba(0,0,0,.5)}
.pz:nth-child(2){transform:rotate(1.8deg);left:.6vmin}
.pz::after{content:"";position:absolute;left:calc(50% - 1.5vmin);top:calc(50% - .25vmin);
  width:3vmin;height:.5vmin;border-radius:.25vmin;background:rgba(252,165,165,.25)}

/* ============ LIVING — Amara's room (untouched) ============ */
.ladclip{position:absolute;left:42%;top:11%;width:24vmin;height:38vmin;z-index:1;overflow:hidden}
.ladcol{animation:ladUp 30s linear infinite}
@keyframes ladUp{to{transform:translateY(-50%)}}
.lset{display:block;padding-left:5.5vmin}
.lgf{position:relative;width:13vmin;height:9vmin;border-radius:.7vmin;margin-bottom:3vmin;
  border:2.5px dashed rgba(167,139,250,.6);
  box-shadow:0 0 10px rgba(139,92,246,.2), inset 0 0 8px rgba(139,92,246,.12)}
.lgf .bar{position:absolute;left:16%;height:.5vmin;border-radius:.25vmin;background:rgba(196,181,253,.25)}
.lgf .bar.b1{top:24%;right:16%}
.lgf .bar.b2{top:40%;right:34%}
.lgf .bar.b3{top:56%;right:48%}
.lgf .ring{position:absolute;right:13%;top:20%;width:2.6vmin;height:2.6vmin;border-radius:50%;
  border:2px dashed rgba(196,181,253,.55)}
.lgf.done{border:.5vmin solid rgba(167,139,250,.3);
  box-shadow:0 0 8px rgba(139,92,246,.12)}
.lgf.done .ring{border:2px solid rgba(167,139,250,.3)}
.lgf.done .bar{background:rgba(167,139,250,.18)}

.oz{position:absolute;left:47%;top:49.4%;width:15vmin;height:39vmin;z-index:3}
.ofig{position:absolute;inset:0;width:100%;height:100%;
  filter:drop-shadow(0 0 9px rgba(167,139,250,.35))}
.obreathe{transform-box:fill-box;transform-origin:50% 100%;
  animation:obreatheT 4.6s ease-in-out infinite}
@keyframes obreatheT{0%,100%{transform:translateY(0)}50%{transform:translateY(1.2)}}
.ofig .body{fill:#0b0603;stroke:rgba(245,234,208,.3);stroke-width:1.2}
.ofig .limb{fill:none;stroke:#0b0603;stroke-width:9;stroke-linecap:round}
.oheadg{transform-box:fill-box;transform-origin:50% 92%;
  animation:oheadNod 11s ease-in-out infinite}
@keyframes oheadNod{
  0%,30%{transform:rotate(7deg)}
  42%,58%{transform:rotate(-3deg)}
  70%,100%{transform:rotate(7deg)}}
.pglow{opacity:.8;animation:phonePulse 5s ease-in-out infinite}
@keyframes phonePulse{0%,100%{opacity:.45}50%{opacity:.95}}
.obars{animation:obarsScroll 3.5s linear infinite}
@keyframes obarsScroll{to{transform:translateY(-84px)}}

.lampz{position:absolute;left:63.5%;top:33%;width:9vmin;height:67vmin;z-index:2}
.shade2{position:relative;width:9vmin;height:8vmin;
  clip-path:polygon(18% 0, 82% 0, 100% 100%, 0 100%);
  background:linear-gradient(#5c2c3a,#2e1219);
  border-radius:1vmin;
  box-shadow:0 0 24px rgba(248,113,113,.4)}
.shade2::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.3vmin;
  background:linear-gradient(90deg, transparent, #f5ead0 30%, #fffaf0 50%, #f5ead0 70%, transparent);
  box-shadow:0 0 16px rgba(255,248,220,.85);
  animation:lampBreathe 8s ease-in-out infinite}
@keyframes lampBreathe{0%,100%{opacity:.7}50%{opacity:1}}
.lpole2{position:relative;margin:0 auto;width:.9vmin;height:52vmin;
  background:linear-gradient(90deg,#4a2330,#241018 60%)}
.lbase2{position:relative;margin:0 auto;width:6vmin;height:1.4vmin;border-radius:.7vmin;
  background:linear-gradient(#3a1a22,#1e0a10)}
.poolL{position:absolute;left:60%;bottom:12%;width:20vmin;height:7vmin;z-index:1;
  border-radius:50%;filter:blur(2.4vmin);
  background:radial-gradient(ellipse, rgba(255,240,200,.2), transparent 70%);
  animation:poolDrift 18s ease-in-out infinite reverse}

/* ============ STUDY — Clara's room (untouched) ============ */
.slist{position:absolute;left:70%;top:15%;width:17vmin;height:19vmin;z-index:2}
.slframe{position:absolute;inset:0;border-radius:1vmin;
  background:linear-gradient(#1a2738,#101a28);
  border:2px solid rgba(169,198,226,.55);
  box-shadow:0 8px 18px rgba(0,0,0,.55), 0 0 22px rgba(122,162,200,.28), inset 0 0 12px rgba(0,0,0,.5);
  padding:1.2vmin}
.shead{height:2vmin;border-radius:.5vmin;margin-bottom:.8vmin;
  background:linear-gradient(90deg, rgba(169,198,226,.5), rgba(169,198,226,.15));
  box-shadow:0 0 8px rgba(169,198,226,.3)}
.srow{display:flex;align-items:center;gap:.7vmin;height:1.9vmin;margin-bottom:.35vmin}
.slb{height:.45vmin;border-radius:.22vmin}
.slb.a{width:52%}
.slb.b{width:28%}
.sbox{margin-left:auto;width:1.9vmin;height:1.9vmin;border:2px solid;border-radius:.4vmin;position:relative;flex:none}
.scheck{position:absolute;left:24%;top:10%;width:1.1vmin;height:.55vmin;
  border-left:.36vmin solid;border-bottom:.36vmin solid;
  transform:rotate(-48deg)}
.srow.done .slb{background:rgba(169,198,226,.16)}
.srow.done .sbox{border-color:rgba(169,198,226,.3)}
.srow.done .scheck{border-color:rgba(169,198,226,.3)}
.srow.fresh .slb{background:rgba(169,198,226,.32)}
.srow.fresh .sbox{border-color:rgba(220,236,250,.7)}
.srow.fresh .scheck{border-color:#f2f8ff;animation:checkGlow 4s ease-in-out infinite}
@keyframes checkGlow{
