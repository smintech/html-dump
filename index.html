<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Escalator — Rachel</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;width:100vw;height:100vh;font-family:'Outfit',sans-serif}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
.watermark-wrap{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;
  user-select:none;pointer-events:none;z-index:0;
}
.watermark-sub{
  font-family:'Outfit',sans-serif;font-size:clamp(18px,4.5vmin,50px);font-weight:600;
  color:#8a0000;letter-spacing:.2em;line-height:1;margin-bottom:-1vmin;
  text-shadow:0 0 40px rgba(220,20,20,.5),0 0 80px rgba(220,20,20,.2);
}
.watermark-name{
  font-family:'Outfit',sans-serif;font-size:clamp(80px,26vmin,400px);font-weight:800;
  color:#7a0000;letter-spacing:.04em;line-height:1;
  text-shadow:0 0 80px rgba(220,20,20,.55),0 0 160px rgba(220,20,20,.25);
}
.stamp{
  position:fixed;bottom:18px;right:18px;
  font-family:'Outfit',sans-serif;font-size:11px;font-weight:600;
  color:rgba(255,255,255,.75);
  background:rgba(100,0,0,.35);
  padding:5px 12px;
  border-radius:20px;
  box-shadow:0 0 10px rgba(220,20,20,.6), 0 0 20px rgba(220,20,20,.3);
  user-select:none;pointer-events:none;z-index:10;letter-spacing:.1em;
}
@media(prefers-reduced-motion:reduce){canvas{display:none}}
</style>
</head>
<body>
<div class="watermark-wrap">
  <div class="watermark-sub">ADDICTION</div>
  <div class="watermark-name">RACHEL</div>
</div>
<canvas id="c"></canvas>
<div class="stamp">YOU DO THIS TOO</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,dpr;

let fill=0,growth=0,maxG=7,speed=.004,marks=[],pts=[],streaks=[],rings=[],flash=0,t=0,cooldown=0,shakeX=0,shakeY=0;

function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  c.width=W*dpr;c.height=H*dpr;
  c.style.width=W+'px';c.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function br(){
  const w=Math.max(W*.07,42);
  const h=H*.28+(growth/maxG)*H*.5;
  const x=W/2-w/2,y=H/2-h/2;
  return{x,y,w,h};
}

function addP(x,y,n,spread,vy,decay){
  for(let i=0;i<n;i++){
    const isBig=Math.random()>.8;
    pts.push({
      x:x+(Math.random()-.5)*spread,
      y:y+(Math.random()-.5)*spread*.3,
      vx:(Math.random()-.5)*4,
      vy:vy[0]+Math.random()*(vy[1]-vy[0]),
      life:1,decay:Math.random()*decay+.003,
      r:isBig?Math.random()*5+2:Math.random()*3+.5,
      bright:Math.random()>.4
    });
  }
}

function addStreak(x,y1,y2){
  streaks.push({
    x:x,y:y1,targetY:y2,
    vy:-12-Math.random()*10,
    life:1,decay:.015+Math.random()*.01,
    w:Math.random()*2.5+.5
  });
}

function addRing(x,y){
  rings.push({
    x:x,y:y,radius:5,
    speed:5+Math.random()*4,
    life:1,decay:.01
  });
}

function update(){
  t++;
  if(cooldown>0){cooldown--;if(cooldown<=0){growth=0;fill=0;speed=.004;marks=[];}return;}

  fill+=speed;

  if(fill>=.88){
    marks.push({pos:.88,t:t});
    growth=Math.min(growth+1,maxG);
    fill=.18;
    speed=Math.min(speed+.0006,.012);
    flash=1;
    const b=br();
    addP(b.x+b.w/2,b.y+b.h*.12,150,b.w*8,[-10,-1],.012);
    addP(b.x+b.w/2,b.y+b.h*.12,30,b.w*2,[-16,-6],.015);
    for(let i=0;i<15;i++)addStreak(b.x+Math.random()*b.w,b.y+b.h,b.y+b.h*.1);
    addRing(b.x+b.w/2,b.y+b.h*(1-.88));
    addRing(b.x+b.w/2,b.y+b.h*(1-.88));
    if(growth>=maxG)cooldown=150;
  }

  if(flash>.4){
    shakeX=(Math.random()-.5)*flash*8;
    shakeY=(Math.random()-.5)*flash*8;
  } else {
    shakeX=0;shakeY=0;
  }

  flash*=.91;
  const b=br();
  const surfY=b.y+b.h*(1-fill);

  if(Math.random()<.7)addP(b.x+Math.random()*b.w,surfY,1,8,[-3.5,-.3],.016);
  if(Math.random()<.4)addP(b.x+b.w/2,b.y+b.h+20,2,b.w*2,[-5,-1.5],.01);
  if(Math.random()<.25)addStreak(b.x+Math.random()*b.w,surfY,b.y+b.h*.1);

  if(pts.length>450)pts.splice(0,pts.length-450);

  for(let i=pts.length-1;i>=0;i--){
    const p=pts[i];p.x+=p.vx;p.y+=p.vy;p.vy-=.03;p.life-=p.decay;
    if(p.life<=0)pts.splice(i,1);
  }
  for(let i=streaks.length-1;i>=0;i--){
    const s=streaks[i];s.y+=s.vy;s.life-=s.decay;
    if(s.life<=0||s.y<s.targetY)streaks.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.radius+=r.speed;r.life-=r.decay;
    if(r.life<=0)rings.splice(i,1);
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(shakeX,shakeY);

  const b=br();

  // background pulse
  const bgP=fill*.15+Math.sin(t*.03)*.03;
  const bgG=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.6);
  bgG.addColorStop(0,`rgba(139,0,0,${bgP})`);bgG.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);

  // rings
  for(const r of rings){
    ctx.save();
    ctx.strokeStyle=`rgba(220,20,60,${r.life*.4})`;ctx.lineWidth=2.5;
    ctx.shadowColor='#DC143C';ctx.shadowBlur=15;
    ctx.beginPath();ctx.arc(r.x,r.y,r.radius,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }

  // bar glow
  ctx.save();
  ctx.shadowColor='#DC143C';ctx.shadowBlur=50;
  ctx.strokeStyle='rgba(220,20,60,.25)';ctx.lineWidth=2;
  ctx.strokeRect(b.x,b.y,b.w,b.h);
  ctx.restore();

  // bar outline
  ctx.strokeStyle='rgba(220,20,60,.4)';ctx.lineWidth=1.5;
  ctx.strokeRect(b.x,b.y,b.w,b.h);

  // fill
  const fH=fill*b.h,fY=b.y+b.h-fH;
  const g=ctx.createLinearGradient(0,fY,0,b.y+b.h);
  g.addColorStop(0,'#DC143C');g.addColorStop(.5,'#B01030');g.addColorStop(1,'#8B0000');
  ctx.fillStyle=g;ctx.fillRect(b.x,fY,b.w,fH);

  // fill surface glow
  ctx.save();
  ctx.shadowColor='#FF2040';ctx.shadowBlur=55;
  ctx.fillStyle='#FF2040';ctx.fillRect(b.x,fY,b.w,5);
  ctx.restore();

  // wave on fill surface
  ctx.beginPath();ctx.moveTo(b.x,fY);
  for(let wx=b.x;wx<=b.x+b.w;wx+=2){
    const wave=Math.sin((wx-b.x)*.12+t*.1)*2.5;
    ctx.lineTo(wx,fY+wave);
  }
  ctx.lineTo(b.x+b.w,fY+5);ctx.lineTo(b.x,fY+5);ctx.closePath();
  ctx.fillStyle='rgba(255,50,80,.35)';ctx.fill();

  // old threshold marks
  for(const m of marks){
    const my=b.y+b.h*(1-m.pos);
    const age=t-m.t;
    const a=Math.max(.08,.35-age*.0002);
    ctx.strokeStyle=`rgba(220,20,60,${a})`;ctx.lineWidth=1;ctx.setLineDash([3,5]);
    ctx.beginPath();ctx.moveTo(b.x-16,my);ctx.lineTo(b.x+b.w+16,my);ctx.stroke();
    ctx.setLineDash([]);
  }

  // current target line
  const tY=b.y+b.h*.12;
  const tP=.65+Math.sin(t*.05)*.25;
  ctx.save();
  ctx.strokeStyle=`rgba(255,50,80,${tP})`;ctx.lineWidth=3;
  ctx.shadowColor='#DC143C';ctx.shadowBlur=20;
  ctx.beginPath();ctx.moveTo(b.x-30,tY);ctx.lineTo(b.x+b.w+30,tY);ctx.stroke();
  ctx.restore();

  // arrow indicators
  const aA=tP*.8;
  ctx.fillStyle=`rgba(255,50,80,${aA})`;
  ctx.beginPath();ctx.moveTo(b.x-36,tY);ctx.lineTo(b.x-30,tY-5);ctx.lineTo(b.x-30,tY+5);ctx.fill();
  ctx.beginPath();ctx.moveTo(b.x+b.w+36,tY);ctx.lineTo(b.x+b.w+30,tY-5);ctx.lineTo(b.x+b.w+30,tY+5);ctx.fill();

  // gap shimmer
  const gapH=tY-fY;
  if(gapH>10){
    const sg=ctx.createLinearGradient(0,fY,0,tY);
    sg.addColorStop(0,'rgba(220,20,60,.1)');
    sg.addColorStop(.5,`rgba(220,20,60,${.05+Math.sin(t*.04)*.03})`);
    sg.addColorStop(1,'rgba(220,20,60,0)');
    ctx.fillStyle=sg;ctx.fillRect(b.x+2,fY,b.w-4,gapH);
  }

  // streaks
  for(const s of streaks){
    ctx.save();
    ctx.strokeStyle=`rgba(255,80,100,${s.life*.9})`;ctx.lineWidth=s.w;
    ctx.shadowColor='#FF2040';ctx.shadowBlur=20;
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x,s.y+25);ctx.stroke();
    ctx.restore();
  }

  // particles
  for(const p of pts){
    const a=p.life*(p.bright?.95:.6);
    if(p.bright){
      ctx.save();
      ctx.shadowColor='#FF2040';ctx.shadowBlur=15;
      ctx.fillStyle=`rgba(255,180,190,${a})`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle=`rgba(220,20,60,${a})`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
  }

  // flash
  if(flash>.01){
    ctx.fillStyle=`rgba(255,50,80,${flash*.25})`;
    ctx.fillRect(0,0,W,H);
  }

  ctx.restore();
}

function loop(){update();draw();requestAnimationFrame(loop);}
window.addEventListener('resize',resize);
resize();loop();
</script>
</body>
</html>
