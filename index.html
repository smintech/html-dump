<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LOOP: MY LOOP</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Outfit',sans-serif;width:100vw;height:100vh}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
.wm-wrap{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;user-select:none}
.wm-topic{font-size:clamp(18px,3.5vw,36px);font-weight:300;color:rgba(168,85,247,0.5);letter-spacing:0.45em;text-transform:uppercase}
/* Adjusted font size slightly for two words */
.wm-name{font-size:clamp(40px,12vw,200px);font-weight:800;color:#A855F7;text-shadow:0 0 80px rgba(168,85,247,0.9),0 0 160px rgba(168,85,247,0.6),0 0 250px rgba(168,85,247,0.2);letter-spacing:0.04em;white-space:nowrap;line-height:0.85}
.stamp{position:fixed;bottom:20px;right:20px;z-index:3;pointer-events:none;user-select:none}
.stamp-pill{display:flex;align-items:center;gap:8px;padding:8px 18px 8px 16px;border-radius:100px;background:rgba(168,85,247,0.12);border:1px solid rgba(168,85,247,0.5);box-shadow:0 0 30px rgba(168,85,247,0.25),0 0 60px rgba(168,85,247,0.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.stamp-dot{width:8px;height:8px;border-radius:50%;background:#A855F7;box-shadow:0 0 12px rgba(168,85,247,0.9)}
.stamp-txt{font-size:clamp(10px,1.5vw,14px);font-weight:600;color:rgba(168,85,247,0.9);letter-spacing:0.12em;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="wm-wrap">
  <div class="wm-topic">LOOP</div>
  <div class="wm-name">MY LOOP</div>
</div>
<div class="stamp">
  <div class="stamp-pill">
    <div class="stamp-dot"></div>
    <div class="stamp-txt">YOU DO THIS TOO</div>
  </div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const RM=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
const CR=168,CG=85,CB=247; // Violet
let W,H,cx,cy;
const N=180;
let pts=[];
let t0=0,lastPhase='';
let executeFlash = 0;
let bubbleAlpha = 0;
let bubbleActive = false;
let bubbleScale = 0.2;
let shockwave = {radius:0, alpha:0, active:false};

function sz(){
  const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;
  c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';
  ctx.setTransform(d,0,0,d,0,0);cx=W/2;cy=H/2;
  init();
}

function init(){
  pts=[];
  for(let i=0;i<N;i++){
    pts.push({
      x:cx+(Math.random()-0.5)*W,
      y:cy+(Math.random()-0.5)*H,
      vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,
      angle:0, locked:false,
      sz:2.5+Math.random()*3.5,bright:0.6+Math.random()*0.4,trail:[]
    });
  }
  t0=performance.now();lastPhase='';
  executeFlash = 0;
  bubbleAlpha = 0.15;
  bubbleActive = false;
  bubbleScale = 0.2;
  shockwave = {radius:0, alpha:0, active:false};
}

const CY=15;
const PH=[
  ['dormant',0,5],
  ['execute',5,10],
  ['release',10,15]
];

function getPhase(t){
  const ct=t%CY;
  for(const[n,s,e]of PH)if(ct>=s&&ct<e)return{name:n,p:(ct-s)/(e-s)};
  return{name:'dormant',p:1};
}

function applyPhase(name){
  if(name===lastPhase)return;lastPhase=name;
  if(name==='execute'){
    executeFlash = 1.0; 
    bubbleAlpha = 1.0; 
    bubbleActive = true; 
    shockwave.active = true;
    shockwave.radius = 0;
    shockwave.alpha = 1.0;
    for(let i=0;i<N;i++){
      pts[i].locked = true;
      pts[i].angle = (i/N) * Math.PI * 2;
    }
  } else if(name==='release'){
    bubbleAlpha = 0.15; 
    bubbleActive = false;
    for(let i=0;i<N;i++){
      const p=pts[i];
      if(p.locked){
        const dx=p.x-cx,dy=p.y-cy,d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
        p.vx=(dx/d)*6+(Math.random()-0.5)*3;
        p.vy=(dy/d)*6+(Math.random()-0.5)*3;
        p.locked=false;
      }
    }
  }
}

function drawParticles(){
  ctx.globalCompositeOperation='lighter';

  for(let i=0;i<N;i++){
    const pt=pts[i];
    if(pt.trail.length<2)continue;
    for(let j=1;j<pt.trail.length;j++){
      const f=j/pt.trail.length;
      const a=f*0.8*(pt.locked?1:0.2); 
      ctx.beginPath();
      ctx.moveTo(pt.trail[j-1].x,pt.trail[j-1].y);
      ctx.lineTo(pt.trail[j].x,pt.trail[j].y);
      ctx.strokeStyle=`rgba(${CR},${CG},${CB},${a})`;
      ctx.lineWidth=pt.sz*f*2.5;ctx.lineCap='round';ctx.stroke();
    }
    
    const a=pt.locked?1:0.3; 
    const s=pt.locked?pt.sz*1.8:pt.sz;
    
    ctx.beginPath();ctx.arc(pt.x,pt.y,s*8,0,Math.PI*2);
    ctx.fillStyle=`rgba(${CR},${CG},${CB},${a*0.15})`;ctx.fill();
    
    ctx.beginPath();ctx.arc(pt.x,pt.y,s*3,0,Math.PI*2);
    ctx.fillStyle=`rgba(${CR},${CG},${CB},${a*0.4})`;ctx.fill();
    
    ctx.beginPath();ctx.arc(pt.x,pt.y,s,0,Math.PI*2);
    ctx.fillStyle=`rgba(${CR},${CG},${CB},${a})`;ctx.fill();
    
    if(pt.locked){
      ctx.beginPath();ctx.arc(pt.x,pt.y,s*0.5,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill();
    }
  }
  ctx.globalCompositeOperation='source-over';
}

function drawShockwave(){
  if(shockwave.alpha > 0.01){
    ctx.strokeStyle=`rgba(255,255,255,${shockwave.alpha})`;
    ctx.lineWidth=4;
    ctx.shadowColor='rgba(168,85,247,1)';
    ctx.shadowBlur=20;
    ctx.beginPath();ctx.arc(cx,cy,shockwave.radius,0,Math.PI*2);ctx.stroke();
    ctx.shadowBlur=0;
  }
}

function drawChatBubble(alpha, active, scale, t){
    const baseScale = Math.min(W,H) * 0.006;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(baseScale * scale, baseScale * scale);
    
    const glowAlpha = active ? 0.6 : 0.1;
    const g=ctx.createRadialGradient(0,0,0,0,0,100);
    g.addColorStop(0,`rgba(255,255,255,${glowAlpha})`);
    g.addColorStop(1,`rgba(255,255,255,0)`);
    ctx.fillStyle=g;ctx.fillRect(-100,-100,200,200);
    
    ctx.fillStyle='rgba(10, 10, 10, 0.9)';
    
    ctx.strokeStyle=`rgba(255,255,255,${alpha})`;
    ctx.lineWidth=6;
    ctx.lineJoin='round';
    ctx.shadowColor=`rgba(168,85,247,1)`;
    ctx.shadowBlur=25;
    
    const w=80, h=50, r=15;
    ctx.beginPath();
    ctx.moveTo(-w/2+r, -h/2);
    ctx.lineTo(w/2-r, -h/2);
    ctx.quadraticCurveTo(w/2, -h/2, w/2, -h/2+r);
    ctx.lineTo(w/2, h/2-r);
    ctx.quadraticCurveTo(w/2, h/2, w/2-r, h/2);
    ctx.lineTo(-10, h/2); 
    ctx.lineTo(-20, h/2+15); 
    ctx.lineTo(-25, h/2); 
    ctx.lineTo(-w/2+r, h/2);
    ctx.quadraticCurveTo(-w/2, h/2, -w/2, h/2-r);
    ctx.lineTo(-w/2, -h/2+r);
    ctx.quadraticCurveTo(-w/2, -h/2, -w/2+r, -h/2);
    ctx.closePath();
    ctx.fill(); 
    ctx.stroke(); 
    
    if(active){
        ctx.shadowBlur=0;
        for(let i=0; i<3; i++){
            const pulse = Math.max(0, Math.sin(t*15 - i*1.2));
            ctx.fillStyle=`rgba(255,255,255,${alpha * pulse})`;
            ctx.beginPath(); 
            ctx.arc(-15 + (i*15), 0, 5 * pulse, 0, Math.PI*2); 
            ctx.fill();
        }
    }
    
    ctx.shadowBlur=0;
    ctx.restore();
}

function frame(now){
  const el=(now-t0)/1000;
  const{name,p}=getPhase(el);
  applyPhase(name);

  if(!RM){
    const loopR=Math.min(W,H)*0.12; 
    
    if(name==='dormant'){
      for(let i=0;i<N;i++){
        const pt=pts[i];
        pt.vx+=(Math.random()-0.5)*0.2;
        pt.vy+=(Math.random()-0.5)*0.2;
        pt.vx*=0.95;pt.vy*=0.95;
        pt.x+=pt.vx;pt.y+=pt.vy;
      }
      bubbleScale = 0.2 + Math.sin(el*2)*0.02;
    }
    else if(name==='execute'){
      const speed=0.13; 
      for(let i=0;i<N;i++){
        const pt=pts[i];
        if(pt.locked){
          pt.angle+=speed;
          const wobble = Math.sin(el*25 + i) * 6;
          pt.x=cx+Math.cos(pt.angle)*(loopR+wobble);
          pt.y=cy+Math.sin(pt.angle)*(loopR+wobble);
        }
      }
      
      if(p < 0.1){
        bubbleScale = p * 12; 
      } else if(p < 0.2){
        bubbleScale = 1.2 - (p - 0.1) * 2; 
      } else {
        bubbleScale = 1.0 + Math.sin(el*8)*0.02; 
      }
      
      if(shockwave.active){
        shockwave.radius += Math.max(W,H) / 30;
        shockwave.alpha *= 0.92;
        if(shockwave.alpha < 0.05) shockwave.active = false;
      }
    }
    else if(name==='release'){
      for(let i=0;i<N;i++){
        const pt=pts[i];
        pt.vx+=(Math.random()-0.5)*0.2;
        pt.vy+=(Math.random()-0.5)*0.2;
        pt.vx*=0.95;pt.vy*=0.95;
        pt.x+=pt.vx;pt.y+=pt.vy;
      }
      bubbleScale = Math.max(0.2, 1.0 - p*8);
    }

    for(let i=0;i<N;i++){
      const pt=pts[i];
      pt.trail.push({x:pt.x,y:pt.y});
      const maxT=pt.locked?20:4; 
      while(pt.trail.length>maxT)pt.trail.shift();
    }
    
    executeFlash *= 0.85; 
  }

  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  drawParticles();
  drawShockwave();

  if(bubbleAlpha > 0.01){
    drawChatBubble(bubbleAlpha, bubbleActive, bubbleScale, el);
  }

  if(executeFlash > 0.01){
    ctx.fillStyle=`rgba(255,255,255,${executeFlash})`;
    ctx.fillRect(0,0,W,H);
  }

  if(!RM)requestAnimationFrame(frame);
}
sz();requestAnimationFrame(frame);window.addEventListener('resize',sz);
</script>
</body>
</html>
