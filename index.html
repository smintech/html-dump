<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Follow For More — CTA</title>
<link href="https://cdn.jsdelivr.net/fontsource/fonts/outfit@latest/latin-400-normal.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/outfit@latest/latin-600-normal.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/outfit@latest/latin-700-normal.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/outfit@latest/latin-800-normal.min.css" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Outfit', sans-serif;
  }
  #bgCanvas {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* ===== WATERMARK ===== */
  .watermark {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-3deg);
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: clamp(50px, 13vw, 150px);
    line-height: 1.15;
    white-space: nowrap;
    pointer-events: none;
    z-index: 1;
    user-select: none;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    filter: drop-shadow(0 0 30px rgba(16,185,129,0.15));
  }
  .wm-line {
    display: flex;
    overflow: hidden;
  }
  .wm-line span {
    display: inline-block;
    color: transparent;
    -webkit-text-stroke: 2.5px rgba(255,255,255,0.2);
    animation: wmWave 2.5s ease-in-out infinite;
  }
  .wm-line:nth-child(1) span:nth-child(1)  { animation-delay: 0s; }
  .wm-line:nth-child(1) span:nth-child(2)  { animation-delay: 0.08s; }
  .wm-line:nth-child(1) span:nth-child(3)  { animation-delay: 0.16s; }
  .wm-line:nth-child(1) span:nth-child(4)  { animation-delay: 0.24s; }
  .wm-line:nth-child(1) span:nth-child(5)  { animation-delay: 0.32s; }
  .wm-line:nth-child(1) span:nth-child(6)  { animation-delay: 0.40s; }
  .wm-line:nth-child(2) span:nth-child(1)  { animation-delay: 0.12s; }
  .wm-line:nth-child(2) span:nth-child(2)  { animation-delay: 0.20s; }
  .wm-line:nth-child(2) span:nth-child(3)  { animation-delay: 0.28s; }
  .wm-line:nth-child(2) span:nth-child(4)  { animation-delay: 0.36s; }
  .wm-line:nth-child(2) span:nth-child(5)  { animation-delay: 0.44s; }
  .wm-line:nth-child(2) span:nth-child(6)  { animation-delay: 0.52s; }
  .wm-line:nth-child(2) span:nth-child(7)  { animation-delay: 0.60s; }
  .wm-line:nth-child(2) span:nth-child(8)  { animation-delay: 0.68s; }
  @keyframes wmWave {
    0%, 100% {
      transform: translateY(0) scale(1);
      -webkit-text-stroke-color: rgba(255,255,255,0.2);
      filter: drop-shadow(0 0 0px transparent);
    }
    25% {
      transform: translateY(-10px) scale(1.05);
      -webkit-text-stroke-color: rgba(16,185,129,0.55);
      filter: drop-shadow(0 0 12px rgba(16,185,129,0.3));
    }
    50% {
      transform: translateY(2px) scale(1);
      -webkit-text-stroke-color: rgba(255,255,255,0.22);
      filter: drop-shadow(0 0 0px transparent);
    }
    75% {
      transform: translateY(-5px) scale(1.02);
      -webkit-text-stroke-color: rgba(56,189,248,0.4);
      filter: drop-shadow(0 0 10px rgba(56,189,248,0.2));
    }
  }
  .watermark::after {
    content: '';
    position: absolute;
    top: -10%;
    left: -20%;
    width: 35%;
    height: 120%;
    background: linear-gradient(90deg, transparent, rgba(16,185,129,0.15), transparent);
    transform: skewX(-15deg);
    animation: wmScan 3.5s ease-in-out infinite;
  }
  @keyframes wmScan {
    0% { left: -40%; }
    100% { left: 140%; }
  }

  /* ===== CTA ===== */
  .cta-wrap {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: ctaIn 4.5s ease-in-out infinite;
  }
  @keyframes ctaIn {
    0% { opacity: 0; transform: translateY(24px) scale(0.93); }
    10% { opacity: 1; transform: translateY(0) scale(1); }
    78% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-10px) scale(0.97); }
  }
  .cta-pill {
    position: relative;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 60px;
    padding: 18px 20px 18px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    overflow: hidden;
  }
  .cta-pill::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 62px;
    background: linear-gradient(135deg, rgba(16,185,129,0.4), rgba(56,189,248,0.2), rgba(16,185,129,0.4));
    z-index: -1;
    animation: gp 2s ease-in-out infinite;
    opacity: 0.5;
  }
  @keyframes gp { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
  .cta-ico {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(16,185,129,0.15);
    border: 1.5px solid rgba(16,185,129,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    animation: icoIn 4.5s ease-in-out infinite;
    font-size: 18px;
    color: #10b981;
  }
  @keyframes icoIn {
    0%,10% { transform: scale(0) rotate(-30deg); opacity: 0; }
    16% { transform: scale(1.15) rotate(5deg); opacity: 1; }
    20% { transform: scale(1) rotate(0deg); }
    78% { transform: scale(1) rotate(0deg); opacity: 1; }
    100% { transform: scale(0.8) rotate(-10deg); opacity: 0; }
  }
  .cta-txt {
    font-size: clamp(15px, 3.8vw, 22px);
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    letter-spacing: 0.3px;
    line-height: 1.3;
  }
  .cta-txt .hl { color: #10b981; }
  .cta-txt .dim { color: rgba(255,255,255,0.5); font-weight: 400; }
  .cta-line {
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, #10b981, #38bdf8);
    border-radius: 2px;
    margin-top: 14px;
    animation: ld 4.5s ease-in-out infinite;
  }
  @keyframes ld {
    0%,16% { width: 0; opacity: 0; }
    28% { width: 140px; opacity: 1; }
    72% { width: 140px; opacity: 1; }
    100% { width: 0; opacity: 0; }
  }

  /* ===== SINGLE SELECTOR BUTTON ===== */
  .selector-wrap {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .sel-toggle {
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sel-toggle:hover {
    background: rgba(16,185,129,0.1);
    border-color: rgba(16,185,129,0.3);
    color: #10b981;
  }
  .sel-toggle.open {
    background: rgba(16,185,129,0.12);
    border-color: rgba(16,185,129,0.35);
    color: #10b981;
  }
  .sel-toggle .arrow {
    transition: transform 0.3s ease;
    font-size: 10px;
  }
  .sel-toggle.open .arrow {
    transform: rotate(180deg);
  }

  /* Dropdown panel */
  .sel-panel {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 6px;
    min-width: 260px;
    max-height: 340px;
    overflow-y: auto;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
  }
  .sel-panel::-webkit-scrollbar { width: 4px; }
  .sel-panel::-webkit-scrollbar-track { background: transparent; }
  .sel-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
  .sel-panel.open {
    opacity: 1;
    pointer-events: all;
    transform: translateX(-50%) translateY(0);
  }
  .sel-cat {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.3);
    padding: 10px 12px 4px;
  }
  .sel-item {
    font-family: 'Outfit', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    padding: 8px 12px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.55);
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
    width: 100%;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sel-item:hover {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.9);
  }
  .sel-item.on {
    background: rgba(16,185,129,0.1);
    color: #10b981;
  }
  .sel-item .sym {
    font-size: 13px;
    width: 18px;
    text-align: center;
    flex-shrink: 0;
    opacity: 0.7;
  }

  @media (max-width: 480px) {
    .watermark { font-size: clamp(32px, 11vw, 90px); letter-spacing: 4px; }
    .wm-line span { -webkit-text-stroke: 1.8px rgba(255,255,255,0.18); }
    .cta-pill { padding: 14px 14px; gap: 10px; }
    .cta-ico { width: 34px; height: 34px; font-size: 15px; }
    .cta-txt { font-size: clamp(13px, 3.5vw, 18px); }
    .sel-panel { min-width: 220px; max-height: 280px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="watermark">
  <div class="wm-line">

<div class="cta-wrap" id="cta">
  <div class="cta-pill">
    <div class="cta-ico" id="ico"></div>
    <div class="cta-txt" id="txt"></div>
  </div>
  <div class="cta-line"></div>
</div>

<div class="selector-wrap">
  <div class="sel-panel" id="panel"></div>
  <button class="sel-toggle" id="toggle">
    <span id="toggleLabel">Psychology</span>
    <span class="arrow">▼</span>
  </button>
</div>

<script>
/* ===== BRIGHTER PARTICLES + FLOATING ICONS ===== */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

/* Dots — brighter palette */
const NUM = 150;
const dots = [];

function makeDot() {
  const angle = Math.random() * Math.PI * 2;
  const speed = 0.6 + Math.random() * 2.5;
  return {
    x: Math.random() * W,
    y: Math.random() * H,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    r: Math.random() * 3.5 + 1.5,
    hue: Math.random() < 0.55 ? 160 : (Math.random() < 0.5 ? 340 : 200),
    sat: 80 + Math.random() * 20,
    light: 65 + Math.random() * 25,
    alpha: 0.8 + Math.random() * 0.2,
    pulseSpeed: 0.002 + Math.random() * 0.004,
    pulseOffset: Math.random() * Math.PI * 2
  };
}
for (let i = 0; i < NUM; i++) dots.push(makeDot());

/* Floating pattern icons — brighter */
const ICONS = ['✓', '∙', '→', '★', '✦', '?'];
const NUM_ICONS = 32;
const floatingIcons = [];

function makeIcon() {
  const angle = Math.random() * Math.PI * 2;
  const speed = 0.2 + Math.random() * 0.8;
  return {
    x: Math.random() * W,
    y: Math.random() * H,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    char: ICONS[Math.floor(Math.random() * ICONS.length)],
    size: 14 + Math.random() * 24,
    alpha: 0.25 + Math.random() * 0.35,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.012,
    wobbleAmp: 0.4 + Math.random() * 1,
    wobbleSpeed: 0.001 + Math.random() * 0.003,
    wobbleOffset: Math.random() * Math.PI * 2,
    hue: Math.random() < 0.6 ? 160 : 200
  };
}
for (let i = 0; i < NUM_ICONS; i++) floatingIcons.push(makeIcon());

const LINK_DIST = 140;

function drawBg(time) {
  ctx.clearRect(0, 0, W, H);

  /* Floating pattern icons — behind everything, now brighter */
  for (const ic of floatingIcons) {
    ic.x += ic.vx;
    ic.y += ic.vy + Math.sin(time * ic.wobbleSpeed + ic.wobbleOffset) * ic.wobbleAmp * 0.3;
    ic.rotation += ic.rotSpeed;

    if (ic.x < -50) ic.x = W + 50;
    if (ic.x > W + 50) ic.x = -50;
    if (ic.y < -50) ic.y = H + 50;
    if (ic.y > H + 50) ic.y = -50;

    const pulse = 0.75 + Math.sin(time * 0.002 + ic.wobbleOffset) * 0.25;
    const a = ic.alpha * pulse;

    /* Icon glow */
    ctx.save();
    ctx.translate(ic.x, ic.y);
    ctx.rotate(ic.rotation);
    ctx.font = `bold ${ic.size}px Outfit`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = `hsla(${ic.hue}, 90%, 70%, ${a * 0.9})`;
    ctx.shadowBlur = 25;
    ctx.fillStyle = `hsla(${ic.hue}, 85%, 75%, ${a})`;
    ctx.fillText(ic.char, 0, 0);
    /* Second pass for extra brightness */
    ctx.shadowBlur = 12;
    ctx.fillStyle = `hsla(${ic.hue}, 60%, 90%, ${a * 0.5})`;
    ctx.fillText(ic.char, 0, 0);
    ctx.restore();
  }

  /* Connections — brighter */
  ctx.save();
  ctx.lineWidth = 1;
  for (let i = 0; i < dots.length; i++) {
    for (let j = i + 1; j < dots.length; j++) {
      const dx = dots[i].x - dots[j].x;
      const dy = dots[i].y - dots[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < LINK_DIST) {
        const a = (1 - dist / LINK_DIST) * 0.5;
        const midHue = (dots[i].hue + dots[j].hue) / 2;
        ctx.strokeStyle = `hsla(${midHue},90%,70%,${a})`;
        ctx.beginPath();
        ctx.moveTo(dots[i].x, dots[i].y);
        ctx.lineTo(dots[j].x, dots[j].y);
        ctx.stroke();
      }
    }
  }
  ctx.restore();

  /* Dots — much brighter */
  for (const d of dots) {
    d.x += d.vx;
    d.y += d.vy;

    if (d.x < 0 || d.x > W) d.vx *= -1;
    if (d.y < 0 || d.y > H) d.vy *= -1;
    d.x = Math.max(0, Math.min(W, d.x));
    d.y = Math.max(0, Math.min(H, d.y));

    const pulse = 0.75 + Math.sin(time * d.pulseSpeed + d.pulseOffset) * 0.25;
    const finalAlpha = d.alpha * pulse;
    const finalR = d.r * (0.85 + pulse * 0.25);

    /* Large outer glow */
    ctx.save();
    ctx.globalAlpha = finalAlpha * 0.6;
    ctx.shadowColor = `hsla(${d.hue},${d.sat}%,${d.light}%,1)`;
    ctx.shadowBlur = 50;
    ctx.beginPath();
    ctx.arc(d.x, d.y, finalR * 4, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${d.hue},${d.sat}%,${d.light}%,0.15)`;
    ctx.fill();
    ctx.restore();

    /* Mid glow */
    ctx.save();
    ctx.globalAlpha = finalAlpha * 0.7;
    ctx.shadowColor = `hsla(${d.hue},${d.sat}%,${d.light}%,1)`;
    ctx.shadowBlur = 30;
    ctx.beginPath();
    ctx.arc(d.x, d.y, finalR * 2.2, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${d.hue},${d.sat}%,${d.light}%,0.25)`;
    ctx.fill();
    ctx.restore();

    /* Core dot */
    ctx.save();
    ctx.globalAlpha = finalAlpha;
    ctx.shadowColor = `hsla(${d.hue},${d.sat}%,${d.light}%,1)`;
    ctx.shadowBlur = 22;
    ctx.beginPath();
    ctx.arc(d.x, d.y, finalR, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${d.hue},${d.sat}%,${d.light}%,1)`;
    ctx.fill();
    ctx.restore();

    /* Bright white center highlight */
    ctx.save();
    ctx.globalAlpha = finalAlpha * 0.95;
    ctx.beginPath();
    ctx.arc(d.x, d.y, finalR * 0.45, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${d.hue},20%,95%,1)`;
    ctx.fill();
    ctx.restore();
  }

  requestAnimationFrame(drawBg);
}
requestAnimationFrame(drawBg);

  {

      { sym: '→', text: '<span class="hl">Follow</span> <span class="dim">for the next character</span>' },
      { sym: '→', text: '<span class="hl">Follow</span> <span class="dim">to meet the next character</span>' },

/* ===== DOM ===== */
const cta = document.getElementById('cta');
const ico = document.getElementById('ico');
const txt = document.getElementById('txt');
const toggle = document.getElementById('toggle');
const toggleLabel = document.getElementById('toggleLabel');
const panel = document.getElementById('panel');

let currentCat = 0;
let currentItem = 0;
let panelOpen = false;

function buildPanel() {
  panel.innerHTML = '';
  categories.forEach((cat, ci) => {
    const catLabel = document.createElement('div');
    catLabel.className = 'sel-cat';
    catLabel.textContent = cat.name;
    panel.appendChild(catLabel);

    cat.items.forEach((item, ii) => {
      const btn = document.createElement('button');
      btn.className = 'sel-item' + (ci === currentCat && ii === currentItem ? ' on' : '');
      btn.innerHTML = `<span class="sym">${item.sym}</span><span>${item.text}</span>`;
      btn.addEventListener('click', () => {
        currentCat = ci;
        currentItem = ii;
        pick(ci, ii);
        toggleLabel.textContent = cat.name;
        buildPanel();
      });
      panel.appendChild(btn);
    });
  });
}

function pick(ci, ii) {
  const item = categories[ci].items[ii];
  ico.textContent = item.sym;
  txt.innerHTML = item.text;

  cta.style.animation = 'none';
  cta.offsetHeight;
  cta.style.animation = '';
}

toggle.addEventListener('click', () => {
  panelOpen = !panelOpen;
  panel.classList.toggle('open', panelOpen);
  toggle.classList.toggle('open', panelOpen);
});

/* Close panel on outside click */
document.addEventListener('click', (e) => {
  if (!toggle.contains(e.target) && !panel.contains(e.target) && panelOpen) {
    panelOpen = false;
    panel.classList.remove('open');
    toggle.classList.remove('open');
  }
});

/* Init */
buildPanel();
pick(0, 0);
toggleLabel.textContent = categories[0].name;
</script>
