<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Swapper — Oscar</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;width:100vw;height:100vh;font-family:'Outfit',sans-serif}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
.watermark-wrap{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;
  user-select:none;pointer-events:none;z-index:0;
}
.watermark-sub{
  font-family:'Outfit',sans-serif;font-size:clamp(18px,4.5vmin,50px);font-weight:600;
  color:#9a7a2a;letter-spacing:.2em;line-height:1;margin-bottom:-1vmin;
  text-shadow:0 0 40px rgba(212,160,48,.5),0 0 80px rgba(212,160,48,.2);
}
.watermark-name{
  font-family:'Outfit',sans-serif;font-size:clamp(80px,26vmin,400px);font-weight:800;
  color:#6a5a1a;letter-spacing:.04em;line-height:1;
  text-shadow:0 0 80px rgba(212,160,48,.6),0 0 160px rgba(212,160,48,.3);
}
.stamp{
  position:fixed;bottom:18px;right:18px;
  font-family:'Outfit',sans-serif;font-size:11px;font-weight:600;
  color:rgba(255,255,255,.8);
  background:rgba(180,140,40,.35);
  padding:5px 12px;
  border-radius:20px;
  box-shadow:0 0 12px rgba(212,160,48,.7), 0 0 25px rgba(212,160,48,.3);
  user-select:none;pointer-events:none;z-index:10;letter-spacing:.1em;
}
@media(prefers-reduced-motion:reduce){canvas{display:none}}
</style>
</head>
<body>
<div class="watermark-wrap">
  <div class="watermark-sub">ADDICTION</div>
  <div class="watermark-name">OSCAR</div>
</div>
<canvas id="c"></canvas>
<div class="stamp">YOU DO THIS TOO</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,dpr;

const SC=[
  {r:224,g:112,b:32},  // vape - orange
  {r:192,g:64,b:64},   // shoe - red
  {r:128,g:80,b:160},  // controller - purple
  {r:64,g:160,b:128}   // phone - teal
];
const SN=SC.length;

let rotA=0,rotSpd=.007;
let activeIdx=0,prevActive=0,swapFlash=0;
let flowPts=[],pts=[],dustPts=[],t=0;
let shakeX=0,shakeY=0;

function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  c.width=W*dpr;c.height=H*dpr;
  c.style.width=W+'px';c.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  
  // Initialize background dust
  dustPts=[];
  for(let i=0;i<60;i++){
    dustPts.push({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*.15,vy:-.08-Math.random()*.15,
      r:Math.random()*1.5+.5,alpha:Math.random()*.12+.03
    });
  }
}

function oR(){return Math.min(W,H)*.22;}

function sPos(i){
  const r=oR(),a=rotA+(i/SN)*Math.PI*2;
  return{x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r};
}

function rRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawIcon(idx,x,y,s,alpha){
  const col=SC[idx];
  const hi_r=Math.min(255,col.r+80),hi_g=Math.min(255,col.g+80),hi_b=Math.min(255,col.b+80);
  const f=`rgba(${col.r},${col.g},${col.b},${alpha})`;
  const h=`rgba(${hi_r},${hi_g},${hi_b},${alpha})`;

  switch(idx){
    case 0: // vape
      ctx.fillStyle=f;
      rRect(x-s*.1,y-s*.3,s*.2,s*.55,s*.06);ctx.fill();
      ctx.fillStyle=h;
      ctx.beginPath();ctx.arc(x,y-s*.36,s*.07,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=`rgba(${hi_r},${hi_g},${hi_b},${alpha*.5})`;
      rRect(x-s*.12,y+s*.25,s*.24,s*.1,s*.04);ctx.fill();
      break;

    case 1: // shoe
      ctx.fillStyle=f;
      ctx.beginPath();
      ctx.moveTo(x-s*.38,y+s*.12);
      ctx.lineTo(x+s*.32,y+s*.12);
      ctx.quadraticCurveTo(x+s*.42,y+s*.05,x+s*.38,y-s*.05);
      ctx.lineTo(x+s*.12,y-s*.18);
      ctx.quadraticCurveTo(x-s*.05,y-s*.28,x-s*.2,y-s*.2);
      ctx.quadraticCurveTo(x-s*.38,y-s*.1,x-s*.38,y+s*.12);
      ctx.closePath();ctx.fill();
      ctx.strokeStyle=h;ctx.lineWidth=s*.04;
      ctx.beginPath();ctx.moveTo(x-s*.35,y+s*.08);ctx.lineTo(x+s*.3,y+s*.08);ctx.stroke();
      break;

    case 2: // controller
      ctx.fillStyle=f;
      ctx.beginPath();ctx.arc(x-s*.22,y+s*.06,s*.17,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x+s*.22,y+s*.06,s*.17,0,Math.PI*2);ctx.fill();
      rRect(x-s*.16,y-s*.1,s*.32,s*.18,s*.04);ctx.fill();
      ctx.fillStyle=h;
      ctx.fillRect(x-s*.26-s*.02,y-s*.02,s*.04,s*.04);
      ctx.fillRect(x-s*.26,y-s*.04,s*.02,s*.08);
      ctx.beginPath();ctx.arc(x+s*.2,y-s*.03,s*.03,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x+s*.28,y+.01*s,s*.025,0,Math.PI*2);ctx.fill();
      break;

    case 3: // phone
      ctx.fillStyle=f;
      rRect(x-s*.13,y-s*.35,s*.26,s*.7,s*.05);ctx.fill();
      ctx.fillStyle=`rgba(0,0,0,${alpha*.4})`;
      rRect(x-s*.1,y-s*.28,s*.2,s*.52,s*.03);ctx.fill();
      ctx.fillStyle=h;
      rRect(x-s*.06,y+s*.28,s*.12,s*.02,s*.01);ctx.fill();
      break;
  }
}

function addFlow(sx,sy,col){flowPts.push({sx,sy,p:0,spd:.015+Math.random()*.01,col});}

function burst(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,spd=4+Math.random()*9;
    const isBig=Math.random()>.85;
    const isSpark=Math.random()>.4;
    pts.push({
      x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      life:1,decay:isSpark?.015+Math.random()*.02:.004+Math.random()*.01,
      r:isBig?Math.random()*6+4:isSpark?Math.random()*2.5+1:Math.random()*3+1,
      col,bright:Math.random()>.2,spark:isSpark
    });
  }
}

function update(){
  t++;rotA+=rotSpd;
  let bestI=0,bestY=Infinity;
  for(let i=0;i<SN;i++){const p=sPos(i);if(p.y<bestY){bestY=p.y;bestI=i;}}
  
  if(bestI!==activeIdx){
    prevActive=activeIdx;activeIdx=bestI;swapFlash=2;
    const np=sPos(activeIdx);
    burst(np.x,np.y,SC[activeIdx],150);
    shakeX=(Math.random()-.5)*20;shakeY=(Math.random()-.5)*20;
  }
  
  shakeX*=0.85;shakeY*=0.85;swapFlash*=.9;

  const cx=W/2,cy=H/2,ap=sPos(activeIdx);
  if(Math.random()<.5)addFlow(ap.x,ap.y,SC[activeIdx]);
  if(Math.random()<.25){const a=Math.random()*Math.PI*2,spd=.4+Math.random()*.6;pts.push({x:cx,y:cy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,decay:.008+Math.random()*.006,r:Math.random()*2+.5,col:{r:212,g:160,b:48},bright:true,spark:true});}

  // Update dust
  for(const d of dustPts){
    d.x+=d.vx;d.y+=d.vy;
    if(d.y<-10){d.y=H+10;d.x=Math.random()*W;}
    if(d.x<-10)d.x=W+10;
    if(d.x>W+10)d.x=-10;
  }

  for(let i=flowPts.length-1;i>=0;i--){flowPts[i].p+=flowPts[i].spd;if(flowPts[i].p>=1)flowPts.splice(i,1);}
  if(flowPts.length>400)flowPts.splice(0,flowPts.length-400);
  for(let i=pts.length-1;i>=0;i--){const p=pts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.life-=p.decay;if(p.life<=0)pts.splice(i,1);}
  if(pts.length>1000)pts.splice(0,pts.length-1000);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(shakeX,shakeY);
  
  const cx=W/2,cy=H/2,oRad=oR();

  // Background base glow
  const bgA=.1+Math.sin(t*.02)*.03;
  const bgG=ctx.createRadialGradient(cx,cy,0,cx,cy,W*.6);
  bgG.addColorStop(0,`rgba(100,75,20,${bgA})`);bgG.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);

  // Background Grid
  ctx.strokeStyle='rgba(212,160,48,0.03)';ctx.lineWidth=1;
  const gridSize=80;
  for(let gx=(cx%gridSize);gx<W;gx+=gridSize){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
  for(let gy=(cy%gridSize);gy<H;gy+=gridSize){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}

  // Background Dust
  for(const d of dustPts){
    ctx.fillStyle=`rgba(212,160,48,${d.alpha})`;
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();
  }

  // orbit ring
  ctx.strokeStyle='rgba(212,160,48,.1)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(cx,cy,oRad,0,Math.PI*2);ctx.stroke();

  // flow particles
  for(const f of flowPts){
    const fx=f.sx+(cx-f.sx)*f.p,fy=f.sy+(cy-f.sy)*f.p;
    const a=(1-f.p)*.9;
    ctx.save();
    ctx.shadowColor=`rgba(${f.col.r},${f.col.g},${f.col.b},.6)`;ctx.shadowBlur=8;
    ctx.fillStyle=`rgba(${f.col.r},${f.col.g},${f.col.b},${a})`;
    ctx.beginPath();ctx.arc(fx,fy,3.5*(1-f.p)+1,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // connection line
  const ap=sPos(activeIdx),ac=SC[activeIdx];
  const lineA=.25+swapFlash*.5;
  ctx.save();
  ctx.strokeStyle=`rgba(${ac.r},${ac.g},${ac.b},${lineA})`;ctx.lineWidth=3;
  ctx.shadowColor=`rgba(${ac.r},${ac.g},${ac.b},.6)`;ctx.shadowBlur=25;
  ctx.beginPath();ctx.moveTo(ap.x,ap.y);ctx.lineTo(cx,cy);ctx.stroke();
  ctx.restore();

  // icons
  for(let i=0;i<SN;i++){
    const p=sPos(i),isActive=i===activeIdx;
    const sz=isActive?45:28;
    const alpha=isActive?.95:.35;

    if(isActive){
      ctx.save();
      ctx.shadowColor=`rgba(${SC[i].r},${SC[i].g},${SC[i].b},.7)`;ctx.shadowBlur=55;
      ctx.fillStyle=`rgba(${SC[i].r},${SC[i].g},${SC[i].b},.25)`;
      ctx.beginPath();ctx.arc(p.x,p.y,sz*.6,0,Math.PI*2);ctx.fill();
      ctx.restore();
      ctx.strokeStyle=`rgba(${SC[i].r},${SC[i].g},${SC[i].b},.35)`;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(p.x,p.y,sz*.65,0,Math.PI*2);ctx.stroke();
    }

    drawIcon(i,p.x,p.y,sz,alpha);
  }

  // core
  const cPulse=1+Math.sin(t*.03)*.06,cR=30*cPulse;
  ctx.strokeStyle='rgba(212,160,48,.2)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(cx,cy,cR+18,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(212,160,48,.12)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(cx,cy,cR+28,0,Math.PI*2);ctx.stroke();
  ctx.save();
  ctx.shadowColor='#F0C850';ctx.shadowBlur=80;
  ctx.fillStyle='rgba(212,160,48,.3)';
  ctx.beginPath();ctx.arc(cx,cy,cR+10,0,Math.PI*2);ctx.fill();
  ctx.restore();
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,cR);
  cg.addColorStop(0,'rgba(255,230,120,1)');cg.addColorStop(.4,'rgba(212,160,48,.9)');cg.addColorStop(1,'rgba(139,105,20,.3)');
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,cR,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.shadowColor='#FFFACD';ctx.shadowBlur=35;
  ctx.fillStyle='rgba(255,240,180,.9)';
  ctx.beginPath();ctx.arc(cx,cy,12,0,Math.PI*2);ctx.fill();ctx.restore();

  // particles
  for(const p of pts){
    let a, colStr;
    const baseAlpha = p.life;
    
    if(p.spark){ 
      a = baseAlpha * 1.2;
      colStr = `rgba(255,255,220,${Math.min(a, 1)})`;
    } else if(p.bright){ 
      a = baseAlpha * 0.9;
      colStr = `rgba(${Math.min(255, p.col.r+80)},${Math.min(255, p.col.g+80)},${Math.min(255, p.col.b+80)},${Math.min(a, 1)})`;
    } else { 
      a = baseAlpha * 0.5;
      colStr = `rgba(${p.col.r},${p.col.g},${p.col.b},${a})`;
    }
    
    if(p.spark||p.bright){
      ctx.save();
      ctx.shadowColor = p.spark ? '#FFFACD' : `rgba(${p.col.r},${p.col.g},${p.col.b},.8)`;
      ctx.shadowBlur = p.spark ? 25 : 12;
      ctx.fillStyle = colStr;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = colStr;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
  }

  // swap flash
  if(swapFlash>.01){
    ctx.fillStyle=`rgba(255,240,200,${swapFlash*.35})`;
    ctx.fillRect(0,0,W,H);
  }

  ctx.restore();
}

function loop(){update();draw();requestAnimationFrame(loop);}
window.addEventListener('resize',resize);resize();loop();
</script>
</body>
</html>
