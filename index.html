<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHLOE — The Chameleon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; }
  body { font-family:'Outfit', system-ui, sans-serif; }

  .stage { position:fixed; inset:0; }

  /* ---- stage light: takes the color of whatever she's matching ---- */
  .glow {
    position:absolute; left:50%; top:54%;
    width:120vmin; height:120vmin;
    transform:translate(-50%,-50%);
    background: radial-gradient(closest-side, currentColor, transparent 72%);
    opacity:.15; z-index:0;
    color:#ff5a5f;
    animation: chamColor 22s linear infinite;
  }

  /* ---- title watermark ---- */
  .title-block { position:absolute; top:12%; left:0; right:0; text-align:center; z-index:1; }
  .name {
    font-size: clamp(64px, 23vmin, 340px);
    font-weight:800; line-height:.95; letter-spacing:.03em;
    color:#2dd4bf;
    text-shadow: 0 0 18px rgba(45,212,191,.55), 0 0 60px rgba(45,212,191,.28);
    white-space:nowrap;
  }
  .theme-label {
    display:inline-block; margin-top:1.6vmin;
    font-size: clamp(10px, 2.4vmin, 26px); font-weight:600;
    letter-spacing:.6em; padding-left:.6em;
    color:#dffdf7;
    text-shadow: 0 0 14px rgba(45,212,191,.5);
  }

  /* ---- the shelf ---- */
  .shelf {
    position:absolute; top:62%; left:-2vw; width:104vw;
    height:3vmin; min-height:14px;
    background: linear-gradient(#6e543a, #38271b 65%, #241710);
    border-top: 2px solid rgba(255,215,170,.38);
    border-radius:2px;
    box-shadow: 0 2vmin 4vmin rgba(0,0,0,.85);
    z-index:2;
  }

  /* ---- objects sliding past her ---- */
  .obj-track { position:absolute; top:62%; left:0; z-index:3; will-change:transform; }
  .obj { display:block; width:13vmin; min-width:52px; transform:translateY(-100%); }
  .track1 { animation: slide1 22s linear infinite; }
  .track2 { animation: slide2 22s linear infinite; }
  .track3 { animation: slide3 22s linear infinite; }
  .track4 { animation: slide4 22s linear infinite; }
  .track5 { animation: slide5 22s linear infinite; }

  /* ---- the chameleon ---- */
  .cham-wrap {
    position:absolute; left:50%; bottom: calc(38% + 1.9vmin);
    transform:translateX(-50%);
    width: min(52vmin, 82vw);
    z-index:4;
    color:#ff5a5f;
    animation: chamColor 22s linear infinite;
  }
  .cham-wrap svg { display:block; width:100%; }

  .tail       { transform-box:view-box; transform-origin:122px 150px; animation: tailSway 1.8s ease-in-out infinite alternate; }
  .leg-front  { transform-box:view-box; transform-origin:252px 182px; animation: legSwing .6s ease-in-out infinite alternate; }
  .leg-back   { transform-box:view-box; transform-origin:150px 184px; animation: legSwing .6s ease-in-out infinite alternate-reverse; }
  .pupil-wrap { transform-box:view-box; transform-origin:274px 136px; animation: orbit 7s linear infinite; }
  .cham-body  { transform-box:view-box; animation: bob .6s ease-in-out infinite alternate; }

  @keyframes bob       { from { transform: translateY(0) }      to { transform: translateY(2.5px) } }
  @keyframes legSwing  { from { transform: rotate(8deg) }       to { transform: rotate(-8deg) } }
  @keyframes tailSway  { from { transform: rotate(-4deg) }      to { transform: rotate(4deg) } }
  @keyframes orbit     { from { transform: rotate(0deg) }       to { transform: rotate(360deg) } }

  /* the borrowed-color cycle: match, match, match, match, match — then alone she tries them all, none fit, blank */
  @keyframes chamColor {
    0%     { color:#ff5a5f }
    13.6%  { color:#ff5a5f }
    18.2%  { color:#ffd166 }
    29.5%  { color:#ffd166 }
    34.1%  { color:#b388ff }
    45.5%  { color:#b388ff }
    50%    { color:#4da3ff }
    61.4%  { color:#4da3ff }
    65.9%  { color:#5ad787 }
    81.8%  { color:#5ad787 }
    /* nothing left to match — flickers through every borrowed color */
    82.3%  { color:#ff5a5f }
    83.4%  { color:#ffd166 }
    84.5%  { color:#b388ff }
    85.7%  { color:#4da3ff }
    86.8%  { color:#5ad787 }
    /* alone, no color of her own */
    88.2%  { color:#9aa0a6 }
    93.2%  { color:#70757c }
    96.4%  { color:#70757c }
    100%   { color:#ff5a5f }
  }

  @keyframes slide1 { 0% { transform:translateX(115vw) }          18.2% { transform:translateX(-30vw) } 100% { transform:translateX(-30vw) } }
  @keyframes slide2 { 0%, 15.9% { transform:translateX(115vw) }   34.1% { transform:translateX(-30vw) } 100% { transform:translateX(-30vw) } }
  @keyframes slide3 { 0%, 31.8% { transform:translateX(115vw) }   50%   { transform:translateX(-30vw) } 100% { transform:translateX(-30vw) } }
  @keyframes slide4 { 0%, 47.7% { transform:translateX(115vw) }   65.9% { transform:translateX(-30vw) } 100% { transform:translateX(-30vw) } }
  @keyframes slide5 { 0%, 63.6% { transform:translateX(115vw) }   81.8% { transform:translateX(-30vw) } 100% { transform:translateX(-30vw) } }

  /* ---- corner stamp: glowing circular seal ---- */
  .stamp {
    position:absolute; right:2.4vmin; bottom:2vmin;
    width: clamp(72px, 15vmin, 150px);
    z-index:6; opacity:.95;
  }
  .stamp svg {
    display:block; width:100%; height:auto;
    filter: drop-shadow(0 0 8px rgba(45,212,191,.6));
    animation: stampPulse 3s ease-in-out infinite;
  }
  .seal-ring { stroke:#2dd4bf; }
  .seal-text {
    font-family:'Outfit', system-ui, sans-serif;
    font-weight:800; font-size:13px; letter-spacing:2px;
    fill:#8ef7e6;
  }
  .seal-dot { fill:#2dd4bf; }
  @keyframes stampPulse {
    0%,100% { filter: drop-shadow(0 0 6px rgba(45,212,191,.5)); }
    50%     { filter: drop-shadow(0 0 15px rgba(45,212,191,.95)); }
  }

  /* ---- reduced motion: one still frame, she matches what's beside her ---- */
  .obj-static { display:none; position:absolute; top:62%; left:calc(50% + 30vmin); z-index:3; }
  .obj-static svg { display:block; width:13vmin; min-width:52px; transform:translateY(-100%); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .obj-track { display:none; }
    .obj-static { display:block; }
    .cham-wrap, .glow { color:#ff5a5f; }
  }
</style>
</head>
<body>
<div class="stage">

  <div class="glow"></div>

  <div class="title-block">
    <div class="name">CHLOE</div>
    <div class="theme-label">THE CHAMELEON</div>
  </div>

  <div class="shelf"></div>

  <!-- mug -->
  <div class="obj-track track1">
    <svg class="obj" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M40 28 c 11 0 11 18 0 18" stroke="#ff5a5f" stroke-width="6" fill="none"/>
      <rect x="12" y="22" width="30" height="34" rx="4" fill="#ff5a5f"/>
      <ellipse cx="27" cy="23" rx="15" ry="3.5" fill="#000" opacity=".3"/>
    </svg>
  </div>

  <!-- book -->
  <div class="obj-track track2">
    <svg class="obj" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="6" y="42" width="52" height="12" rx="2" fill="#f3ead6"/>
      <rect x="6" y="26" width="52" height="17" rx="2" fill="#ffd166"/>
      <rect x="6" y="26" width="11" height="17" rx="2" fill="#e3a93c"/>
      <rect x="24" y="32" width="26" height="5" rx="2.5" fill="#000" opacity=".18"/>
    </svg>
  </div>

  <!-- controller -->
  <div class="obj-track track3">
    <svg class="obj" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="16" cy="46" r="12" fill="#b388ff"/>
      <circle cx="48" cy="46" r="12" fill="#b388ff"/>
      <rect x="12" y="26" width="40" height="20" rx="10" fill="#b388ff"/>
      <rect x="17" y="31" width="3" height="9" rx="1.5" fill="#fff" opacity=".85"/>
      <rect x="14" y="34" width="9" height="3" rx="1.5" fill="#fff" opacity=".85"/>
      <circle cx="44" cy="32" r="2.6" fill="#fff" opacity=".85"/>
      <circle cx="50" cy="38" r="2.6" fill="#fff" opacity=".85"/>
      <circle cx="29" cy="39" r="4" fill="#000" opacity=".25"/>
    </svg>
  </div>

  <!-- headphones -->
  <div class="obj-track track4">
    <svg class="obj" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M 12 46 A 20 20 0 0 1 52 46" stroke="#4da3ff" stroke-width="7" fill="none" stroke-linecap="round"/>
      <rect x="6" y="38" width="12" height="18" rx="5" fill="#4da3ff"/>
      <rect x="46" y="38" width="12" height="18" rx="5" fill="#4da3ff"/>
      <rect x="9" y="42" width="6" height="10" rx="3" fill="#000" opacity=".3"/>
      <rect x="49" y="42" width="6" height="10" rx="3" fill="#000" opacity=".3"/>
    </svg>
  </div>

  <!-- plant -->
  <div class="obj-track track5">
    <svg class="obj" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 44 L 24 47 M32 44 L 40 47 M32 44 L 32 40" stroke="#2f7a52" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="32" cy="26" r="10" fill="#5ad787"/>
      <circle cx="21" cy="33" r="7" fill="#5ad787"/>
      <circle cx="43" cy="33" r="7" fill="#5ad787"/>
      <circle cx="32" cy="17" r="6" fill="#5ad787"/>
      <rect x="18" y="45" width="28" height="5" rx="2" fill="#c96a4a"/>
      <path d="M20 50 L 44 50 L 41 62 L 23 62 Z" fill="#b3543d"/>
    </svg>
  </div>

  <!-- still-frame mug for reduced motion -->
  <div class="obj-static">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M40 28 c 11 0 11 18 0 18" stroke="#ff5a5f" stroke-width="6" fill="none"/>
      <rect x="12" y="22" width="30" height="34" rx="4" fill="#ff5a5f"/>
      <ellipse cx="27" cy="23" rx="15" ry="3.5" fill="#000" opacity=".3"/>
    </svg>
  </div>

  <!-- the chameleon -->
  <div class="cham-wrap">
    <svg viewBox="0 0 360 240" aria-hidden="true">
      <ellipse cx="205" cy="232" rx="95" ry="5" fill="#000" opacity=".5"/>

      <g class="tail">
        <path d="M122 150 C 98 146 76 160 70 182 C 64 205 76 224 96 225 C 112 226 122 214 120 199 C 118 187 108 180 97 183 C 89 185 85 193 90 200"
              fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/>
      </g>

      <path d="M238 184 C 244 198 240 212 247 226" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" opacity=".5"/>
      <path d="M166 186 C 171 200 165 212 172 226" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" opacity=".5"/>

      <g class="cham-body">
        <path fill="currentColor" d="M302 170 C 296 160 291 153 284 148 C 280 132 272 112 262 98 C 258 92 252 93 250 100 C 248 106 247 109 244 114 C 236 126 226 133 216 138 C 200 146 184 151 170 153 C 154 155 138 154 128 148 C 122 145 118 142 118 138 C 118 152 124 168 138 178 C 152 188 175 194 200 194 C 222 194 240 191 252 186 C 266 181 276 176 284 173 C 290 171 297 170 302 170 Z"/>
        <polygon points="228,135 221,120 215,133" fill="currentColor"/>
        <polygon points="205,145 198,130 192,143" fill="currentColor"/>
        <polygon points="184,151 177,137 171,149" fill="currentColor"/>
        <ellipse cx="200" cy="186" rx="52" ry="11" fill="#fff" opacity=".07"/>
        <path d="M298 168 Q 286 173 274 171" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" opacity=".35"/>
        <circle cx="293" cy="164" r="2" fill="#000" opacity=".3"/>
        <circle cx="274" cy="136" r="14" fill="currentColor"/>
        <circle cx="274" cy="136" r="9" fill="#000" opacity=".85"/>
        <g class="pupil-wrap">
          <circle cx="274" cy="132" r="4" fill="currentColor"/>
        </g>
        <circle cx="279" cy="130" r="2.5" fill="#fff" opacity=".3"/>
      </g>

      <path class="leg-front" d="M252 182 C 255 196 250 210 257 224 L 263 227" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
      <path class="leg-back" d="M150 184 C 146 198 154 210 148 224 L 154 227" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- corner stamp: glowing seal -->
  <div class="stamp">
    <svg viewBox="0 0 150 150" aria-label="You Do This Too">
      <defs>
        <path id="sealArc" d="M 15,75 a 60,60 0 1,1 120,0 a 60,60 0 1,1 -120,0"/>
      </defs>
      <circle class="seal-ring" cx="75" cy="75" r="72" fill="none" stroke-width="2.5"/>
      <circle class="seal-ring" cx="75" cy="75" r="58" fill="none" stroke-width="1.2" opacity=".55"/>
      <circle class="seal-dot" cx="9" cy="75" r="2"/>
      <circle class="seal-dot" cx="141" cy="75" r="2"/>
      <text class="seal-text">
        <textPath href="#sealArc" startOffset="25%" text-anchor="middle">YOU DO THIS TOO</textPath>
      </text>
    </svg>
  </div>

</div>
</body>
</html>
