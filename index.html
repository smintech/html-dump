<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADAPTABILITY — The Truth, Part 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; }
  body { font-family:'Outfit', system-ui, sans-serif; }

  .stage { position:fixed; inset:0; }

  /* ---- the wall ---- */
  .wall {
    position:absolute; inset:0;
    background: linear-gradient(#0b0d11, #05060a 70%);
  }

  /* ---- phase light: teal -> rust -> blue -> settle ---- */
  .glow {
    position:absolute; left:50%; top:56%;
    width:130vmin; height:130vmin;
    transform:translate(-50%,-50%);
    background: radial-gradient(closest-side, currentColor, transparent 72%);
    color:#2dd4bf;
    z-index:1;
    animation: glowPulse 5s ease-in-out infinite, truthColor 24s linear infinite;
  }
  @keyframes glowPulse { 0%,100% { opacity:.10 } 50% { opacity:.18 } }
  @keyframes truthColor {
    0%, 21%  { color:#2dd4bf }
    27%, 46% { color:#e0813a }
    52%, 71% { color:#58a6ff }
    77%, 97% { color:#f2ede4 }
    100%     { color:#2dd4bf }
  }

  /* ---- title watermark ---- */
  .title-block { position:absolute; top:6.5%; left:0; right:0; text-align:center; z-index:5; }
  .name {
    font-size: clamp(52px, 17vmin, 250px);
    font-weight:800; line-height:.95; letter-spacing:.04em;
    color:#2dd4bf;
    text-shadow: 0 0 18px currentColor, 0 0 60px currentColor;
    white-space:nowrap;
    animation: truthColor 24s linear infinite;
  }
  .theme-label {
    display:inline-block; margin-top:1.6vmin;
    font-size: clamp(10px, 2.2vmin, 24px); font-weight:600;
    letter-spacing:.5em; padding-left:.5em;
    color:#f5ead2;
    text-shadow: 0 0 14px rgba(232,193,90,.5);
  }

  /* ---- floor ---- */
  .floor {
    position:absolute; left:0; right:0; bottom:0; height:20%;
    background: linear-gradient(#14181d, #05070a 75%);
    border-top: 1px solid rgba(140,155,175,.12);
    z-index:1.5;
  }

  /* ================= THE WINDOW ================= */
  .window {
    position:absolute; left:6%; top:27%;
    width: clamp(84px, 23vmin, 210px);
    height: clamp(100px, 26vmin, 240px);
    background:#0a0f18;
    border: 1.4vmin solid #6b7480;
    overflow:hidden; z-index:2;
    box-shadow: 0 1vmin 3vmin rgba(0,0,0,.7);
  }
  .window::before, .window::after {
    content:''; position:absolute; background:#6b7480; z-index:10;
  }
  .window::before { left:50%; top:0; bottom:0; width:1.4vmin; margin-left:-0.7vmin; }
  .window::after  { top:50%; left:0; right:0; height:1.4vmin; margin-top:-0.7vmin; }

  .view { position:absolute; inset:0; }
  .view svg { position:absolute; inset:0; width:100%; height:100%; }

  .viewDay    { animation: viewDayK 24s linear infinite; }
  .viewAutumn { animation: viewAutumnK 24s linear infinite; }
  .viewWinter { animation: viewWinterK 24s linear infinite; }
  .viewCity   { animation: viewCityK 24s linear infinite; }
  .viewBeach  { animation: viewBeachK 24s linear infinite; }

  @keyframes viewDayK    { 0%,32% {opacity:1} 34%,66% {opacity:0} 68%,100% {opacity:1} }
  @keyframes viewAutumnK { 0%,32% {opacity:0} 34%,40% {opacity:1} 42%,100% {opacity:0} }
  @keyframes viewWinterK { 0%,40% {opacity:0} 42%,48% {opacity:1} 50%,100% {opacity:0} }
  @keyframes viewCityK   { 0%,49% {opacity:0} 51%,57% {opacity:1} 59%,100% {opacity:0} }
  @keyframes viewBeachK  { 0%,57% {opacity:0} 59%,65% {opacity:1} 67%,100% {opacity:0} }

  /* snow: only while winter is up (Derek phase) */
  .snow { position:absolute; inset:0; z-index:9; opacity:0; animation: snowK 24s linear infinite; }
  @keyframes snowK { 0%,41% {opacity:0} 43%,48% {opacity:1} 50%,100% {opacity:0} }
  .snowdot {
    position:absolute; width:4px; height:4px; border-radius:50%;
    background:#eef4fa; opacity:.85;
    animation: snowFall linear infinite;
  }
  .s1 { left:15%; animation-duration:3s;   animation-delay:0s }
  .s2 { left:38%; animation-duration:2.4s; animation-delay:1s }
  .s3 { left:60%; animation-duration:3.4s; animation-delay:.5s }
  .s4 { left:78%; animation-duration:2.8s; animation-delay:1.6s }
  .s5 { left:50%; animation-duration:2.2s; animation-delay:2s }
  @keyframes snowFall { from { transform: translateY(-12%) } to { transform: translateY(120%) } }

  /* ================= THE PICTURE FRAME ================= */
  .frame {
    position:absolute; right:7%; top:29%;
    width: clamp(60px, 13vmin, 120px);
    height: clamp(76px, 16vmin, 148px);
    background:#1a1f27;
    border: 1vmin solid #3d4450;
    box-shadow: 0 1vmin 2.5vmin rgba(0,0,0,.7);
    z-index:2;
  }
  .art { position:absolute; inset:9%; }
  .art svg { position:absolute; inset:0; width:100%; height:100%; }
  .artA { animation: artAK 24s linear infinite; }
  .artB { animation: artBK 24s linear infinite; }
  .artC { animation: artCK 24s linear infinite; }
  @keyframes artAK { 0%,49% {opacity:1} 51%,66% {opacity:0} 68%,100% {opacity:1} }
  @keyframes artBK { 0%,49% {opacity:0} 51%,57% {opacity:1} 59%,100% {opacity:0} }
  @keyframes artCK { 0%,57% {opacity:0} 59%,66% {opacity:1} 68%,100% {opacity:0} }

  /* ================= THE PLANT ================= */
  .plant {
    position:absolute; left:9%; bottom:9%;
    width: clamp(64px, 16vmin, 150px);
    z-index:3;
  }
  .plant svg { position:absolute; bottom:0; left:0; width:100%; height:auto; }
  .plantA { animation: artAK 24s linear infinite; }
  .plantB { animation: artBK 24s linear infinite; }
  .plantC { animation: artCK 24s linear infinite; }

  /* ================= THE THERMOSTAT ================= */
  .thermo {
    position:absolute; left:50%; top:46%;
    transform:translateX(-50%);
    width: clamp(150px, 38vmin, 350px);
    z-index:4;
    filter: drop-shadow(0 2vmin 4vmin rgba(0,0,0,.6));
  }
  .thermo svg { display:block; width:100%; }

  .needle-wrap {
    transform-box:view-box; transform-origin:0px 0px;
    transform: rotate(18deg);
    animation: needleSpin 24s ease-in-out infinite;
  }
  .marker-wrap {
    transform-box:view-box; transform-origin:0px 0px;
    transform: rotate(18deg);
    animation: markerSlide 24s ease-in-out infinite;
  }

  /* Chloe: the set point is everywhere. Derek: it strains in place. Raya/settle: it rests. */
  @keyframes needleSpin {
    0%      { transform: rotate(18deg) }
    3%      { transform: rotate(60deg) }
    5%      { transform: rotate(-30deg) }
    7%      { transform: rotate(75deg) }
    9%      { transform: rotate(-45deg) }
    11%     { transform: rotate(55deg) }
    13%     { transform: rotate(-20deg) }
    15%     { transform: rotate(40deg) }
    17%     { transform: rotate(-5deg) }
    19%     { transform: rotate(65deg) }
    21%     { transform: rotate(-35deg) }
    23%     { transform: rotate(25deg) }
    25%     { transform: rotate(18deg) }
    27%     { transform: rotate(16.5deg) }
    29%     { transform: rotate(19.5deg) }
    31%     { transform: rotate(16.8deg) }
    33%     { transform: rotate(19.2deg) }
    35%     { transform: rotate(16.6deg) }
    37%     { transform: rotate(19.4deg) }
    39%     { transform: rotate(16.8deg) }
    41%     { transform: rotate(19.2deg) }
    43%     { transform: rotate(17deg) }
    45%     { transform: rotate(19deg) }
    47%     { transform: rotate(17.5deg) }
    49%     { transform: rotate(18.5deg) }
    50%,100%{ transform: rotate(18deg) }
  }
  @keyframes markerSlide {
    0%   { transform: rotate(18deg) }
    4%   { transform: rotate(45deg) }
    7%   { transform: rotate(-10deg) }
    10%  { transform: rotate(60deg) }
    13%  { transform: rotate(-25deg) }
    16%  { transform: rotate(35deg) }
    19%  { transform: rotate(0deg) }
    22%  { transform: rotate(50deg) }
    25%,100% { transform: rotate(18deg) }
  }

  /* the readout: what the thermostat thinks it's holding */
  .readout { animation: truthColor 24s linear infinite; }
  .readout text { fill: currentColor; }

  .n72a   { animation: n72aK 24s linear infinite; }
  .n68    { animation: n68K 24s linear infinite; }
  .n75    { animation: n75K 24s linear infinite; }
  .n63    { animation: n63K 24s linear infinite; }
  .n79    { animation: n79K 24s linear infinite; }
  .nqq    { animation: nqqK 24s linear infinite; }
  .n72hold{ animation: holdK 24s linear infinite; }
  .n72c   { animation: n72cK 24s linear infinite; }
  .holdbadge { animation: holdK 24s linear infinite; }

  @keyframes n72aK  { 0%,3%  {opacity:1} 5%,100%   {opacity:0} }
  @keyframes n68K   { 0%,4%  {opacity:0} 5%,8%     {opacity:1} 10%,100% {opacity:0} }
  @keyframes n75K   { 0%,9%  {opacity:0} 10%,13%   {opacity:1} 15%,100% {opacity:0} }
  @keyframes n63K   { 0%,14% {opacity:0} 15%,18%   {opacity:1} 20%,100% {opacity:0} }
  @keyframes n79K   { 0%,19% {opacity:0} 20%,22%   {opacity:1} 24%,100% {opacity:0} }
  @keyframes nqqK   { 0%,22% {opacity:0} 23%,24.5% {opacity:1} 26%,100% {opacity:0} }
  @keyframes holdK  { 0%,24.5% {opacity:0} 26%,48.5% {opacity:1} 51%,100% {opacity:0} }
  @keyframes n72cK  { 0%,49% {opacity:0} 51%,100%  {opacity:1} }

  /* cobweb: grows on the thermostat during the frozen phase */
  .cobweb {
    position:absolute; top:-4%; left:-5%;
    width:42%; z-index:5; opacity:0;
    animation: cobwebK 24s linear infinite;
  }
  .cobweb svg { display:block; width:100%; }
  @keyframes cobwebK { 0%,27% {opacity:0} 30%,47% {opacity:1} 51%,100% {opacity:0} }

  /* dust motes: drifting while the thing is frozen */
  .dust { position:absolute; inset:0; z-index:5; opacity:0; animation: dustK 24s linear infinite; pointer-events:none; }
  @keyframes dustK { 0%,26% {opacity:0} 29%,47% {opacity:1} 50%,100% {opacity:0} }
  .mote {
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:#cfd6de;
    animation: moteFloat ease-in-out infinite alternate;
  }
  .m1 { left:calc(50% - 24vmin); top:50%; animation-duration:6s; }
  .m2 { left:calc(50% + 20vmin); top:44%; animation-duration:7s; animation-delay:1s; }
  .m3 { left:calc(50% - 12vmin); top:64%; animation-duration:5s;  animation-delay:2s; }
  .m4 { left:calc(50% + 14vmin); top:60%; animation-duration:6.5s; animation-delay:.5s; }
  .m5 { left:calc(50% - 28vmin); top:58%; animation-duration:8s;  animation-delay:3s; }
  @keyframes moteFloat {
    0%   { transform: translate(0,0); opacity:.15 }
    50%  { opacity:.55 }
    100% { transform: translate(7px,-11px); opacity:.15 }
  }

  /* ---- vignette ---- */
  .vignette {
    position:absolute; inset:0; z-index:6; pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }

  /* ---- corner stamp: glowing gold seal ---- */
  .stamp {
    position:absolute; right:2.4vmin; bottom:2vmin;
    width: clamp(72px, 15vmin, 150px);
    z-index:7; opacity:.95;
  }
  .stamp svg {
    display:block; width:100%; height:auto;
    filter: drop-shadow(0 0 8px rgba(232,193,90,.6));
    animation: stampPulse 3s ease-in-out infinite;
  }
  .seal-ring { stroke:#e8c15a; }
  .seal-text {
    font-family:'Outfit', system-ui, sans-serif;
    font-weight:800; font-size:13px; letter-spacing:2px;
    fill:#ffe9b0;
  }
  .seal-dot { fill:#e8c15a; }
  @keyframes stampPulse {
    0%,100% { filter: drop-shadow(0 0 6px rgba(232,193,90,.5)); }
    50%     { filter: drop-shadow(0 0 15px rgba(232,193,90,.95)); }
  }

  /* ---- reduced motion: still frame — room A, holding 72 ---- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .readout text { opacity:0 }
    .n72c { opacity:1 }
    .snow, .dust, .cobweb { opacity:0 }
  }
</style>
</head>
<body>
<div class="stage">

  <div class="wall"></div>
  <div class="glow"></div>

  <div class="title-block">
    <div class="name">THE TRUTH</div>
    <div class="theme-label">ONE MACHINE, THREE SETTINGS</div>
  </div>

  <div class="floor"></div>

  <!-- ============ THE WINDOW: what's happening outside ============ -->
  <div class="window">

    <div class="view viewDay">
      <svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

        <ellipse cx="72" cy="44" rx="13" ry="6" fill="#fff" opacity=".6"/>

        <circle cx="97" cy="72" r="14" fill="#4c8c50"/>

    </div>

    <div class="view viewAutumn">
      <svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

        <circle cx="150" cy="44" r="14" fill="#e8b06a"/>

        <rect x="92" y="96" width="10" height="50" fill="#5c3f28"/>
        <circle cx="97" cy="86" r="24" fill="#c96a2f"/>
        <circle cx="82" cy="96" r="16" fill="#b5541f"/>
        <circle cx="112" cy="96" r="15" fill="#d1803a"/>
        <circle cx="97" cy="72" r="14" fill="#b5541f"/>
        <circle cx="60" cy="120" r="3" fill="#c96a2f"/>
        <circle cx="130" cy="128" r="2.5" fill="#b5541f"/>
        <circle cx="74" cy="132" r="2" fill="#d1803a"/>
      </svg>
    </div>

      <svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="200" height="200" fill="#aebfcf"/>

        <ellipse cx="140" cy="60" rx="17" ry="7" fill="#c8d5e0" opacity=".6"/>
        <path d="M0 138 Q 50 124 100 136 T 200 134 L 200 200 L 0 200 Z" fill="#e8eef4"/>
        <rect x="94" y="86" width="9" height="56" fill="#4a3b2c"/>
        <path d="M98 100 L 82 84 M98 112 L 114 92 M98 92 L 98 74" stroke="#4a3b2c" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="view viewCity">
      <svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="200" height="200" fill="#0d1b30"/>
        <circle cx="160" cy="38" r="12" fill="#e8e2c8"/>
        <rect y="150" width="200" height="50" fill="#080e1a"/>
        <g fill="#0a1322">
          <rect x="6"  y="70"  width="30" height="80"/>
          <rect x="42" y="46"  width="26" height="104"/>
          <rect x="74" y="84"  width="34" height="66"/>
          <rect x="114" y="38" width="28" height="112"/>
          <rect x="148" y="78" width="32" height="72"/>

        </g>
        <g fill="#ffd88a">
          <rect x="48" y="54" width="4" height="4"/><rect x="58" y="54" width="4" height="4"/>
          <rect x="48" y="66" width="4" height="4"/><rect x="58" y="78" width="4" height="4"/>
          <rect x="118" y="46" width="4" height="4"/><rect x="128" y="46" width="4" height="4"/>
          <rect x="118" y="62" width="4" height="4"/><rect x="134" y="74" width="4" height="4"/>
          <rect x="12" y="80" width="4" height="4"/><rect x="24" y="92" width="4" height="4"/>
          <rect x="154" y="88" width="4" height="4"/><rect x="166" y="100" width="4" height="4"/>
        </g>
        <g fill="#58a6ff">
          <rect x="52" y="90" width="4" height="4"/><rect x="122" y="90" width="4" height="4"/>
          <rect x="80" y="94" width="4" height="4"/><rect x="156" y="112" width="4" height="4"/>

      </svg>

    <div class="view viewBeach">
      <svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="200" height="200" fill="#f7c98d"/>
        <circle cx="52" cy="44" r="15" fill="#ffdf9e"/>

              fill="none" stroke="#22331f" stroke-width="5" stroke-linecap="round"/>
      </svg>

    <div class="snow">
      <div class="snowdot s1"></div>
      <div class="snowdot s2"></div>
      <div class="snowdot s3"></div>
      <div class="snowdot s4"></div>
      <div class="snowdot s5"></div>
    </div>
  </div>

  <!-- ============ THE FRAME: what's on the wall ============ -->
  <div class="frame">
    <div class="art artA">
      <svg viewBox="0 0 100 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="100" height="120" fill="#9fc3e8"/>

      <svg viewBox="0 0 100 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="100" height="120" fill="#101826"/>

          <rect x="30" y="24" width="18" height="96"/>

        </g>

          <rect x="34" y="32" width="3" height="3"/><rect x="40" y="44" width="3" height="3"/>
          <rect x="34" y="58" width="3" height="3"/><rect x="56" y="60" width="3" height="3"/>
          <rect x="64" y="74" width="3" height="3"/><rect x="82" y="42" width="3" height="3"/>
        </g>
      </svg>
    </div>
    <div class="art artC">
      <svg viewBox="0 0 100 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="100" height="46" fill="#f2d9b0"/>
        <circle cx="30" cy="26" r="9" fill="#ff9e6a"/>
        <rect y="46" width="100" height="34" fill="#3f7fae"/>
        <path d="M0 52 Q 25 46 50 52 T 100 52" fill="none" stroke="#7fb2d9" stroke-width="2.5"/>
        <rect y="80" width="100" height="40" fill="#e0c48c"/>
        <circle cx="74" cy="94" r="4" fill="#c9a15e"/>
        <circle cx="26" cy="102" r="3" fill="#c9a15e"/>
      </svg>
    </div>
  </div>

  <!-- ============ THE PLANT: what lives in the room ============ -->
  <div class="plant">
    <svg class="plant plantA" viewBox="0 0 100 140" aria-hidden="true">
      <path d="M50 84 L 38 88 M50 84 L 62 88" stroke="#2f5d45" stroke-width="4" stroke-linecap="round"/>
      <circle cx="50" cy="52" r="20" fill="#3f7a44"/>
      <circle cx="32" cy="64" r="14" fill="#4c8c50"/>
      <circle cx="68" cy="64" r="14" fill="#4c8c50"/>
      <circle cx="50" cy="34" r="12" fill="#4c8c50"/>
      <circle cx="36" cy="46" r="9" fill="#57995b"/>
      <path d="M32 88 L 68 88 L 62 130 L 38 130 Z" fill="#b3543d"/>
      <rect x="28" y="82" width="44" height="10" rx="3" fill="#c96a4a"/>
    </svg>
    <svg class="plant plantB" viewBox="0 0 100 140" aria-hidden="true">
      <rect x="44" y="44" width="16" height="46" rx="8" fill="#4c8c50"/>
      <path d="M44 62 Q 30 62 30 76 Q 30 86 40 84 L 46 80" fill="none" stroke="#4c8c50" stroke-width="10" stroke-linecap="round"/>
      <path d="M60 54 Q 74 54 74 66 Q 74 74 66 72 L 60 68" fill="none" stroke="#4c8c50" stroke-width="9" stroke-linecap="round"/>
      <circle cx="52" cy="42" r="4" fill="#e86a8a"/>
      <path d="M34 90 L 66 90 L 61 128 L 39 128 Z" fill="#7d8a99"/>
      <rect x="30" y="84" width="40" height="10" rx="3" fill="#8e9aa8"/>
    </svg>
    <svg class="plant plantC" viewBox="0 0 100 140" aria-hidden="true">
      <path d="M38 90 C 34 60 36 40 42 24 C 46 42 46 66 44 90 Z" fill="#2f5d45"/>
      <path d="M52 90 C 50 56 54 34 62 18 C 64 40 60 68 58 90 Z" fill="#35684e"/>
      <path d="M28 90 C 26 68 30 54 36 44 C 38 62 36 78 34 90 Z" fill="#27503c"/>
      <path d="M64 90 C 64 70 68 58 74 50 C 74 66 72 80 70 90 Z" fill="#3c7355"/>
      <path d="M30 92 L 70 92 L 64 128 L 36 128 Z" fill="#c9c2b4"/>
      <rect x="26" y="86" width="48" height="10" rx="3" fill="#d8d2c4"/>
    </svg>
  </div>

  <!-- ============ THE THERMOSTAT: the one machine ============ -->
  <div class="thermo">
    <svg viewBox="-140 -140 280 280" aria-hidden="true">
      <defs>
        <radialGradient id="face" cx=".5" cy=".35" r=".8">
          <stop offset="0" stop-color="#161c26"/>
          <stop offset="1" stop-color="#0b0f14"/>
        </radialGradient>
      </defs>

      <!-- plastic body -->
      <circle r="127" fill="#c9cdd4"/>
      <circle r="127" fill="none" stroke="#8f97a2" stroke-width="3"/>
      <circle r="117" fill="none" stroke="#a9b0ba" stroke-width="2"/>
      <circle r="108" fill="url(#face)"/>
      <circle r="108" fill="none" stroke="#232b36" stroke-width="2"/>
      <circle cx="0" cy="131" r="3.5" fill="#8f97a2"/>

      <!-- glass highlight -->
      <path d="M -78 -62 A 100 100 0 0 1 -20 -98" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".05"/>

      <!-- tick ring -->
      <circle r="95" fill="none" stroke="#4a5563" stroke-width="4" stroke-dasharray="3 22.62"/>

      <!-- numbers -->
      <g fill="#8fa2b8" font-family="Outfit, sans-serif" font-weight="600" font-size="14" text-anchor="middle">
        <text x="0" y="-68">70</text>
        <text x="-50" y="-49">65</text>
        <text x="-71" y="5">60</text>
        <text x="50" y="-49">75</text>
        <text x="71" y="5">80</text>
        <text x="34" y="64">85</text>
      </g>

      <!-- set marker: the "who I am" notch -->
      <g class="marker-wrap">
        <polygon points="-7,-101 0,-119 7,-101" fill="#e8c15a"/>
      </g>

      <!-- needle -->
      <g class="needle-wrap">
        <polygon points="-5,12 0,-88 5,12" fill="#f2ede4"/>
        <polygon points="-5,12 5,12 0,24" fill="#c9c2b4"/>
      </g>

      <!-- pivot cap -->
      <circle r="10" fill="#20242a" stroke="#454c56" stroke-width="2"/>

      <!-- the readout: what it's holding right now -->
      <rect x="-40" y="42" width="80" height="36" rx="6" fill="#050b10" stroke="#2c3642" stroke-width="2"/>
      <g class="readout" font-family="Outfit, sans-serif" font-weight="800" font-size="21" text-anchor="middle" letter-spacing="1">
        <text class="n72a"    x="0" y="67">72</text>
        <text class="n68"     x="0" y="67">68</text>
        <text class="n75"     x="0" y="67">75</text>
        <text class="n63"     x="0" y="67">63</text>
        <text class="n79"     x="0" y="67">79</text>
        <text class="nqq"     x="0" y="67">??</text>
        <text class="n72hold" x="0" y="67">72</text>
        <text class="n72c"    x="0" y="67">72</text>
      </g>

      <!-- HOLD: the number is locked -->
      <g class="holdbadge">
        <rect x="-23" y="84" width="46" height="16" rx="8" fill="none" stroke="#e8c15a" stroke-width="1.6"/>
        <text x="0" y="96" font-family="Outfit, sans-serif" font-weight="800" font-size="9" letter-spacing="3" text-anchor="middle" fill="#e8c15a">HOLD</text>
      </g>
    </svg>

    <!-- cobweb: grows while it's frozen -->
    <div class="cobweb">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <g stroke="#b9c2cc" stroke-width="1.4" opacity=".55" fill="none">
          <path d="M0 0 L 96 6"/><path d="M0 0 L 84 48"/><path d="M0 0 L 52 88"/><path d="M0 0 L 14 98"/>
        </g>
        <g stroke="#b9c2cc" stroke-width="1.1" opacity=".45" fill="none">
          <path d="M 36 3 Q 30 26 5 32"/>
          <path d="M 68 10 Q 58 48 10 58"/>
          <path d="M 88 32 Q 74 72 22 86"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="dust">
    <div class="mote m1"></div>
    <div class="mote m2"></div>
    <div class="mote m3"></div>
    <div class="mote m4"></div>
    <div class="mote m5"></div>
  </div>

  <div class="vignette"></div>

  <!-- corner stamp: glowing seal -->
  <div class="stamp">
    <svg viewBox="0 0 150 150" aria-label="You Do This Too">
      <defs>
        <path id="sealArc" d="M 15,75 a 60,60 0 1,1 120,0 a 60,60 0 1,1 -120,0"/>
      </defs>
      <circle class="seal-ring" cx="75" cy="75" r="72" fill="none" stroke-width="2.5"/>
      <circle class="seal-ring" cx="75" cy="75" r="58" fill="none" stroke-width="1.2" opacity=".55"/>
      <circle class="seal-dot" cx="9" cy="75" r="2"/>
      <circle class="seal-dot" cx="141" cy="75" r="2"/>
      <text class="seal-text">
        <textPath href="#sealArc" startOffset="25%" text-anchor="middle">YOU DO THIS TOO</textPath>
      </text>
    </svg>
  </div>

</div>
</body>
</html>
