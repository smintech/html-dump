<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAYA — The Mover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; }
  body { font-family:'Outfit', system-ui, sans-serif; }

  .stage { position:fixed; inset:0; }

  /* ---- stage glow: sky blue ---- */
  .glow {
    position:absolute; left:50%; top:58%;
    width:130vmin; height:130vmin;
    transform:translate(-50%,-50%);
    background: radial-gradient(closest-side, currentColor, transparent 72%);
    color:#58a6ff;
    z-index:0;
    animation: glowPulse 5s ease-in-out infinite;
  }
  @keyframes glowPulse { 0%,100% { opacity:.10 } 50% { opacity:.18 } }

  /* ---- faint terminal windows in the dark ---- */
  .win { position:absolute; background:#58a6ff; border-radius:1vmin; opacity:.05; z-index:.5; }
  .w1 { top:17%; left:7%;  width:9vmin;  height:15vmin; }
  .w2 { top:13%; right:9%; width:11vmin; height:19vmin; }
  .w3 { top:24%; left:24%; width:7vmin;  height:11vmin; opacity:.04; }
  .w2f { animation: flick 8s steps(1) infinite; }
  @keyframes flick { 0%,91% { opacity:.05 } 92% { opacity:.13 } 95% { opacity:.03 } 97% { opacity:.11 } 100% { opacity:.05 } }

  /* ---- title watermark ---- */
  .title-block { position:absolute; top:9%; left:0; right:0; text-align:center; z-index:5; }
  .name {
    font-size: clamp(64px, 23vmin, 340px);
    font-weight:800; line-height:.95; letter-spacing:.03em;
    color:#58a6ff;
    text-shadow: 0 0 18px rgba(88,166,255,.55), 0 0 60px rgba(88,166,255,.28);
    white-space:nowrap;
  }
  .theme-label {
    display:inline-block; margin-top:1.6vmin;
    font-size: clamp(10px, 2.4vmin, 26px); font-weight:600;
    letter-spacing:.6em; padding-left:.6em;
    color:#dcecff;
    text-shadow: 0 0 14px rgba(88,166,255,.5);
  }

  /* ---- parked luggage cart, background ---- */
  .cart { position:absolute; top:49%; left:4%; width:15vmin; z-index:1; opacity:.55; }
  .cart svg { display:block; width:100%; }

  /* ---- the belt surface (moving slats) ---- */
  .belt {
    position:absolute; top:59.2%; left:-2vw; width:104vw; height:4.5vmin;
    background: repeating-linear-gradient(90deg, #272c33 0 2vmin, #1d2126 2vmin 4vmin);
    border-top: 2px solid #3a414b;
    border-bottom: 2px solid #12151a;
    z-index:2;
    animation: treadScroll 1.4s linear infinite;
  }
  @keyframes treadScroll { from { background-position: 0 0 } to { background-position: 4vmin 0 } }

  /* ---- fixed metal rail with hazard stripe ---- */
  .rail {
    position:absolute; top:61.5%; left:-2vw; width:104vw; height:5.5vmin;
    background: linear-gradient(#49515c, #2b3138 60%, #1a1f25);
    border-radius:1vmin;
    box-shadow: 0 1vmin 2.5vmin rgba(0,0,0,.8);
    z-index:2.6;
  }
  .rail::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1.2vmin;
    background: repeating-linear-gradient(45deg, #e8b93c 0 1.2vmin, #15161a 1.2vmin 2.4vmin);
    border-radius: 1vmin 1vmin 0 0;
    opacity:.85;
  }

  /* ---- spinning rollers under the rail ---- */
  .roller {
    position:absolute; top:66.4%; width:2.6vmin; height:2.6vmin;
    border-radius:50%; background:#20242a; border:2px solid #454c56; z-index:2.7;
  }
  .roller::before {
    content:''; position:absolute; left:50%; top:12%; bottom:12%; width:2px; margin-left:-1px;
    background:#6b7684; border-radius:1px;
    animation: spinRoll .6s linear infinite;
  }
  @keyframes spinRoll { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
  .r1 { left:5% } .r2 { left:17% } .r3 { left:29% } .r4 { left:41% }
  .r5 { left:53% } .r6 { left:65% } .r7 { left:77% } .r8 { left:89% }

  /* ---- floor ---- */
  .floor {
    position:absolute; top:66.8%; left:0; right:0; bottom:0;
    background: linear-gradient(#14181d, #05070a 70%);
    z-index:1.6;
  }
  .floor::before {
    content:''; position:absolute; top:0; left:10%; right:10%; height:1px;
    background: rgba(88,166,255,.14);
  }

  /* ---- items on the belt: same loop, same speed, spaced out ---- */
  .track { position:absolute; left:0; z-index:3; will-change:transform; animation: beltMove 24s linear infinite; }
  .track svg { display:block; }
  @keyframes beltMove { from { transform: translateX(-28vw) } to { transform: translateX(118vw) } }

  .track-hero { top:50%; width:17vmin; animation-delay:-4s; }
  .track-hero svg { width:17vmin; }
  .track-b2    { top:51.5%; width:15vmin; animation-delay:-11s; }
  .track-b2 svg { width:15vmin; }
  .track-suit  { top:52.5%; width:15vmin; animation-delay:-17s; }
  .track-suit svg { width:15vmin; }
  .track-b3    { top:52.5%; width:13vmin; animation-delay:-21.5s; }
  .track-b3 svg { width:13vmin; }

  .jiggle { animation: jiggle .35s ease-in-out infinite alternate; }
  @keyframes jiggle { from { transform: translateY(0) } to { transform: translateY(.35vmin) } }

  /* ---- the cloud: rides with the hero box, every lap ---- */
  .cloud-track {
    position:absolute; left:0; top: calc(50% - 10vmin);
    margin-left:2vmin; width:13vmin; z-index:4;
    animation: beltMove 24s linear infinite; animation-delay:-4s;
    will-change:transform;
  }
  .cloud-bob { animation: cloudBob 3.2s ease-in-out infinite alternate; }
  @keyframes cloudBob { from { transform: translateY(-.8vmin) } to { transform: translateY(.8vmin) } }
  .cloud-track svg { display:block; width:13vmin; }

  .drop {
    position:absolute; width:.9vmin; height:1.6vmin;
    border-radius: 50% 50% 60% 60%;
    background:#8fc4f0; opacity:0;
    animation: dropFall 1.1s linear infinite;
  }
  .d1 { left:24%; top:80%; animation-delay:0s }
  .d2 { left:48%; top:84%; animation-delay:.37s }
  .d3 { left:68%; top:78%; animation-delay:.74s }
  @keyframes dropFall {
    0%   { opacity:0; transform: translateY(0) }
    15%  { opacity:.85 }
    80%  { opacity:.8 }
    100% { opacity:0; transform: translateY(9vmin) }
  }

  /* ---- the new sticker: slaps on mid-screen every lap ---- */
  .sticker-new { opacity:0; transform-box:fill-box; transform-origin:center; animation: stickerPop 24s linear infinite; }
  @keyframes stickerPop {
    0%, 33%   { opacity:0; transform: scale(.2) }
    36%       { opacity:1; transform: scale(1.35) }
    39%       { transform: scale(1) }
    100%      { opacity:1; transform: scale(1) }
  }

  /* ---- vignette ---- */
  .vignette {
    position:absolute; inset:0; z-index:5; pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }

  /* ---- corner stamp: glowing circular seal ---- */
  .stamp {
    position:absolute; right:2.4vmin; bottom:2vmin;
    width: clamp(72px, 15vmin, 150px);
    z-index:6; opacity:.95;
  }
  .stamp svg {
    display:block; width:100%; height:auto;
    filter: drop-shadow(0 0 8px rgba(88,166,255,.6));
    animation: stampPulse 3s ease-in-out infinite;
  }
  .seal-ring { stroke:#58a6ff; }
  .seal-text {
    font-family:'Outfit', system-ui, sans-serif;
    font-weight:800; font-size:13px; letter-spacing:2px;
    fill:#cfe4ff;
  }
  .seal-dot { fill:#58a6ff; }
  @keyframes stampPulse {
    0%,100% { filter: drop-shadow(0 0 6px rgba(88,166,255,.5)); }
    50%     { filter: drop-shadow(0 0 15px rgba(88,166,255,.95)); }
  }

  /* ---- reduced motion: one still frame ---- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .track-b2, .track-b3, .track-suit { display:none; }
    .track-hero { transform: translateX(42vw); }
    .cloud-track { transform: translateX(42vw); }
    .drop { opacity:.5; }
    .sticker-new { opacity:1; }
  }
</style>
</head>
<body>
<div class="stage">

  <div class="glow"></div>

  <div class="win w1"></div>
  <div class="win w2 w2f"></div>
  <div class="win w3"></div>

  <div class="title-block">
    <div class="name">RAYA</div>
    <div class="theme-label">THE MOVER</div>
  </div>

  <!-- parked cart in the background -->
  <div class="cart">
    <svg viewBox="0 0 120 160" aria-hidden="true">
      <rect x="10" y="30" width="8" height="110" rx="3" fill="#2c323b"/>
      <rect x="102" y="30" width="8" height="110" rx="3" fill="#2c323b"/>
      <rect x="6" y="138" width="108" height="8" rx="3" fill="#333a44"/>
      <circle cx="24" cy="150" r="7" fill="#20242a" stroke="#454c56" stroke-width="2"/>
      <circle cx="96" cy="150" r="7" fill="#20242a" stroke="#454c56" stroke-width="2"/>
      <rect x="18" y="96" width="84" height="42" rx="3" fill="#6e502f"/>
      <rect x="30" y="56" width="60" height="38" rx="3" fill="#7d5a36"/>
      <rect x="30" y="56" width="12" height="38" fill="#8f8258" opacity=".5"/>
    </svg>
  </div>

  <!-- the open box: five cities of stickers, cloud overhead, going in circles -->
  <div class="track track-hero">
    <div class="jiggle">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <ellipse cx="60" cy="110" rx="46" ry="6" fill="#000" opacity=".5"/>

        <!-- open interior -->
        <polygon points="22,58 98,58 92,72 28,72" fill="#4f3a20"/>
        <!-- side flaps pushed open -->
        <polygon points="22,58 8,26 34,22 32,58" fill="#a3764a"/>
        <polygon points="98,58 112,26 86,22 88,58" fill="#a3764a"/>
        <polygon points="22,58 8,26 34,22 32,58" fill="none" stroke="#7d5a36" stroke-width="2"/>
        <polygon points="98,58 112,26 86,22 88,58" fill="none" stroke="#7d5a36" stroke-width="2"/>
        <!-- front face -->
        <rect x="22" y="58" width="76" height="48" rx="2" fill="#b98a5a"/>
        <rect x="22" y="58" width="76" height="6" fill="#8a6437" opacity=".6"/>
        <path d="M22 106 L 98 106" stroke="#8a6437" stroke-width="2"/>

        <!-- five cities, already on the box -->
        <g>
          <circle cx="38" cy="84" r="6" fill="#d15a4a"/><circle cx="38" cy="84" r="2.2" fill="#fff" opacity=".85"/>
          <circle cx="52" cy="88" r="6" fill="#e3c14f"/><circle cx="52" cy="88" r="2.2" fill="#fff" opacity=".85"/>
          <circle cx="66" cy="84" r="6" fill="#5fae6e"/><circle cx="66" cy="84" r="2.2" fill="#fff" opacity=".85"/>
          <circle cx="80" cy="88" r="6" fill="#9a6fd0"/><circle cx="80" cy="88" r="2.2" fill="#fff" opacity=".85"/>
          <circle cx="92" cy="82" r="5" fill="#e0893f"/><circle cx="92" cy="82" r="1.8" fill="#fff" opacity=".85"/>
        </g>

        <!-- and the next one, slapped on every lap -->
        <g class="sticker-new">
          <circle cx="88" cy="66" r="6.5" fill="#ff5f9e"/>
          <circle cx="88" cy="66" r="6.5" fill="none" stroke="#fff" stroke-width="1.4" opacity=".9"/>
          <circle cx="88" cy="66" r="2.4" fill="#fff" opacity=".95"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- the cloud rides with it, every lap -->
  <div class="cloud-track">
    <div class="cloud-bob">
      <svg viewBox="0 0 100 62" aria-hidden="true">
        <ellipse cx="30" cy="40" rx="19" ry="15" fill="#5d6773"/>
        <ellipse cx="55" cy="30" rx="23" ry="18" fill="#66707c"/>
        <ellipse cx="78" cy="41" rx="16" ry="12" fill="#5d6773"/>
        <path d="M14 48 Q 55 58 93 47 L 93 44 Q 55 52 14 45 Z" fill="#4a535d"/>
        <path d="M40 20 Q 55 12 68 20" fill="none" stroke="#79848f" stroke-width="3" stroke-linecap="round" opacity=".7"/>
      </svg>
    </div>
    <div class="drop d1"></div>
    <div class="drop d2"></div>
    <div class="drop d3"></div>
  </div>

  <!-- closed box, tape never cut -->
  <div class="track track-b2">
    <div class="jiggle">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <ellipse cx="60" cy="110" rx="42" ry="6" fill="#000" opacity=".5"/>
        <rect x="24" y="52" width="72" height="54" rx="2" fill="#ad7f52"/>
        <rect x="24" y="52" width="72" height="7" fill="#84603a" opacity=".7"/>
        <rect x="52" y="52" width="16" height="54" fill="#d9c9a8"/>
        <rect x="52" y="52" width="16" height="54" fill="none" stroke="#bfae8c" stroke-width="1.5"/>
        <path d="M24 106 L 96 106" stroke="#84603a" stroke-width="2"/>
      </svg>
    </div>
  </div>

  <!-- suitcase: packed, wheeled, ready -->
  <div class="track track-suit">
    <div class="jiggle">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <ellipse cx="60" cy="110" rx="44" ry="6" fill="#000" opacity=".5"/>
        <rect x="46" y="34" width="28" height="10" rx="5" fill="none" stroke="#9a7a2c" stroke-width="5"/>
        <rect x="16" y="42" width="88" height="58" rx="8" fill="#c9a13c"/>
        <rect x="16" y="42" width="88" height="10" rx="5" fill="#a8842c"/>
        <rect x="34" y="42" width="9" height="58" fill="#8f6f22"/>
        <rect x="77" y="42" width="9" height="58" fill="#8f6f22"/>
        <circle cx="34" cy="104" r="6" fill="#20242a" stroke="#454c56" stroke-width="2"/>
        <circle cx="86" cy="104" r="6" fill="#20242a" stroke="#454c56" stroke-width="2"/>
      </svg>
    </div>
  </div>

  <!-- another closed box, smaller -->
  <div class="track track-b3">
    <div class="jiggle">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <ellipse cx="60" cy="110" rx="38" ry="5" fill="#000" opacity=".5"/>
        <rect x="32" y="58" width="56" height="48" rx="2" fill="#9c7247"/>
        <rect x="32" y="58" width="56" height="6" fill="#755331" opacity=".7"/>
        <rect x="32" y="76" width="56" height="10" fill="#cfd6de"/>
        <rect x="55" y="58" width="10" height="48" fill="#cfd6de"/>
        <path d="M32 106 L 88 106" stroke="#755331" stroke-width="2"/>
      </svg>
    </div>
  </div>

  <div class="belt"></div>
  <div class="rail"></div>

  <div class="roller r1"></div>
  <div class="roller r2"></div>
  <div class="roller r3"></div>
  <div class="roller r4"></div>
  <div class="roller r5"></div>
  <div class="roller r6"></div>
  <div class="roller r7"></div>
  <div class="roller r8"></div>

  <div class="floor"></div>

  <div class="vignette"></div>

  <!-- corner stamp: glowing seal -->
  <div class="stamp">
    <svg viewBox="0 0 150 150" aria-label="You Do This Too">
      <defs>
        <path id="sealArc" d="M 15,75 a 60,60 0 1,1 120,0 a 60,60 0 1,1 -120,0"/>
      </defs>
      <circle class="seal-ring" cx="75" cy="75" r="72" fill="none" stroke-width="2.5"/>
      <circle class="seal-ring" cx="75" cy="75" r="58" fill="none" stroke-width="1.2" opacity=".55"/>
      <circle class="seal-dot" cx="9" cy="75" r="2"/>
      <circle class="seal-dot" cx="141" cy="75" r="2"/>
      <text class="seal-text">
        <textPath href="#sealArc" startOffset="25%" text-anchor="middle">YOU DO THIS TOO</textPath>
      </text>
    </svg>
  </div>

</div>
</body>
</html>
