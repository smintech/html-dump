<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clara — The Checklist | Recalibrate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ice:#cfe4f7;
  --ice-bright:#f2f8ff;
  --ice-mid:#a9c6e2;
  --ice-deep:#43648a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#04070d;font-family:'Outfit',sans-serif}
.scene{position:absolute;inset:0;transform-origin:50% 55%;animation:sceneDrift 16s ease-in-out infinite}
@keyframes sceneDrift{0%,100%{transform:scale(1)}50%{transform:scale(1.014)}}

/* ============ ROOM ============ */
.wall{position:absolute;top:0;left:0;right:0;height:62%;z-index:0;
  background-color:#0b1220;
  background-image:
    radial-gradient(ellipse 70% 60% at 50% 26%, rgba(169,198,226,.14), transparent 75%),
    repeating-linear-gradient(90deg, rgba(169,198,226,.055) 0 1px, transparent 1px 7vmin);
  box-shadow:inset 0 -6vmin 10vmin rgba(0,0,0,.45)}
.floor{position:absolute;left:0;right:0;bottom:0;height:38%;z-index:0;
  background:
    radial-gradient(ellipse 65% 95% at 50% 16%, rgba(122,162,200,.18), transparent 72%),
    repeating-linear-gradient(to bottom, rgba(169,198,226,.06) 0 1px, transparent 1px 4.2vmin),
    linear-gradient(#101a2a,#060b14)}
.beam{position:absolute;left:2%;top:3%;width:15vmin;height:88vmin;z-index:1;
  transform-origin:10% 6%;pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(220,236,250,.15) 45%, rgba(220,236,250,.09) 60%, transparent);
  filter:blur(.6vmin);
  animation:beamSway 26s ease-in-out infinite}
@keyframes beamSway{0%,100%{transform:rotate(37deg)}50%{transform:rotate(41deg)}}
.glow{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 58% 48% at 50% 58%, rgba(122,162,200,.2), transparent 72%);
  animation:roomGlow 9s ease-in-out infinite}
@keyframes roomGlow{0%,100%{opacity:.75}50%{opacity:1}}

/* ============ NAME ============ */
.name{position:absolute;top:4.5%;left:50%;transform:translateX(-50%);z-index:2;
  font-weight:900;font-size:clamp(3rem,15vmin,10.5rem);letter-spacing:.08em;white-space:nowrap;
  color:#d8e9fa;
  animation:namePulse 6s ease-in-out infinite}
@keyframes namePulse{
  0%,100%{text-shadow:0 0 18px rgba(169,198,226,.95),0 0 60px rgba(122,162,200,.6),0 0 130px rgba(67,100,138,.4)}
  50%{text-shadow:0 0 28px rgba(220,236,250,1),0 0 90px rgba(169,198,226,.9),0 0 160px rgba(122,162,200,.55)}}

/* ============ WINDOW: snow falling, moon ============ */
.win{position:absolute;left:4%;top:10%;width:15vmin;height:18vmin;z-index:1;
  border:1vmin solid #2b3f57;border-radius:.8vmin;
  background:linear-gradient(#16263c,#24405c 55%,#3d6288);
  overflow:hidden;
  box-shadow:0 0 24px rgba(169,198,226,.4), inset 0 0 10vmin rgba(0,0,0,.45)}
.moon{position:absolute;left:2.4vmin;top:2vmin;width:3vmin;height:3vmin;border-radius:50%;
  background:radial-gradient(circle at 38% 32%, #ffffff, #e8f2fc 50%, #a9c6e2);
  box-shadow:0 0 16px rgba(242,248,255,.95),0 0 34px rgba(169,198,226,.6);
  animation:moonGlow 9s ease-in-out infinite}
@keyframes moonGlow{0%,100%{opacity:.75}50%{opacity:1}}
.star{position:absolute;width:.5vmin;height:.5vmin;border-radius:50%;background:#f2f8ff;
  box-shadow:0 0 5px rgba(242,248,255,.9);
  animation:twinkle 4s ease-in-out infinite}
.star.s1{left:8.5vmin;top:3vmin}
.star.s2{left:11vmin;top:6vmin;animation-delay:-2s}
.star.s3{left:6.5vmin;top:7.5vmin;animation-delay:-1s}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.hill{position:absolute;bottom:-1.5vmin;border-radius:50%;background:#0c1626}
.hill.h1{left:-3vmin;width:11vmin;height:5.5vmin}
.hill.h2{right:-4vmin;width:12vmin;height:6.5vmin;background:#0a1322}
.flk{position:absolute;opacity:.8;
  animation:flakeFall linear infinite}
.fd{width:.8vmin;height:.8vmin;border-radius:50%;background:#f2f8ff;
  box-shadow:0 0 6px rgba(242,248,255,.8);
  animation:flakeDrift 3s ease-in-out infinite alternate}
.flk.f1{left:2vmin;top:1vmin;animation-duration:9s}
.flk.f2{left:5vmin;top:5vmin;animation-duration:12s;animation-delay:-4s}
.flk.f3{left:8.5vmin;top:2.5vmin;animation-duration:10s;animation-delay:-7s}
.flk.f4{left:11.5vmin;top:6vmin;animation-duration:13s;animation-delay:-2s}
.flk.f5{left:4vmin;top:10vmin;animation-duration:11s;animation-delay:-9s}
.flk.f6{left:10vmin;top:12vmin;animation-duration:14s;animation-delay:-6s}
.flk.f6 .fd{width:.6vmin;height:.6vmin}
.flk.f1 .fd{width:1vmin;height:1vmin}
@keyframes flakeFall{
  0%{transform:translateY(0);opacity:.8}
  85%{opacity:.8}
  100%{transform:translateY(21vmin);opacity:0}}
@keyframes flakeDrift{from{transform:translateX(-1.3vmin)}to{transform:translateX(1.3vmin)}}
.wglow{position:absolute;inset:0;
  background:radial-gradient(circle at 50% 24%, rgba(220,236,250,.22), transparent 72%);
  animation:breath 8s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.6}50%{opacity:1}}
.wbarV{position:absolute;left:calc(50% - .4vmin);top:0;bottom:0;width:.8vmin;background:#2b3f57}
.wbarH{position:absolute;top:calc(50% - .4vmin);left:0;right:0;height:.8vmin;background:#2b3f57}
.floorlight{position:absolute;left:10%;bottom:24%;width:26vmin;height:9vmin;z-index:1;
  border-radius:50%;filter:blur(2.4vmin);
  background:radial-gradient(ellipse, rgba(220,236,250,.22), transparent 70%);
  animation:poolDrift 18s ease-in-out infinite}
@keyframes poolDrift{0%,100%{transform:translateX(-3vmin);opacity:.75}50%{transform:translateX(3vmin);opacity:1}}

/* ============ CLOCK (time moves — the list doesn't) ============ */
.clock{position:absolute;left:22.5%;top:13%;width:6.5vmin;height:6.5vmin;z-index:2;border-radius:50%;
  background:radial-gradient(circle at 38% 32%, #22344c, #101a28 65%);
  border:2px solid rgba(169,198,226,.55);
  box-shadow:0 0 14px rgba(122,162,200,.45)}
.cticks{position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(rgba(169,198,226,.65) 0 1.2deg, transparent 1.2deg 30deg);
  -webkit-mask:radial-gradient(circle, transparent 0 78%, #000 80% 96%, transparent 98%);
  mask:radial-gradient(circle, transparent 0 78%, #000 80% 96%, transparent 98%)}
.mh{position:absolute;left:calc(50% - .15vmin);bottom:50%;width:.3vmin;height:2.5vmin;border-radius:.15vmin;
  background:#f2f8ff;box-shadow:0 0 6px rgba(220,236,250,.9);
  transform-origin:center bottom;animation:handSpin 20s linear infinite}
.hh{position:absolute;left:calc(50% - .18vmin);bottom:50%;width:.36vmin;height:1.6vmin;border-radius:.18vmin;
  background:var(--ice-mid);box-shadow:0 0 6px rgba(169,198,226,.9);
  transform-origin:center bottom;animation:handSpin 100s linear infinite}
.cdot{position:absolute;left:50%;top:50%;width:1vmin;height:1vmin;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 35%, #f2f8ff, #43648a);box-shadow:0 0 6px rgba(220,236,250,.9)}
@keyframes handSpin{to{transform:rotate(360deg)}}

/* ============ THE LIST (hero) — frozen on the wall ============ */
.listzone{position:absolute;left:33%;top:14%;width:34vmin;height:30vmin;z-index:2}
.lframe{position:absolute;inset:0;border-radius:1vmin;
  background:linear-gradient(#1a2738,#101a28);
  border:2px solid rgba(169,198,226,.55);
  box-shadow:0 10px 22px rgba(0,0,0,.55), 0 0 26px rgba(122,162,200,.3), inset 0 0 12px rgba(0,0,0,.5);
  padding:1.6vmin}
.sheen{position:absolute;inset:0;border-radius:.6vmin;pointer-events:none;
  background:linear-gradient(115deg, rgba(242,248,255,.13) 0 18%, transparent 30% 70%, rgba(242,248,255,.08) 92%)}
.lhead{height:2.5vmin;border-radius:.5vmin;margin-bottom:1vmin;
  background:linear-gradient(90deg, rgba(169,198,226,.5), rgba(169,198,226,.15));
  box-shadow:0 0 8px rgba(169,198,226,.3)}
.lrow{display:flex;align-items:center;gap:.8vmin;height:2.7vmin;margin-bottom:.55vmin}
.lb{height:.55vmin;border-radius:.27vmin}
.lb.a{width:52%}
.lb.b{width:28%}
.lbox{margin-left:auto;width:2.3vmin;height:2.3vmin;border:2px solid;border-radius:.45vmin;position:relative;flex:none}
.check{position:absolute;left:24%;top:10%;width:1.3vmin;height:.66vmin;
  border-left:.42vmin solid;border-bottom:.42vmin solid;
  transform:rotate(-48deg)}
.lrow.done .lb{background:rgba(169,198,226,.16)}
.lrow.done .lbox{border-color:rgba(169,198,226,.3)}
.lrow.done .check{border-color:rgba(169,198,226,.3)}
.lrow.fresh .lb{background:rgba(169,198,226,.32)}
.lrow.fresh .lbox{border-color:rgba(220,236,250,.7)}
.lrow.fresh .check{border-color:#f2f8ff;animation:checkGlow 4s ease-in-out infinite}
@keyframes checkGlow{
  0%,100%{filter:drop-shadow(0 0 3px rgba(242,248,255,.4))}
  50%{filter:drop-shadow(0 0 10px rgba(242,248,255,1))}}
.lrow.open .lb{background:rgba(169,198,226,.28)}
.lrow.open .lbox{border-color:var(--ice-bright);animation:boxPulse 6s ease-in-out infinite}
.lrow.open.r7 .lbox{animation-delay:-3s}
@keyframes boxPulse{
  0%,100%{box-shadow:0 0 5px rgba(242,248,255,.35)}
  50%{box-shadow:0 0 16px rgba(242,248,255,.95)}}
/* frost on the frame */
.fr{position:absolute;border-radius:50%;filter:blur(1vmin);pointer-events:none;
  background:radial-gradient(circle, rgba(242,248,255,.3), transparent 70%)}
.fr.f1{left:-1.4vmin;top:-1.4vmin;width:7vmin;height:5vmin}
.fr.f2{right:-1.6vmin;top:30%;width:5.5vmin;height:8vmin}
.fr.f3{left:22%;bottom:-2vmin;width:9vmin;height:4.5vmin}
.gl{position:absolute;width:.7vmin;height:.7vmin;border-radius:50%;background:#fff;
  box-shadow:0 0 8px #fff,0 0 16px rgba(220,236,250,.9);
  animation:glint 3.2s ease-in-out infinite}
.gl.g1{left:1vmin;top:1vmin}
.gl.g2{right:2vmin;top:5vmin;animation-delay:-1.2s}
.gl.g3{left:38%;bottom:1vmin;animation-delay:-2s}
.gl.g4{right:31%;top:34%;animation-delay:-.6s}
@keyframes glint{0%,100%{opacity:.2}50%{opacity:1}}
/* icicles under the frame */
.ic{position:absolute;top:100%;background:linear-gradient(rgba(242,248,255,.5), rgba(242,248,255,.03));
  clip-path:polygon(50% 100%, 0 0, 100% 0);filter:blur(.15vmin)}
.ic.ic1{left:18%;width:1.5vmin;height:2.8vmin}
.ic.ic2{left:47%;width:2.2vmin;height:4.3vmin}
.ic.ic3{left:71%;width:1.3vmin;height:2.4vmin}
/* pencil on a string, swaying — used once, eight years ago */
.pencilwrap{position:absolute;right:-2.8vmin;top:34%;width:2vmin;
  transform-origin:top center;animation:pSway 5s ease-in-out infinite}
@keyframes pSway{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg)}}
.string{width:.18vmin;height:3.4vmin;margin:0 auto;background:rgba(169,198,226,.6)}
.pencil{width:1.1vmin;height:4.6vmin;margin:0 auto;border-radius:.2vmin;
  background:linear-gradient(90deg,#c9dcf0,#8fb0d0);position:relative}
.pencil::after{content:"";position:absolute;left:0;bottom:-1.3vmin;width:1.1vmin;height:1.4vmin;
  clip-path:polygon(50% 100%, 0 0, 100% 0);background:#eef4fb}

/* ============ CALENDAR — months never torn off ============ */
.calzone{position:absolute;right:4%;top:12%;width:13vmin;height:11vmin;z-index:1}
.cpg{position:absolute;left:0;width:12.5vmin;height:9vmin;border-radius:.5vmin;
  background:linear-gradient(#1c2a3c,#0f1726);
  border:2px solid rgba(169,198,226,.3);
  box-shadow:0 4px 8px rgba(0,0,0,.45)}
.cpg.p1{bottom:0}
.cpg.p2{bottom:.7vmin;transform:rotate(-1deg)}
.cpg.p3{bottom:1.4vmin;transform:rotate(1.2deg)}
.cpg.p4{bottom:2.1vmin;transform:rotate(-.8deg)}
.cpg.top{bottom:2.8vmin;transform:rotate(.6deg);
  background-image:
    linear-gradient(rgba(169,198,226,.14) 1px, transparent 1px),
    linear-gradient(90deg, rgba(169,198,226,.14) 1px, transparent 1px);
  background-size:2.2vmin 2.2vmin;
  border-color:rgba(169,198,226,.5)}
.cmark{position:absolute;left:3.4vmin;top:3.2vmin;width:1.4vmin;height:1.4vmin;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #f2f8ff, #7c9cc0);
  box-shadow:0 0 8px rgba(220,236,250,.7)}
.curl{position:absolute;right:0;bottom:0;width:3vmin;height:3vmin;
  clip-path:polygon(100% 0, 0 100%, 100% 100%);
  background:linear-gradient(135deg, rgba(242,248,255,.28), rgba(169,198,226,.08));
  transform-origin:top left;animation:curlFlut 4.5s ease-in-out infinite}
@keyframes curlFlut{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(13deg)}}

/* ============ SHELF: the living starter ============ */
.shelfzone{position:absolute;right:4%;top:25.5%;width:15vmin;z-index:1}
.sboard{position:relative;height:1.2vmin;border-radius:.4vmin;
  background:linear-gradient(#33465f,#1a2738);
  border:1.5px solid rgba(169,198,226,.4);
  box-shadow:0 4px 10px rgba(0,0,0,.5)}
.sbr{position:absolute;right:1.5vmin;top:1.1vmin;width:1.2vmin;height:2.2vmin;
  background:#22344c;border-radius:.2vmin}
.jar{position:absolute;bottom:1.1vmin;left:1vmin;width:4.6vmin;height:6.5vmin;border-radius:.8vmin .8vmin 1.2vmin 1.2vmin;
  background:linear-gradient(105deg, rgba(220,236,250,.16), rgba(220,236,250,.04) 45%, rgba(242,248,255,.14) 50%, rgba(220,236,250,.05));
  border:2px solid rgba(169,198,226,.5);
  box-shadow:0 0 14px rgba(122,162,200,.3), inset 0 0 8px rgba(0,0,0,.4);
  overflow:hidden}
.liq{position:absolute;left:0;right:0;bottom:0;height:62%;
  background:linear-gradient(to top, rgba(169,198,226,.4), rgba(169,198,226,.12))}
.bub{position:absolute;width:.55vmin;height:.55vmin;border-radius:50%;
  background:#f2f8ff;box-shadow:0 0 5px rgba(242,248,255,.9);opacity:.9;
  animation:bubUp 2.6s linear infinite}
.bub.b1{left:1vmin;bottom:.8vmin}
.bub.b2{left:2.4vmin;bottom:.5vmin;animation-delay:-1s}
.bub.b3{left:3.2vmin;bottom:1.4vmin;animation-delay:-1.9s}
@keyframes bubUp{
  0%{transform:translateY(0);opacity:.9}
  85%{opacity:.9}
  100%{transform:translateY(-3.8vmin);opacity:0}}
.cloth{position:absolute;left:.2vmin;top:-.4vmin;width:5.2vmin;height:1.8vmin;border-radius:.9vmin;
  background:linear-gradient(#dce8f5,#a9c6e2);
  box-shadow:0 2px 5px rgba(0,0,0,.4)}
.cloth::after{content:"";position:absolute;left:calc(50% - 1.2vmin);top:1.5vmin;width:2.4vmin;height:.3vmin;
  border-radius:.15vmin;background:rgba(122,162,200,.7)}
.fjar{position:absolute;bottom:1.1vmin;left:8vmin;width:4.2vmin;height:6vmin;border-radius:.7vmin .7vmin 1vmin 1vmin;
  background:linear-gradient(160deg,#dfe9f2,#b9cfe4);
  border:2px solid rgba(169,198,226,.5);
  box-shadow:0 0 12px rgba(122,162,200,.25), inset 0 0 8px rgba(0,0,0,.2)}
.fjar::after{content:"";position:absolute;left:.5vmin;right:.5vmin;top:-.9vmin;height:1.4vmin;border-radius:.5vmin;
  background:linear-gradient(#33465f,#1a2738);border:1.5px solid rgba(169,198,226,.4)}

/* ============ COUNTER + OVEN ============ */
.clarazone{position:absolute;left:28%;top:35%;width:30vmin;height:51vmin;z-index:3}
.fig{position:absolute;inset:0;width:100%;height:100%;
  filter:drop-shadow(0 0 9px rgba(122,162,200,.45))}
.breathe{transform-box:fill-box;transform-origin:50% 100%;
  animation:breatheT 4.6s ease-in-out infinite}
@keyframes breatheT{0%,100%{transform:translateY(0)}50%{transform:translateY(1.2)}}
.fig .body{fill:#070d16;stroke:rgba(207,228,247,.36);stroke-width:1.3}
.fig .limb{fill:none;stroke:#070d16;stroke-width:9.5;stroke-linecap:round}
.fig .apron{fill:#0e1a2a;stroke:rgba(207,228,247,.2);stroke-width:1}
.fig .dough{fill:#e4edf7;stroke:rgba(242,248,255,.7);stroke-width:1}
.fig .fl{fill:rgba(255,255,255,.85)}
.headg{transform-box:fill-box;transform-origin:50% 95%;
  animation:headNod 11s ease-in-out infinite}
@keyframes headNod{
  0%,30%{transform:rotate(7deg)}
  42%,58%{transform:rotate(-4deg)}
  70%,100%{transform:rotate(7deg)}}
.arms{transform-box:fill-box;transform-origin:50% 5%;
  animation:knead 2s ease-in-out infinite}
@keyframes knead{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(4) rotate(1deg)}}
.doughg{transform-box:fill-box;transform-origin:50% 100%;
  animation:doughSquish 2s ease-in-out infinite}
@keyframes doughSquish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.88)}}

.cface{position:absolute;left:12%;top:63.8%;width:56vmin;height:13vmin;z-index:4;border-radius:1vmin;
  background:linear-gradient(#22344c,#131f30);
  border:2px solid rgba(169,198,226,.4);
  box-shadow:0 12px 24px rgba(0,0,0,.6), inset 0 0 12px rgba(0,0,0,.4)}
.oven{position:absolute;left:1.2vmin;top:2.2vmin;width:17vmin;height:10.4vmin;border-radius:.8vmin;
  background:linear-gradient(#1c2a3c,#101a28);
  border:2px solid rgba(169,198,226,.4)}
.ohandle{position:absolute;left:2vmin;right:2vmin;top:.9vmin;height:.8vmin;border-radius:.4vmin;
  background:linear-gradient(#33465f,#1a2738);border:1px solid rgba(169,198,226,.35)}
.oglass{position:absolute;left:1.4vmin;top:2.8vmin;right:1.4vmin;bottom:1.2vmin;border-radius:.6vmin;
  background:radial-gradient(circle at 50% 62%, rgba(242,248,255,.5), rgba(169,198,226,.16) 60%, rgba(20,30,44,.35));
  border:2px solid rgba(169,198,226,.5);
  box-shadow:0 0 18px rgba(207,228,247,.35), inset 0 0 10px rgba(0,0,0,.4);
  animation:ovenBreathe 6s ease-in-out infinite}
@keyframes ovenBreathe{0%,100%{opacity:.7}50%{opacity:1}}
.bd{position:absolute;bottom:.6vmin;width:4.5vmin;height:2.6vmin;
  border-radius:2.2vmin 2.2vmin .6vmin .6vmin;background:#0d1624}
.bd.b1{left:2vmin}
.bd.b2{right:2.2vmin}
.dline{position:absolute;right:3vmin;left:21vmin;top:4vmin;height:2px;background:rgba(169,198,226,.25)}
.dline.d2{top:9vmin}
.okn{position:absolute;width:2.2vmin;height:2.2vmin;border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #33465f, #1a2738 70%);
  border:2px solid rgba(169,198,226,.5)}
.okn.o1{right:3vmin;top:2.6vmin}
.okn.o2{right:6.4vmin;top:2.6vmin}
.slab{position:absolute;left:12%;top:61%;width:56vmin;height:3vmin;z-index:4;border-radius:.7vmin;
  background:linear-gradient(#44586f,#243548 70%,#182637);
  border:2px solid rgba(169,198,226,.55);
  box-shadow:0 10px 22px rgba(0,0,0,.6), 0 0 22px rgba(122,162,200,.3), inset 0 .5vmin 1vmin rgba(220,236,250,.3)}

/* phone, face-down, dark — the only dead object in the room */
.ph{position:absolute;left:13.5%;top:59.4%;width:8vmin;height:4.4vmin;z-index:5;border-radius:.9vmin;
  transform:rotate(-5deg);
  background:linear-gradient(160deg,#18222e,#0c131c);
  border:2px solid rgba(169,198,226,.3);
  box-shadow:0 4px 10px rgba(0,0,0,.5)}
.ph::after{content:"";position:absolute;left:1vmin;top:1.1vmin;width:1vmin;height:1vmin;border-radius:50%;
  background:#0a1017;border:1px solid rgba(169,198,226,.25)}

/* the loaves — one straight, one lopsided, the one she likes most */
.rack{position:absolute;left:51%;top:57.7%;width:13vmin;height:5.2vmin;z-index:5}
.rleg{position:absolute;top:2.4vmin;width:.7vmin;height:2.8vmin;border-radius:.3vmin;
  background:linear-gradient(#33465f,#1a2738)}
.rleg.l{left:.8vmin}
.rleg.r{right:.8vmin}
.rrail{position:absolute;left:0;right:0;top:2.4vmin;height:.5vmin;border-radius:.25vmin;
  background:linear-gradient(#44586f,#243548)}
.rrail.r2{top:3.4vmin;height:.3vmin;background:#33465f}
.loaf1{position:absolute;left:.3vmin;top:-1.3vmin;width:7.6vmin;height:3.4vmin;border-radius:1.7vmin 1.7vmin 1.2vmin 1.2vmin;
  background:
    repeating-linear-gradient(78deg, transparent 0 1.5vmin, rgba(122,162,200,.25) 1.5vmin 1.9vmin),
    linear-gradient(#e8f1fa,#b9cfe4);
  border:1.5px solid rgba(169,198,226,.5);
  box-shadow:0 3px 8px rgba(0,0,0,.5), 0 0 12px rgba(122,162,200,.2)}
.loaf2{position:absolute;right:.1vmin;top:-1.5vmin;width:8.2vmin;height:3.6vmin;border-radius:1.8vmin 1.8vmin 1.3vmin 1.3vmin;
  transform:rotate(-5deg);
  background:repeating-linear-gradient(105deg, #e2edf7 0 1.4vmin, #c3d8ea 1.4vmin 2.8vmin);
  border:1.5px solid rgba(169,198,226,.55);
  box-shadow:0 3px 9px rgba(0,0,0,.5), 0 0 16px rgba(169,198,226,.35)}

/* ============ HER ============ */

/* ============ STEAM & DUST ============ */
.steam{position:absolute;z-index:5;pointer-events:none;filter:blur(1.4vmin);
  border-radius:50%;opacity:0;
  animation:steamUp linear infinite}
.ls1{left:52%;bottom:42%;width:5vmin;height:8vmin;
  background:radial-gradient(ellipse, rgba(220,236,250,.13), transparent 70%);
  animation-duration:20s}
.ls2{left:55.5%;bottom:43%;width:4vmin;height:7vmin;
  background:radial-gradient(ellipse, rgba(220,236,250,.11), transparent 70%);
  animation-duration:26s;animation-delay:-11s}
.ls3{left:58.5%;bottom:42%;width:4.5vmin;height:7vmin;
  background:radial-gradient(ellipse, rgba(220,236,250,.12), transparent 70%);
  animation-duration:23s;animation-delay:-18s}
@keyframes steamUp{
  0%{transform:translateY(0) translateX(0)}
  25%{opacity:.8}
  100%{transform:translateY(-22vmin) translateX(4vmin);opacity:0}}
.dust{position:absolute;inset:0;z-index:6;pointer-events:none}
.p{position:absolute;border-radius:50%;background:var(--ice-mid);
  box-shadow:0 0 9px rgba(169,198,226,.95);opacity:.55;
  animation:floatUp linear infinite}
.p1{left:9%;bottom:14%;width:4px;height:4px;animation-duration:19s;animation-delay:-3s}
.p2{left:22%;bottom:6%;width:6px;height:6px;animation-duration:23s;animation-delay:-11s}
.p3{left:35%;bottom:20%;width:4px;height:4px;animation-duration:16s;animation-delay:-7s}
.p4{left:47%;bottom:8%;width:5px;height:5px;animation-duration:21s;animation-delay:-15s}
.p5{left:58%;bottom:26%;width:4px;height:4px;animation-duration:18s;animation-delay:-2s}
.p6{left:66%;bottom:12%;width:6px;height:6px;animation-duration:24s;animation-delay:-9s}
.p7{left:78%;bottom:18%;width:4px;height:4px;animation-duration:17s;animation-delay:-13s}
.p8{left:88%;bottom:8%;width:5px;height:5px;animation-duration:22s;animation-delay:-5s}
.p9{left:15%;bottom:32%;width:4px;height:4px;animation-duration:20s;animation-delay:-17s}
.p10{left:28%;bottom:40%;width:5px;height:5px;animation-duration:21s;animation-delay:-8s}
.p11{left:62%;bottom:44%;width:4px;height:4px;animation-duration:18s;animation-delay:-14s}
.p12{left:84%;bottom:36%;width:5px;height:5px;animation-duration:23s;animation-delay:-6s}
@keyframes floatUp{
  0%{transform:translateY(0);opacity:0}
  12%{opacity:.6}
  85%{opacity:.5}
  100%{transform:translateY(-88vh);opacity:0}}
.vignette{position:absolute;inset:0;z-index:7;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 64%, rgba(0,0,0,.38))}

/* ============ SEAL ============ */
.seal{position:absolute;right:2.6vmin;bottom:2.6vmin;z-index:10;
  width:15vmin;height:15vmin;opacity:.95;
  animation:sealPulse 4s ease-in-out infinite}
.seal .ringA{fill:none;stroke:var(--ice-mid);stroke-width:2.5}
.seal .ringB{fill:none;stroke:rgba(169,198,226,.8);stroke-width:1.5}
.seal .txt{fill:#f2f8ff;font-family:'Outfit',sans-serif;font-weight:800;
  font-size:10.5px;letter-spacing:2px}
.seal .dot{fill:var(--ice-mid)}
.seal .core{fill:#f2f8ff}
@keyframes sealPulse{
  0%,100%{filter:drop-shadow(0 0 6px rgba(169,198,226,.7))}
  50%{filter:drop-shadow(0 0 16px rgba(169,198,226,1))}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important}
  .steam{display:none}
  .flk{opacity:.7}
  .bub{opacity:.9}
  .oglass{opacity:.85}
  .gl{opacity:.8}
  .p{opacity:.5}
}
</style>
</head>
<body>
