<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toby — The Slow Boil | Recalibrate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#f87171;
  --red-bright:#fecaca;
  --red-mid:#fca5a5;
  --red-deep:#7f1d1d;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#050308;font-family:'Outfit',sans-serif}
.scene{position:absolute;inset:0;transform-origin:50% 55%;animation:sceneDrift 16s ease-in-out infinite}
@keyframes sceneDrift{0%,100%{transform:scale(1)}50%{transform:scale(1.014)}}

/* ============ ROOM ============ */
.wall{position:absolute;top:0;left:0;right:0;height:52%;z-index:0;
  background-color:#1a0b10;
  background-image:
    radial-gradient(ellipse 70% 60% at 40% 30%, rgba(248,113,113,.16), transparent 75%),
    repeating-linear-gradient(90deg, rgba(252,165,165,.06) 0 1px, transparent 1px 7vmin);
  box-shadow:inset 0 -6vmin 10vmin rgba(0,0,0,.45)}
.floor{position:absolute;left:0;right:0;bottom:0;height:48%;z-index:0;
  background:
    radial-gradient(ellipse 70% 90% at 45% 12%, rgba(239,68,68,.2), transparent 72%),
    repeating-linear-gradient(to bottom, rgba(252,165,165,.07) 0 1px, transparent 1px 4.2vmin),
    linear-gradient(#2a1216,#120608)}
.baseboard{position:absolute;left:0;right:0;top:calc(52% - 2vmin);height:2vmin;z-index:0;
  background:linear-gradient(#2e141d,#1a090f);box-shadow:0 1vmin 2vmin rgba(0,0,0,.5)}

/* ============ NAME ============ */
.name{position:absolute;top:4.5%;left:50%;transform:translateX(-50%);z-index:2;
  font-weight:900;font-size:clamp(3rem,15vmin,10.5rem);letter-spacing:.08em;white-space:nowrap;
  color:var(--red-mid);
  animation:namePulse 6s ease-in-out infinite}
@keyframes namePulse{
  0%,100%{text-shadow:0 0 18px rgba(248,113,113,.95),0 0 60px rgba(239,68,68,.6),0 0 130px rgba(185,28,28,.4)}
  50%{text-shadow:0 0 28px rgba(252,165,165,1),0 0 90px rgba(239,68,68,.85),0 0 160px rgba(185,28,28,.5)}}

/* ============ WINDOW: heavy rain, city, lightning ============ */
.win{position:absolute;left:4%;top:10%;width:15vmin;height:18vmin;z-index:1;
  border:1vmin solid #3b2028;border-radius:.8vmin;
  background:linear-gradient(#4a1219,#26080e 55%,#5c2731);
  overflow:hidden;
  box-shadow:0 0 24px rgba(248,113,113,.4), inset 0 0 10vmin rgba(0,0,0,.5)}
.moon{position:absolute;left:2.5vmin;top:2.2vmin;width:3vmin;height:3vmin;border-radius:50%;
  background:radial-gradient(circle at 38% 32%, #ffe9e9, #fca5a5 55%, #b4434f);
  box-shadow:0 0 14px rgba(252,165,165,.85),0 0 30px rgba(248,113,113,.5);
  animation:moonGlow 9s ease-in-out infinite}
@keyframes moonGlow{0%,100%{opacity:.75}50%{opacity:1}}
.city{position:absolute;left:0;right:0;bottom:0;height:7.5vmin}
.bld{position:absolute;bottom:0;background:#170409;border-radius:.2vmin .2vmin 0 0}
.bld.a{left:2%;width:26%;height:100%}
.bld.b{left:33%;width:17%;height:64%}
.bld.c{left:54%;width:26%;height:100%}
.bld.d{left:85%;width:13%;height:52%}
.lw{position:absolute;width:.65vmin;height:.65vmin;background:#fecaca;border-radius:.1vmin;
  box-shadow:0 0 5px rgba(254,202,202,.9);
  animation:twinkle 4s ease-in-out infinite}
.lw.w1{left:20%;top:25%}
.lw.w2{left:55%;top:55%;animation-delay:-2s}
.lw.w3{left:12%;top:62%;animation-delay:-1s}
.bld.c .lw{left:30%;top:30%;animation-delay:-3s}
.bld.c .lw2{left:60%;top:58%;animation-delay:-1.5s}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.rain{position:absolute;inset:0;
  background:repeating-linear-gradient(to bottom, transparent 0 7px, rgba(254,202,202,.26) 7px 9px, transparent 9px 22px);
  animation:rainFall .7s linear infinite}
@keyframes rainFall{to{background-position:0 22px}}
.wglow{position:absolute;inset:0;
  background:radial-gradient(circle at 50% 24%, rgba(252,165,165,.25), transparent 72%);
  animation:breath 8s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.6}50%{opacity:1}}
.lflash{position:absolute;inset:0;opacity:0;
  background:radial-gradient(circle at 50% 30%, rgba(255,244,244,.9), rgba(254,202,202,.35) 60%, transparent 82%);
  animation:lflash 9s linear infinite}
@keyframes lflash{
  0%,88%{opacity:0}90%{opacity:.95}92%{opacity:.15}94%{opacity:.8}96%,100%{opacity:0}}
.wbarV{position:absolute;left:calc(50% - .4vmin);top:0;bottom:0;width:.8vmin;background:#3b2028}
.wbarH{position:absolute;top:calc(50% - .4vmin);left:0;right:0;height:.8vmin;background:#3b2028}

/* ============ SMOKE ALARM (fast blink) ============ */
.alarm{position:absolute;left:20%;top:7.5%;width:4.5vmin;height:4.5vmin;z-index:1;border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #3a1a22, #1a090f 70%);
  border:2px solid rgba(252,165,165,.45);
  box-shadow:0 0 10px rgba(248,113,113,.35)}
.led{position:absolute;left:calc(50% - .5vmin);top:calc(50% - .5vmin);width:1vmin;height:1vmin;border-radius:50%;
  background:#fecaca;box-shadow:0 0 8px rgba(254,202,202,1);
  animation:ledBlink .8s ease-in-out infinite}
@keyframes ledBlink{0%,100%{opacity:.15}50%{opacity:1}}

/* ============ RANGE HOOD: strobing light + moths ============ */
.hoodzone{position:absolute;left:22%;top:15%;width:24vmin;z-index:1}
.chimney{position:absolute;left:calc(50% - 2.5vmin);top:0;width:5vmin;height:6vmin;
  background:linear-gradient(#3a1a22,#241018)}
.hbody{position:absolute;left:0;top:5vmin;width:24vmin;height:5vmin;
  clip-path:polygon(0 100%, 100% 100%, 78% 0, 22% 0);
  background:linear-gradient(#42222e,#241018);
  box-shadow:inset 0 -1vmin 2vmin rgba(0,0,0,.5)}
.klight{position:absolute;left:calc(50% - 6vmin);top:9.4vmin;width:12vmin;height:1.1vmin;border-radius:.55vmin;
  background:linear-gradient(90deg, transparent, #fecaca 25%, #fff 50%, #fecaca 75%, transparent);
  box-shadow:0 0 16px rgba(254,202,202,1),0 0 40px rgba(248,113,113,.6);
  animation:klightFlick 3.1s linear infinite}
@keyframes klightFlick{
  0%{opacity:1}4%{opacity:.3}8%{opacity:1}14%{opacity:.45}19%{opacity:.95}
  27%{opacity:.35}33%{opacity:1}41%{opacity:.5}47%{opacity:1}55%{opacity:.3}
  62%{opacity:.9}70%{opacity:.5}78%{opacity:1}86%{opacity:.4}93%{opacity:1}100%{opacity:1}}
.mw{position:absolute;left:34%;top:20.3%;width:0;height:0;z-index:3}
.mw.a{animation:mothOrbit 5s linear infinite}
.mw.b{animation:mothOrbit 7.5s linear infinite reverse}
@keyframes mothOrbit{to{transform:rotate(360deg)}}
.moth{position:absolute;left:5vmin;top:-.5vmin;width:1.3vmin;height:.8vmin;border-radius:50%;
  background:#1a090f;border:1px solid rgba(252,165,165,.55);
  box-shadow:0 0 6px rgba(248,113,113,.5);
  animation:mothFlut .12s linear infinite alternate}
.mw.b .moth{left:7.5vmin;top:1vmin}
@keyframes mothFlut{from{transform:scaleX(.5)}to{transform:scaleX(1.25)}}

/* ============ KITCHEN ============ */
.backsplash{position:absolute;left:20%;top:21%;width:32vmin;height:11%;z-index:1;
  background-color:#1c0a10;
  background-image:
    linear-gradient(rgba(252,165,165,.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(252,165,165,.09) 1px, transparent 1px);
  background-size:3vmin 3vmin}
.counter{position:absolute;left:4%;top:32%;width:48vmin;height:5vmin;z-index:1;border-radius:.6vmin;
  background:linear-gradient(#4a232f,#2a121c 70%,#1e0c14);
  border:2px solid rgba(252,165,165,.5);
  box-shadow:0 8px 16px rgba(0,0,0,.55), 0 0 24px rgba(239,68,68,.3), inset 0 .5vmin 1vmin rgba(254,202,202,.3)}
.cabinet{position:absolute;left:4%;top:34.5%;width:48vmin;height:17.5vmin;z-index:1;
  background:linear-gradient(#2e141d,#1a090f);
  border:2px solid rgba(252,165,165,.3);
  box-shadow:inset 0 0 12vmin rgba(0,0,0,.4)}
.doorAjar{position:absolute;left:4vmin;top:1.5vmin;width:7vmin;height:9vmin;border-radius:.5vmin;
  transform:rotate(-16deg);transform-origin:left center;
  background:linear-gradient(#26121c,#160a10);
  border:2px solid rgba(252,165,165,.35);
  box-shadow:2px 2px 8px rgba(0,0,0,.6)}
.note{position:absolute;width:2.8vmin;height:2.8vmin;border-radius:.25vmin;
  background:linear-gradient(160deg,#fca5a5,#e07a7a);
  box-shadow:0 2px 4px rgba(0,0,0,.5)}
.note.n1{left:41vmin;top:2vmin;transform:rotate(-8deg)}
.note.n2{left:44.5vmin;top:3.5vmin;transform:rotate(6deg)}
.note.n3{left:42.5vmin;top:6.5vmin;transform:rotate(-4deg);background:linear-gradient(160deg,#8a5a5a,#6b3a3a)}
.note::after{content:"";position:absolute;left:14%;right:14%;top:20%;height:.3vmin;
  border-radius:.15vmin;background:rgba(20,8,12,.45);box-shadow:0 .5vmin 0 rgba(20,8,12,.35)}
.knobs{position:absolute;left:22vmin;top:1vmin;width:100%;height:4vmin}
.knob{position:absolute;top:.4vmin;width:3.2vmin;height:3.2vmin;border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #4a2330, #22090f 70%);
  border:2px solid rgba(252,165,165,.6);
  box-shadow:0 0 10px rgba(248,113,113,.4)}
.knob::before{content:"";position:absolute;left:calc(50% - .9vmin);top:calc(50% - .9vmin);
  width:1.8vmin;height:1.8vmin;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #fecaca, #b4434f)}
.knob::after{content:"";position:absolute;left:calc(50% - .15vmin);top:.15vmin;
  width:.3vmin;height:1.1vmin;border-radius:.15vmin;
  background:#fecaca;box-shadow:0 0 5px rgba(254,202,202,.9)}
.kn1{left:0;transform:rotate(40deg)}
.kn2{left:8vmin;transform:rotate(-15deg)}
.kn3{left:16vmin;transform:rotate(70deg)}
.kn4{left:24vmin;animation:turn 40s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}

/* wobbling dish tower */
.dishes{position:absolute;left:6%;top:27.2%;width:14vmin;height:8vmin;z-index:1;
  transform-origin:50% 100%;animation:dishWobble 2.8s ease-in-out infinite}
@keyframes dishWobble{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.dish{position:absolute;width:13vmin;height:1.55vmin;border-radius:.8vmin;
  background:linear-gradient(#4a232f,#2a1219);
  border:1.5px solid rgba(252,165,165,.4);
  box-shadow:0 2px 4px rgba(0,0,0,.5)}
.dish.d1{bottom:0}
.dish.d2{bottom:1.65vmin}
.dish.d3{bottom:3.3vmin}
.dish.d4{bottom:4.95vmin}
.dish.d5{bottom:6.6vmin;left:1.2vmin;transform:rotate(3deg)}

/* pizza stack, top box overhanging */
.pzs{position:absolute;left:43.5%;top:27.6%;width:9vmin;z-index:1;
  transform-origin:50% 100%;animation:pzSway 5s ease-in-out infinite}
@keyframes pzSway{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.7deg)}}
.pz{position:relative;width:9vmin;height:2.4vmin;border-radius:.5vmin;margin-bottom:.15vmin;
  background:linear-gradient(#3a222c,#241218);
  border:1.5px solid rgba(252,165,165,.35);
  box-shadow:0 3px 7px rgba(0,0,0,.5)}
.pz::after{content:"";position:absolute;left:calc(50% - 1.6vmin);top:calc(50% - .25vmin);
  width:3.2vmin;height:.5vmin;border-radius:.25vmin;background:rgba(252,165,165,.25)}
.pz:nth-child(4){transform:rotate(2.4deg);left:.8vmin}

/* ============ THE POT — boiled over, behind him ============ */
.potzone{position:absolute;left:24%;top:24.5%;width:19vmin;height:17vmin;z-index:2}
.burnglow{position:absolute;left:2%;right:2%;bottom:-3.4vmin;height:2.6vmin;border-radius:50%;
  background:radial-gradient(ellipse, rgba(255,120,80,.55), transparent 70%);
  filter:blur(.6vmin);
  animation:burnPulse 2s ease-in-out infinite}
@keyframes burnPulse{0%,100%{opacity:.6}50%{opacity:1}}
.flame{position:absolute;left:12%;right:12%;bottom:-3vmin;height:3.6vmin;
  border-radius:50% 50% 0 0 / 70% 70% 0 0;
  background:linear-gradient(to top, rgba(255,110,70,.95), rgba(255,170,140,.3));
  filter:blur(.35vmin);
  transform-origin:bottom center;
  animation:flameFlick .28s ease-in-out infinite alternate}
.flame.f2{left:30%;right:34%;height:4.4vmin;bottom:-3.4vmin;
  animation-duration:.22s}
@keyframes flameFlick{
  from{transform:scaleY(.82) scaleX(1.08);opacity:.8}
  to{transform:scaleY(1.18) scaleX(.92);opacity:1}}
.potbody{position:absolute;bottom:0;left:0;right:0;height:11.5vmin;
  border-radius:1.2vmin 1.2vmin 1.8vmin 1.8vmin;
  background:linear-gradient(150deg,#4a222c,#210a10 70%);
  border:2px solid rgba(252,165,165,.55);
  box-shadow:inset 0 1vmin 2vmin rgba(0,0,0,.5), 0 0 26px rgba(239,68,68,.45)}
.phandle{position:absolute;bottom:7.5vmin;width:3vmin;height:1.2vmin;border-radius:.6vmin;
  background:#3a1a22;border:1.5px solid rgba(252,165,165,.45)}
.phandle.l{left:-2.4vmin}
.phandle.r{right:-2.4vmin}
.rimglow{position:absolute;bottom:10.8vmin;left:3%;right:3%;height:.7vmin;border-radius:.35vmin;
  background:linear-gradient(90deg, transparent, #fecaca 30%, #fff 50%, #fecaca 70%, transparent);
  box-shadow:0 0 12px rgba(254,202,202,.9);
  animation:rimGlow 1.2s ease-in-out infinite}
@keyframes rimGlow{0%,100%{opacity:.55}50%{opacity:1}}
.lid{position:absolute;top:.3vmin;left:4%;right:4%;height:3.6vmin;
  border-radius:1.8vmin 1.8vmin .8vmin .8vmin;
  background:linear-gradient(#552835,#26090f);
  border:2px solid rgba(252,165,165,.6);
  box-shadow:0 0 16px rgba(248,113,113,.45);
  animation:lidRattle .14s linear infinite alternate}
@keyframes lidRattle{
  from{transform:translateY(-.5vmin) rotate(1.1deg)}
  to{transform:translateY(.15vmin) rotate(-1.2deg)}}
.lidknob{position:absolute;left:calc(50% - 1vmin);top:-1.4vmin;width:2vmin;height:1.6vmin;border-radius:.8vmin .8vmin .2vmin .2vmin;
  background:linear-gradient(#5c2c3a,#2a0c14);border:1.5px solid rgba(252,165,165,.55)}
/* boil-over foam */
.foam{position:absolute;background:radial-gradient(circle at 40% 35%, #ffd9cf, #e8947e 70%);
  border-radius:60% 40% 55% 45%;
  box-shadow:0 0 9px rgba(255,180,150,.65);
  animation:foamPulse .9s ease-in-out infinite}
.foam.f1{right:-1.4vmin;top:2.2vmin;width:3.8vmin;height:2.7vmin}
.foam.f2{right:-1vmin;top:5.6vmin;width:2.7vmin;height:2.1vmin;animation-delay:-.4s}
@keyframes foamPulse{0%,100%{transform:scale(.82)}50%{transform:scale(1.12)}}
/* spill running off the counter */
.spill{position:absolute;left:41.3%;top:32%;width:1.7vmin;height:3vmin;z-index:2;
  border-radius:0 0 .9vmin .9vmin;
  background:linear-gradient(rgba(255,180,150,.75), rgba(255,180,150,.12));
  box-shadow:0 0 6px rgba(255,180,150,.4)}
.drip{position:absolute;left:42.9%;top:34.6%;width:.8vmin;height:1.5vmin;border-radius:50%;
  background:#ffb4a6;box-shadow:0 0 7px rgba(255,180,150,.8);opacity:0;
  animation:dripFall 1.7s linear infinite;z-index:2}
.drip.d2{animation-delay:-.6s}
.drip.d3{animation-delay:-1.1s}
@keyframes dripFall{
  0%{transform:translateY(0);opacity:0}
  10%{opacity:1}
  85%{transform:translateY(6vmin);opacity:1}
  100%{transform:translateY(6vmin);opacity:0}}
.spark{position:absolute;left:41.6%;top:31.2%;width:.55vmin;height:.55vmin;border-radius:50%;
  background:#ffd9c4;box-shadow:0 0 7px rgba(255,190,150,1);opacity:0;
  animation:sparkPop .7s linear infinite;z-index:2}
.spark.s2{left:40.4%;animation-delay:-.35s}
@keyframes sparkPop{
  0%{transform:translateY(0);opacity:0}
  25%{opacity:1}
  100%{transform:translateY(-2vmin);opacity:0}}
.emb{position:absolute;width:.7vmin;height:.7vmin;border-radius:50%;
  background:#ffc9a8;box-shadow:0 0 9px rgba(255,170,120,1);opacity:0;
  animation:emberUp 3.4s linear infinite;z-index:2}
.emb.e1{left:29%;top:27%}
.emb.e2{left:33%;top:26%;animation-delay:-1.2s}
.emb.e3{left:37%;top:27.5%;animation-delay:-2.1s}
.emb.e4{left:41%;top:26.5%;animation-delay:-2.8s}
@keyframes emberUp{
  0%{transform:translateY(0) translateX(0);opacity:0}
  12%{opacity:.95}
  100%{transform:translateY(-25vmin) translateX(2vmin);opacity:0}}
/* steam, more of it, faster */
.steam{position:absolute;z-index:2;pointer-events:none;filter:blur(1.3vmin);
  border-radius:50%;opacity:0;
  animation:steamUp linear infinite}
.ps1{left:26%;bottom:73%;width:6vmin;height:9vmin;
  background:radial-gradient(ellipse, rgba(254,202,202,.16), transparent 70%);
  animation-duration:15s}
.ps2{left:31%;bottom:74%;width:5vmin;height:8vmin;
  background:radial-gradient(ellipse, rgba(254,202,202,.13), transparent 70%);
  animation-duration:18s;animation-delay:-7s}
.ps3{left:36%;bottom:72%;width:5.5vmin;height:8.5vmin;
  background:radial-gradient(ellipse, rgba(254,202,202,.14), transparent 70%);
  animation-duration:16s;animation-delay:-12s}
.ps4{left:40%;bottom:73%;width:4.5vmin;height:7vmin;
  background:radial-gradient(ellipse, rgba(254,202,202,.12), transparent 70%);
  animation-duration:20s;animation-delay:-4s}
.ps5{left:43%;bottom:74%;width:5vmin;height:7.5vmin;
  background:radial-gradient(ellipse, rgba(254,202,202,.11), transparent 70%);
  animation-duration:17s;animation-delay:-10s}
@keyframes steamUp{
  0%{transform:translateY(0) translateX(0)}
  25%{opacity:.85}
  100%{transform:translateY(-26vmin) translateX(6vmin);opacity:0}}

/* ============ SWINGING CROOKED FRAME ============ */
.crook{position:absolute;left:58%;top:14%;width:7vmin;height:5.2vmin;z-index:1;
  border-radius:.5vmin;
  transform-origin:50% -.6vmin;
  background:linear-gradient(150deg,#261522,#14090f);
  border:.6vmin solid #45307080;
  box-shadow:0 5px 10px rgba(0,0,0,.5), inset 0 0 8px rgba(0,0,0,.5);
  animation:frameSwing 3.4s ease-in-out infinite}
@keyframes frameSwing{0%,100%{transform:rotate(4.5deg)}50%{transform:rotate(-4.5deg)}}
.crook::before{content:"";position:absolute;left:calc(50% - .3vmin);top:-1.3vmin;
  width:.6vmin;height:.8vmin;border-radius:.3vmin;background:#5a4394}
.crook .medal{position:absolute;right:12%;top:16%;width:2.2vmin;height:2.2vmin;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #fca5a5, #7f1d1d);
  box-shadow:0 0 10px rgba(248,113,113,.5)}

/* ============ TV — the chaos he stares at ============ */
.tvzone{position:absolute;left:78%;top:27.5%;width:17vmin;z-index:1}
.tvbez{position:relative;width:17vmin;height:12.5vmin;border-radius:1vmin;
  background:linear-gradient(160deg,#241018,#120609);
  border:2px solid rgba(252,165,165,.5);
  box-shadow:0 0 30px rgba(248,113,113,.5),0 10px 22px rgba(0,0,0,.6)}
.screen{position:absolute;inset:1.1vmin;border-radius:.6vmin;overflow:hidden;
  background:#0c0508;
  animation:screenFlick .5s linear infinite}
.band{position:absolute;inset:0;
  background:linear-gradient(100deg, transparent 20%, rgba(254,202,202,.5) 45%, rgba(248,113,113,.28) 55%, transparent 80%);
  animation:bandSlide 1.7s linear infinite alternate}
.band.b2{background:linear-gradient(80deg, transparent 30%, rgba(255,190,160,.35) 50%, transparent 70%);
  animation:bandSlide2 2.9s linear infinite}
@keyframes bandSlide{from{transform:translateX(-45%)}to{transform:translateX(45%)}}
@keyframes bandSlide2{from{transform:translateX(35%)}to{transform:translateX(-35%)}}
.scan{position:absolute;inset:0;
  background:repeating-linear-gradient(to bottom, rgba(254,202,202,.14) 0 1px, transparent 1px 5px);
  animation:scanDown .9s linear infinite}
@keyframes scanDown{to{background-position:0 5px}}
@keyframes screenFlick{
  0%{opacity:.7}20%{opacity:1}35%{opacity:.65}50%{opacity:.95}70%{opacity:.6}100%{opacity:.9}}
.tvstand{position:absolute;left:79.5%;top:40.8%;width:14vmin;height:8vmin;z-index:1;border-radius:.8vmin;
  background:linear-gradient(#2e141d,#180910);
  border:2px solid rgba(252,165,165,.4);

/* ============ COUCH (side view) ============ */
.couch{position:absolute;left:27%;top:40%;width:44vmin;height:30vmin;z-index:2}

.cseat{position:absolute;left:0;right:0;top:21vmin;height:8.5vmin;border-radius:1vmin;

  background:#1e0a10}
.cleg.l{left:3vmin}
.cleg.r{right:4vmin}

/* ============ TOBY — calm, in profile, back to the pot ============ */
.tobyzone{position:absolute;left:30%;top:30%;width:34vmin;height:41vmin;z-index:3}
.fig{position:absolute;inset:0;width:100%;height:100%;
  filter:drop-shadow(0 0 9px rgba(248,113,113,.45))}
.breathe{transform-box:fill-box;transform-origin:50% 100%;
  animation:breatheT 4.2s ease-in-out infinite}
@keyframes breatheT{0%,100%{transform:translateY(0)}50%{transform:translateY(1.2)}}
.fig .body{fill:#080410;stroke:rgba(252,165,165,.36);stroke-width:1.3}
.fig .limb{fill:none;stroke:#080410;stroke-width:9.5;stroke-linecap:round}
.headg{transform-box:fill-box;transform-origin:50% 95%;
  animation:headNod 11s ease-in-out infinite}
@keyframes headNod{
  0%,30%{transform:rotate(14deg)}
  42%,58%{transform:rotate(-4deg)}
  70%,100%{transform:rotate(14deg)}}
.pharm{transform-box:fill-box;transform-origin:55% 90%;
  animation:armSway 6s ease-in-out infinite}
@keyframes armSway{0%,100%{transform:rotate(1deg)}50%{transform:rotate(-1deg)}}
.pglow{opacity:.8;animation:phonePulse 5s ease-in-out infinite}
@keyframes phonePulse{0%,100%{opacity:.45}50%{opacity:.95}}
.chat{animation:chatScroll 2.6s linear infinite}
@keyframes chatScroll{to{transform:translateY(-112px)}}
.typing{animation:typingPulse 1.2s ease-in-out infinite}
@keyframes typingPulse{0%,100%{opacity:.3}50%{opacity:.9}}

/* ============ COFFEE TABLE ============ */
.table{position:absolute;left:62%;top:56.2%;width:18vmin;height:13vmin;z-index:4}
.msteam{position:absolute;left:2.6vmin;top:-7.3vmin;width:2vmin;height:3.5vmin;border-radius:50%;
  filter:blur(.8vmin);opacity:0;
  background:radial-gradient(ellipse, rgba(254,202,202,.35), transparent 70%);
  animation:mugSteam 6s linear infinite}
@keyframes mugSteam{
  0%{transform:translateY(0) scale(.7);opacity:0}
  30%{opacity:.8}
  100%{transform:translateY(-3.5vmin) scale(1.3);opacity:0}}
.mug{position:absolute;left:1.2vmin;top:-3.2vmin;width:3.6vmin;height:3.6vmin;border-radius:.4vmin .4vmin 1vmin 1vmin;
  background:linear-gradient(#4a2330,#26121a);
  border:2px solid rgba(252,165,165,.5);
  animation:mugVibe .35s linear infinite alternate}
@keyframes mugVibe{from{transform:translateX(-.15vmin)}to{transform:translateX(.15vmin)}}
.mug::after{content:"";position:absolute;right:-1.5vmin;top:.7vmin;width:1.3vmin;height:1.9vmin;
  border:.5vmin solid rgba(252,165,165,.5);border-left:none;border-radius:0 1vmin 1vmin 0}
.remote{position:absolute;right:1.5vmin;top:-1.4vmin;width:6.5vmin;height:1.9vmin;border-radius:.6vmin;
  transform:rotate(-7deg);
  background:linear-gradient(#2e141d,#180910);
  border:1.5px solid rgba(252,165,165,.4)}
.remote::after{content:"";position:absolute;left:.6vmin;top:.5vmin;width:2.6vmin;height:.8vmin;border-radius:.4vmin;
  background:rgba(252,165,165,.4);box-shadow:.9vmin 0 0 rgba(252,165,165,.3)}
.ttop{position:absolute;left:0;right:0;top:0;height:3.4vmin;border-radius:.9vmin;
  background:linear-gradient(#4a2330,#2a1219);
  border:2px solid rgba(252,165,165,.45);
  box-shadow:0 10px 20px rgba(0,0,0,.55), inset 0 .5vmin 1vmin rgba(254,202,202,.25)}
.tleg{position:absolute;top:3.4vmin;width:2.2vmin;height:9vmin;border-radius:.5vmin;
  background:linear-gradient(#3a1a22,#1e0a10)}
.tleg.l{left:1.5vmin}
.tleg.r{right:1.5vmin}

/* ============ FLOOR: the fallout he never picked up ============ */
.fbox{position:absolute;left:14%;top:84%;width:14vmin;height:3.6vmin;z-index:1;
  border-radius:.5vmin;transform:rotate(-3deg);
  background:linear-gradient(#3a222c,#241218);
  border:1.5px solid rgba(252,165,165,.35);
  box-shadow:0 4px 8px rgba(0,0,0,.55)}
.fbox::after{content:"";position:absolute;left:calc(50% - 2.4vmin);top:calc(50% - .3vmin);
  width:4.8vmin;height:.6vmin;border-radius:.3vmin;background:rgba(252,165,165,.25)}
.shard{position:absolute;z-index:1;background:linear-gradient(160deg,#3a1a22,#22101a);
  border:1.5px solid rgba(252,165,165,.4);
  box-shadow:0 3px 6px rgba(0,0,0,.5)}
.shard.s1{left:7.5%;top:52.8%;width:4.4vmin;height:1.8vmin;
  clip-path:polygon(0 100%, 15% 0, 100% 30%, 85% 100%);transform:rotate(-8deg)}
.shard.s2{left:12.5%;top:53.6%;width:3vmin;height:1.4vmin;
  clip-path:polygon(0 60%, 40% 0, 100% 100%, 20% 100%);transform:rotate(12deg)}

/* ============ LIGHT ============ */
.tvwash{position:absolute;inset:0;z-index:5;pointer-events:none;
  background:radial-gradient(ellipse 40% 32% at 84% 40%, rgba(254,202,202,.19), transparent 72%);
  animation:tvwashFlick 3.7s linear infinite}
@keyframes tvwashFlick{
  0%{opacity:.55}6%{opacity:1}12%{opacity:.5}20%{opacity:.9}28%{opacity:.6}
  36%{opacity:1}45%{opacity:.5}55%{opacity:.95}64%{opacity:.55}75%{opacity:.85}
  85%{opacity:.5}94%{opacity:1}100%{opacity:.55}}

.dust{position:absolute;inset:0;z-index:5;pointer-events:none}
.p{position:absolute;border-radius:50%;background:var(--red-mid);
  box-shadow:0 0 9px rgba(252,165,165,.95);opacity:.55;
  animation:floatUp linear infinite}
.p1{left:9%;bottom:14%;width:4px;height:4px;animation-duration:19s;animation-delay:-3s}
.p2{left:22%;bottom:6%;width:6px;height:6px;animation-duration:23s;animation-delay:-11s}
.p3{left:35%;bottom:20%;width:4px;height:4px;animation-duration:16s;animation-delay:-7s}
.p4{left:47%;bottom:8%;width:5px;height:5px;animation-duration:21s;animation-delay:-15s}
.p5{left:58%;bottom:26%;width:4px;height:4px;animation-duration:18s;animation-delay:-2s}
.p6{left:66%;bottom:12%;width:6px;height:6px;animation-duration:24s;animation-delay:-9s}
.p7{left:78%;bottom:18%;width:4px;height:4px;animation-duration:17s;animation-delay:-13s}
.p8{left:88%;bottom:8%;width:5px;height:5px;animation-duration:22s;animation-delay:-5s}
.p9{left:15%;bottom:32%;width:4px;height:4px;animation-duration:20s;animation-delay:-17s}
.p10{left:28%;bottom:40%;width:5px;height:5px;animation-duration:21s;animation-delay:-8s}
.p11{left:62%;bottom:44%;width:4px;height:4px;animation-duration:18s;animation-delay:-14s}
.p12{left:84%;bottom:36%;width:5px;height:5px;animation-duration:23s;animation-delay:-6s}
@keyframes floatUp{
  0%{transform:translateY(0);opacity:0}
  12%{opacity:.6}
  85%{opacity:.5}
  100%{transform:translateY(-88vh);opacity:0}}
.vignette{position:absolute;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 62%, rgba(0,0,0,.4))}

/* ============ SEAL ============ */
.seal{position:absolute;right:2.6vmin;bottom:2.6vmin;z-index:10;
  width:15vmin;height:15vmin;opacity:.95;
  animation:sealPulse 4s ease-in-out infinite}
.seal .ringA{fill:none;stroke:var(--red-mid);stroke-width:2.5}
.seal .ringB{fill:none;stroke:rgba(252,165,165,.8);stroke-width:1.5}
.seal .txt{fill:#fecaca;font-family:'Outfit',sans-serif;font-weight:800;
  font-size:10.5px;letter-spacing:2px}
.seal .dot{fill:var(--red-mid)}
.seal .core{fill:#fecaca}
@keyframes sealPulse{
  0%,100%{filter:drop-shadow(0 0 6px rgba(252,165,165,.7))}
  50%{filter:drop-shadow(0 0 16px rgba(252,165,165,1))}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important}
  .steam,.msteam{opacity:.45}
  .flame{opacity:.9}
  .klight{opacity:.85}

  .pglow{opacity:.8}
  .led{opacity:.9}
  .drip,.emb,.spark{opacity:.75}
  .moth{opacity:.9}
  .p{opacity:.5}
}
</style>
</head>
